name: Publicar actualización Android de Dominó Flash Coin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión aprobada en el panel
        required: true
        type: string
      sha:
        description: Revisión de main aprobada en el panel
        required: true
        type: string

permissions:
  contents: write
  pages: write

concurrency:
  group: dfc-android-ota
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      DFC_VERSION: ${{ inputs.version }}
      DFC_APPROVED_SHA: ${{ inputs.sha }}
      DFC_PUBLIC_BASE: https://cakon170812-hub.github.io/marketflsh/android-approved
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validar la revisión y preparar el paquete
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import zipfile
          from datetime import datetime, timezone
          from html.parser import HTMLParser

          def stop(message):
              raise SystemExit(message)

          class AppVersion(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.values = []
                  self.has_native_bridge = False

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'meta' and attrs.get('name') == 'application-version':
                      self.values.append(attrs.get('content'))
                  if tag == 'script' and attrs.get('src', '').split('?')[0] == './native-bridge.js':
                      self.has_native_bridge = True

          def git(*args):
              return subprocess.check_output(['git', *args])

          version = os.environ['DFC_VERSION']
          approved = os.environ['DFC_APPROVED_SHA']
          pattern = r'0\.12Z\.(0|[1-9][0-9]{0,3})'
          match = re.fullmatch(pattern, version)
          if not match or not re.fullmatch(r'[a-f0-9]{40}', approved):
              stop('La versión o la revisión aprobada no es válida.')
          head = git('rev-parse', 'HEAD').decode().strip()
          dispatched = os.environ['GITHUB_SHA']
          if approved != dispatched:
              stop('La revisión aprobada cambió antes de iniciar. Revísala nuevamente en el panel.')

          root = pathlib.Path('android-approved')
          manifest_file = root / 'manifest.json'
          manifest = json.loads(manifest_file.read_text())
          previous = manifest.get('version', '')
          previous_match = re.fullmatch(pattern, previous)
          if not previous_match:
              stop('El manifiesto anterior tiene una versión inválida.')

          html = git('show', f'{approved}:index.html')
          parser = AppVersion()
          parser.feed(html.decode('utf-8'))
          if parser.values != [version] or not parser.has_native_bridge:
              stop('La revisión aprobada debe declarar esa versión y cargar el puente Android.')
          bundle = root / 'bundles' / f'{version}.zip'

          if version == previous and manifest.get('sha') == approved:
              if not bundle.is_file() or hashlib.sha256(bundle.read_bytes()).hexdigest() != manifest.get('sha256'):
                  stop('El ZIP ya registrado no coincide con el manifiesto.')
              print('El paquete ya existe. Se reintentará la publicación en Pages.')
          else:
              if int(match[1]) <= int(previous_match[1]):
                  stop('La versión debe ser posterior a la registrada.')
              if head != approved or bundle.exists():
                  stop('La revisión cambió o el número ya tiene un ZIP. Revisa el estado antes de publicar.')
              old_bundle = root / 'bundles' / f'{previous}.zip'
              if hashlib.sha256(old_bundle.read_bytes()).hexdigest() != manifest.get('sha256'):
                  stop('El paquete anterior no coincide con su manifiesto.')
              with zipfile.ZipFile(old_bundle) as old_zip:
                  names = old_zip.namelist()
                  if len(names) != len(set(names)) or not {'index.html', 'native-bridge.js'} <= set(names):
                      stop('El paquete anterior no tiene la estructura Android esperada.')
                  bridge = old_zip.read('native-bridge.js')
                  if b'CapacitorUpdater' not in bridge or b'dfcOTAUserButton' not in bridge:
                      stop('El puente compilado del paquete anterior no incluye el actualizador.')
                  with zipfile.ZipFile(bundle, 'x', zipfile.ZIP_DEFLATED) as new_zip:
                      for name in names:
                          new_zip.writestr(name, html if name == 'index.html' else old_zip.read(name))
              with zipfile.ZipFile(bundle) as new_zip:
                  if new_zip.testzip() is not None or new_zip.read('index.html') != html:
                      stop('El ZIP nuevo no contiene el HTML aprobado o está dañado.')
              manifest = {
                  'version': version,
                  'sha': approved,
                  'url': f"{os.environ['DFC_PUBLIC_BASE']}/bundles/{version}.zip",
                  'sha256': hashlib.sha256(bundle.read_bytes()).hexdigest(),
                  'type': 'capacitor-web-bundle',
                  'created_at': datetime.now(timezone.utc).isoformat(),
              }
              manifest_file.write_text(json.dumps(manifest, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f"checksum={manifest['sha256']}", file=output)
          PY
      - name: Guardar el paquete y el manifiesto
        shell: bash
        run: |
          set -euo pipefail
          git add android-approved/manifest.json "android-approved/bundles/$DFC_VERSION.zip"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Publicar actualización Android OTA $DFC_VERSION"
            git push origin HEAD:main
          fi
      - name: Solicitar publicación en GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Confirmar que Android puede descargar la versión
        env:
          EXPECTED_CHECKSUM: ${{ steps.package.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/dfc-public-manifest.json"
          bundle="$RUNNER_TEMP/dfc-public-bundle.zip"
          bundle_url="$DFC_PUBLIC_BASE/bundles/$DFC_VERSION.zip"
          for attempt in {1..24}; do
            query="?ota=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt"
            if curl -fsS --max-time 15 "$DFC_PUBLIC_BASE/manifest.json$query" -o "$manifest" &&
              jq -e --arg v "$DFC_VERSION" --arg sha "$DFC_APPROVED_SHA" \
                --arg sum "$EXPECTED_CHECKSUM" --arg url "$bundle_url" \
                '.version == $v and .sha == $sha and .sha256 == $sum and .url == $url' "$manifest" >/dev/null &&
              curl -fsS --max-time 25 "$bundle_url$query" -o "$bundle" &&
              printf '%s  %s\n' "$EXPECTED_CHECKSUM" "$bundle" | sha256sum --check --status; then
              printf '### Android %s publicada en GitHub Pages\n' "$DFC_VERSION" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo 'GitHub Pages todavía no sirve el manifiesto y el ZIP esperados.' >&2
          exit 1
