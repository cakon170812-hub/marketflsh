from pathlib import Path

html = r'''<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Market Flash">
<title>Market Flash</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#2563eb;--blue2:#1d4ed8;--bg:#f4f6fa;--card:#fff;--text:#111827;--muted:#64748b;--line:#e5e7eb;--danger:#dc2626;--ok:#16a34a}
html,body{width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
body{padding-bottom:82px}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) 12px 10px}
.topbar-inner{max-width:1200px;margin:auto;display:flex;align-items:center;gap:10px;min-height:52px}
.brand{font-size:22px;font-weight:900;white-space:nowrap}
.brand span{color:var(--blue)}
.icon-btn{width:43px;height:43px;border-radius:14px;background:#f1f5f9;display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.search{height:43px;flex:1;min-width:0;border:1px solid var(--line);background:#f8fafc;border-radius:14px;padding:0 13px;outline:none}
.search:focus{border-color:var(--blue);background:#fff}
.content{max-width:1200px;margin:auto;padding:14px 13px 30px}
.categories{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:10px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:700;color:#334155}
.chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.ad{background:linear-gradient(135deg,#fff,#eef4ff);border:1px solid #dbeafe;border-radius:20px;padding:18px;text-align:center;margin-bottom:18px;min-height:105px;display:flex;align-items:center;justify-content:center}
.ad small{color:var(--muted);font-weight:800}
.ad h3{margin:5px 0}
.ad p{color:var(--muted);font-size:13px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-head h2{font-size:21px}
.muted{color:var(--muted);font-size:13px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.product{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-width:0}
.product img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#e2e8f0;display:block}
.product-info{padding:11px}
.product-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-size:17px;font-weight:900;margin-top:5px}
.product-meta{font-size:12px;color:var(--muted);margin-top:5px}
.bottom{position:fixed;z-index:100;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);height:76px;padding:6px max(10px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center}
.bottom-inner{width:100%;max-width:700px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center}
.nav{background:transparent;color:#64748b;font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav.active{color:var(--blue)}
.nav-icon{font-size:21px}
.plus{width:55px;height:55px;border-radius:50%;background:var(--blue);color:#fff;font-size:30px;margin:auto;box-shadow:0 8px 22px rgba(37,99,235,.28)}
.overlay{position:fixed;z-index:300;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:680px;max-height:94vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:20px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-head h2{font-size:21px}
.close{width:40px;height:40px;border-radius:50%;background:#f1f5f9;font-size:23px}
.form{display:grid;gap:13px}
.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid #dbe1e8;border-radius:12px;padding:12px;outline:none;background:#fff}
.field textarea{min-height:100px;resize:vertical}
.primary,.secondary,.danger{width:100%;padding:13px;border-radius:12px;font-weight:800}
.primary{background:var(--blue);color:#fff}.secondary{background:#f1f5f9;color:var(--text)}.danger{background:#fee2e2;color:#991b1b}
.menu{display:grid;gap:8px}
.menu-item{width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;align-items:center;text-align:left;gap:12px}
.menu-icon{width:44px;height:44px;border-radius:13px;background:#eff6ff;display:grid;place-items:center;font-size:21px;flex:0 0 auto}
.menu-copy{flex:1}.menu-copy strong{display:block}.menu-copy small{display:block;color:var(--muted);margin-top:3px}
.profile{background:#f8fafc;border-radius:18px;padding:20px;text-align:center;margin-bottom:14px}
.avatar{width:78px;height:78px;border-radius:50%;background:#dbeafe;display:grid;place-items:center;font-size:35px;margin:0 auto 9px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left}
.card .big{font-size:28px;margin-bottom:8px}
.card strong{display:block}.card small{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.stat{background:#f8fafc;border-radius:14px;padding:14px}.stat b{font-size:22px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.toggle{width:54px;height:30px;border-radius:99px;background:#cbd5e1;position:relative}.toggle:after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.toggle.on{background:var(--blue)}.toggle.on:after{left:27px}
.notice{padding:13px;border-radius:13px;background:#eff6ff;color:#1e40af;font-size:13px;margin-bottom:12px}
.product-detail img{width:100%;max-height:420px;object-fit:cover;border-radius:18px}
.empty{text-align:center;padding:55px 20px;color:var(--muted);grid-column:1/-1}
.toast{position:fixed;z-index:600;left:50%;bottom:92px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;max-width:90%;text-align:center;box-shadow:0 8px 25px rgba(0,0,0,.2)}
@media(min-width:720px){
 .products{grid-template-columns:repeat(4,minmax(0,1fr))}
 .overlay{align-items:center;padding:20px}.sheet{border-radius:24px}
 .content{padding-left:20px;padding-right:20px}
}
@media(max-width:420px){
 .brand{font-size:19px}.icon-btn{width:40px;height:40px}.search{height:40px}.topbar-inner{gap:7px}
 .products{gap:9px}.product-info{padding:9px}.price{font-size:16px}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
 <div class="topbar-inner">
  <div class="brand">Market <span>Flash</span></div>
  <input id="search" class="search" type="search" placeholder="Buscar productos...">
  <button class="icon-btn" aria-label="Notificaciones" onclick="notifications()">🔔</button>
  <button class="icon-btn" aria-label="Perfil" onclick="openProfile()">👤</button>
 </div>
</header>

<main class="content">
 <div class="categories" id="categories">
  <button class="chip active" onclick="setCategory('Todos',this)">Todos</button>
  <button class="chip" onclick="setCategory('Celulares',this)">📱 Celulares</button>
  <button class="chip" onclick="setCategory('Computadoras',this)">💻 Computadoras</button>
  <button class="chip" onclick="setCategory('Videojuegos',this)">🎮 Videojuegos</button>
  <button class="chip" onclick="setCategory('Ropa',this)">👕 Ropa</button>
  <button class="chip" onclick="setCategory('Hogar',this)">🏠 Hogar</button>
  <button class="chip" onclick="setCategory('Vehículos',this)">🚗 Vehículos</button>
 </div>

 <section class="ad">
  <div><small>ESPACIO PUBLICITARIO</small><h3>📣 Publicidad Market Flash</h3><p>Aquí aparecerán los anuncios comerciales.</p></div>
 </section>

 <div class="section-head"><h2>Productos</h2><span id="count" class="muted"></span></div>
 <section id="products" class="products"></section>
</main>

<nav class="bottom">
 <div class="bottom-inner">
  <button class="nav active" id="navHome" onclick="home()"><span class="nav-icon">🏠</span>Inicio</button>
  <button class="plus" aria-label="Publicar" onclick="openPublish()">+</button>
  <button class="nav" id="navActivity" onclick="openActivity()"><span class="nav-icon">📦</span>Actividad</button>
 </div>
</nav>
</div>

<div id="overlay" class="overlay hidden"><div id="sheet" class="sheet"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
const STORAGE_USER='mf_user';
const STORAGE_PRODUCTS='mf_products';
const STORAGE_CONFIG='mf_config';
let category='Todos';
let user=JSON.parse(localStorage.getItem(STORAGE_USER)||'null');

const seed=[
 {id:1,name:'iPhone 15 Pro',category:'Celulares',price:45000,location:'Santo Domingo',seller:'Market Flash',image:'https://images.unsplash.com/photo-1696446702183-cbd13d5f2e88?auto=format&fit=crop&w=800&q=80',views:1284,likes:86,saves:34,profileVisits:21},
 {id:2,name:'Samsung Galaxy S24',category:'Celulares',price:38000,location:'Santiago',seller:'Tecnología RD',image:'https://images.unsplash.com/photo-1610945415295-d9bbf067e59c?auto=format&fit=crop&w=800&q=80',views:743,likes:51,saves:18,profileVisits:14},
 {id:3,name:'Laptop profesional',category:'Computadoras',price:52000,location:'Santo Domingo',seller:'Tech Store',image:'https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=800&q=80',views:491,likes:29,saves:11,profileVisits:8},
 {id:4,name:'PlayStation 5',category:'Videojuegos',price:32000,location:'Santo Domingo Este',seller:'Gaming RD',image:'https://images.unsplash.com/photo-1606813907291-d86efa9b94db?auto=format&fit=crop&w=800&q=80',views:952,likes:73,saves:42,profileVisits:25}
];
let products=JSON.parse(localStorage.getItem(STORAGE_PRODUCTS)||'null')||seed;

function saveProducts(){localStorage.setItem(STORAGE_PRODUCTS,JSON.stringify(products))}
function money(n){return new Intl.NumberFormat('es-DO',{style:'currency',currency:'DOP',maximumFractionDigits:0}).format(Number(n)||0)}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>x.classList.add('hidden'),2200)}
function show(html){document.getElementById('sheet').innerHTML=html;document.getElementById('overlay').classList.remove('hidden')}
function close(){document.getElementById('overlay').classList.add('hidden')}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')close()});

function render(){
 const q=document.getElementById('search').value.trim().toLowerCase();
 let list=products.filter(p=>(category==='Todos'||p.category===category)&&(!q||p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)||p.location.toLowerCase().includes(q)));
 document.getElementById('count').textContent=list.length+' '+(list.length===1?'producto':'productos');
 const box=document.getElementById('products');
 if(!list.length){box.innerHTML='<div class="empty"><div style="font-size:44px">🔎</div><h3>No encontramos productos</h3><p>Prueba otra búsqueda o categoría.</p></div>';return}
 box.innerHTML=list.map(p=>`<article class="product" onclick="openProduct(${p.id})"><img src="${p.image}" alt="${escapeHtml(p.name)}" onerror="this.style.objectFit='contain';this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22600%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23e2e8f0%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22 font-size=%2260%22%3E📦%3C/text%3E%3C/svg%3E'"><div class="product-info"><div class="product-name">${escapeHtml(p.name)}</div><div class="price">${money(p.price)}</div><div class="product-meta">📍 ${escapeHtml(p.location)}</div></div></article>`).join('');
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
document.getElementById('search').addEventListener('input',render);
function setCategory(c,b){category=c;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function home(){close();category='Todos';document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));document.querySelector('.chip').classList.add('active');document.getElementById('navHome').classList.add('active');document.getElementById('navActivity').classList.remove('active');render()}
function notifications(){show(`<div class="modal-head"><h2>🔔 Notificaciones</h2><button class="close" onclick="close()">×</button></div><div class="notice">No tienes notificaciones nuevas.</div><button class="secondary" onclick="close()">Cerrar</button>`)}

function openProduct(id){
 const p=products.find(x=>x.id===id);if(!p)return;p.views++;saveProducts();
 show(`<div class="modal-head"><h2>${escapeHtml(p.name)}</h2><button class="close" onclick="close()">×</button></div>
 <div class="product-detail"><img src="${p.image}" alt="${escapeHtml(p.name)}"><div style="margin-top:14px"><div class="price" style="font-size:27px">${money(p.price)}</div><div class="muted">📍 ${escapeHtml(p.location)}</div></div>
 <div class="card" style="margin-top:14px"><strong>👤 Vendedor</strong><div class="muted" style="margin-top:4px">${escapeHtml(p.seller)}</div></div>
 <div class="stats"><div class="stat"><b>${p.views}</b><span>👁️ Visualizaciones</span></div><div class="stat"><b>${p.likes}</b><span>❤️ Reacciones</span></div><div class="stat"><b>${p.saves}</b><span>🔖 Guardados</span></div><div class="stat"><b>${p.profileVisits}</b><span>👤 Visitas al perfil</span></div></div>
 <button class="primary" style="margin-top:14px" onclick="like(${p.id})">❤️ Me interesa</button>
 <button class="secondary" style="margin-top:8px" onclick="contact('${escapeHtml(p.seller)}')">📞 Contactar vendedor</button></div>`);
}
function like(id){const p=products.find(x=>x.id===id);p.likes++;saveProducts();toast('❤️ Interés registrado');openProduct(id)}
function contact(seller){toast('📞 Contacto con '+seller+' preparado para la próxima etapa')}

function openPublish(){
 show(`<div class="modal-head"><h2>➕ Publicar producto</h2><button class="close" onclick="close()">×</button></div>
 <form class="form" id="publishForm">
 <div class="field"><label>📸 Imagen</label><input id="pImage" type="url" placeholder="URL de la imagen" required></div>
 <div class="field"><label>🏷️ Nombre</label><input id="pName" required placeholder="Ej. iPhone 15 Pro"></div>
 <div class="field"><label>📂 Categoría</label><select id="pCat" required><option value="">Seleccionar</option><option>Celulares</option><option>Computadoras</option><option>Videojuegos</option><option>Ropa</option><option>Hogar</option><option>Vehículos</option></select></div>
 <div class="field"><label>💰 Precio</label><input id="pPrice" type="number" min="0" required></div>
 <div class="field"><label>📍 Ubicación</label><input id="pLoc" required placeholder="Ciudad o provincia"></div>
 <div class="field"><label>📝 Descripción</label><textarea id="pDesc" placeholder="Describe el producto"></textarea></div>
 <button class="primary">🚀 Publicar</button></form>`);
 document.getElementById('publishForm').onsubmit=e=>{e.preventDefault();if(!user){toast('Debes crear una cuenta o iniciar sesión');return}
 products.unshift({id:Date.now(),name:pName.value,category:pCat.value,price:Number(pPrice.value),location:pLoc.value,seller:user.name,image:pImage.value,description:pDesc.value,views:0,likes:0,saves:0,profileVisits:0});saveProducts();close();render();toast('✅ Producto publicado')};
}

function openProfile(){
 if(!user){show(`<div class="modal-head"><h2>👤 Mi cuenta</h2><button class="close" onclick="close()">×</button></div><div class="profile"><div class="avatar">👤</div><h3>Bienvenido a Market Flash</h3><p class="muted" style="margin:6px 0 16px">Crea tu cuenta o inicia sesión.</p><button class="primary" onclick="register()">📝 Crear cuenta</button><button class="secondary" style="margin-top:8px" onclick="login()">🔐 Iniciar sesión</button></div>`);return}
 show(`<div class="modal-head"><h2>👤 Mi perfil</h2><button class="close" onclick="close()">×</button></div><div class="profile"><div class="avatar">👤</div><h2>${escapeHtml(user.name)}</h2><p class="muted">Cédula registrada</p></div>
 <div class="menu">
 <button class="menu-item" onclick="openActivity()"><div class="menu-icon">📦</div><div class="menu-copy"><strong>Mi actividad</strong><small>Publicaciones, productos, ventas y recibos</small></div><b>›</b></button>
 <button class="menu-item" onclick="settings()"><div class="menu-icon">⚙️</div><div class="menu-copy"><strong>Configuración</strong><small>Cuenta y seguridad</small></div><b>›</b></button>
 <button class="menu-item" onclick="admin()"><div class="menu-icon">👑</div><div class="menu-copy"><strong>Administración</strong><small>Panel exclusivo del administrador</small></div><b>›</b></button>
 <button class="menu-item" onclick="logout()"><div class="menu-icon">🚪</div><div class="menu-copy"><strong>Cerrar sesión</strong><small>Salir de la cuenta</small></div><b>›</b></button></div>`);
}

function register(){
 show(`<div class="modal-head"><h2>📝 Crear cuenta</h2><button class="close" onclick="close()">×</button></div>
 <div class="notice">La cédula es obligatoria. El correo electrónico es opcional.</div>
 <form class="form" id="regForm">
 <div class="field"><label>👤 Nombre real completo</label><input id="rName" required placeholder="Igual que en la cédula"></div>
 <div class="field"><label>🪪 Número de cédula</label><input id="rCed" required placeholder="Número de cédula"></div>
 <div class="field"><label>🔐 Contraseña</label><input id="rPass" type="password" minlength="6" required></div>
 <div class="field"><label>🛡️ Pregunta de recuperación</label><select id="rQ" required><option value="">Seleccionar</option><option>¿Cuál era tu apodo de infancia?</option><option>¿Cuál fue tu primer trabajo?</option><option>¿Cuál es tu comida favorita?</option><option>¿Cuál era el nombre de tu primera mascota?</option></select></div>
 <div class="field"><label>🛡️ Respuesta de recuperación</label><input id="rA" required></div>
 <div class="field"><label>📧 Correo electrónico (opcional)</label><input id="rEmail" type="email"></div>
 <button class="primary">Crear cuenta</button></form>`);
 document.getElementById('regForm').onsubmit=e=>{e.preventDefault();user={name:rName.value.trim(),cedula:rCed.value.trim(),password:rPass.value,question:rQ.value,answer:rA.value.trim().toLowerCase(),email:rEmail.value.trim(),blocked:false};localStorage.setItem(STORAGE_USER,JSON.stringify(user));close();toast('✅ Cuenta creada correctamente')};
}
function login(){
 show(`<div class="modal-head"><h2>🔐 Iniciar sesión</h2><button class="close" onclick="close()">×</button></div><form class="form" id="loginForm"><div class="field"><label>🪪 Cédula</label><input id="lCed" required></div><div class="field"><label>🔐 Contraseña</label><input id="lPass" type="password" required></div><button class="primary">Entrar</button></form><button class="secondary" style="margin-top:8px" onclick="recovery()">🔑 Recuperar contraseña</button>`);
 document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();const saved=JSON.parse(localStorage.getItem(STORAGE_USER)||'null');if(!saved){toast('No existe una cuenta');return}if(saved.blocked){toast('🚫 Cuenta bloqueada por administración');return}if(saved.cedula===lCed.value.trim()&&saved.password===lPass.value){user=saved;close();toast('✅ Sesión iniciada')}else toast('❌ Cédula o contraseña incorrecta')};
}
function recovery(){
 const saved=JSON.parse(localStorage.getItem(STORAGE_USER)||'null');if(!saved){toast('No existe una cuenta');return}
 show(`<div class="modal-head"><h2>🔑 Recuperar contraseña</h2><button class="close" onclick="close()">×</button></div><div class="notice">${escapeHtml(saved.question)}</div><div class="field"><label>Respuesta</label><input id="recA"></div><button class="primary" style="margin-top:12px" onclick="verifyRecovery()">Verificar</button>`);
}
function verifyRecovery(){const saved=JSON.parse(localStorage.getItem(STORAGE_USER)||'null');if(recA.value.trim().toLowerCase()===saved.answer){toast('✅ Identidad verificada. La recuperación segura se conectará al backend.')}else toast('❌ Respuesta incorrecta')}

function openActivity(){
 if(!user){openProfile();return}
 document.getElementById('navActivity').classList.add('active');document.getElementById('navHome').classList.remove('active');
 const mine=products.filter(p=>p.seller===user.name);
 show(`<div class="modal-head"><h2>📦 Mi actividad</h2><button class="close" onclick="close();home()">×</button></div><div class="grid">
 <button class="card" onclick="myPublications()"><div class="big">📢</div><strong>Mis publicaciones</strong><small>Ver estadísticas y administrar</small></button>
 <button class="card" onclick="myProducts()"><div class="big">📦</div><strong>Mis productos</strong><small>${mine.length} productos</small></button>
 <button class="card" onclick="mySales()"><div class="big">💰</div><strong>Mis ventas</strong><small>Registro de ventas</small></button>
 <button class="card" onclick="receipts()"><div class="big">🧾</div><strong>Mis recibos</strong><small>Comprobantes</small></button>
 <button class="card" onclick="favorites()"><div class="big">❤️</div><strong>Favoritos</strong><small>Productos guardados</small></button>
 <button class="card" onclick="historyPage()"><div class="big">📋</div><strong>Historial</strong><small>Actividad reciente</small></button></div>`);
}
