<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MARKET FLASH ⚡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="welcome-body">
  
  <div class="welcome-container">
    
    <!-- LOGO ANIMADO -->
    <div class="logo-flash-container">
      <div class="logo-flash">⚡</div>
      <h1 class="logo-text">MARKET FLASH</h1>
      <p class="logo-slogan">Compra y Vende en un Flash</p>
    </div>

    <!-- BOTONES PRINCIPALES -->
    <div class="welcome-buttons">
      <button class="btn-primary btn-large" onclick="irA('auth.html')">Iniciar Sesión</button>
      <button class="btn-secondary btn-large" onclick="irA('auth.html?tab=registro')">Crear Cuenta</button>
    </div>

    <!-- LOGIN SOCIAL -->
    <div class="social-login">
      <p>O continúa con</p>
      <div class="social-buttons">
        <button class="btn-social" onclick="loginGoogle()">
          <span>G</span> Google
        </button>
        <button class="btn-social" onclick="loginApple()">
          <span></span> Apple
        </button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>    <!-- EFECTO DE FONDO FLASH -->
    <div class="flash-bg"></div>
    
    <!-- PARTICULAS DE ENERGIA -->
    <div class="particles">
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
    </div>

  </div>

  <!-- SCRIPT DE ANIMACION Y TRANSICION -->
  <script>
    // Animación de entrada del logo
    window.addEventListener('load', () => {
      document.querySelector('.logo-flash').classList.add('animate-flash');
      document.querySelector('.logo-text').classList.add('animate-fade-in');
    });

    // Función para ir a otra página con transición
    function irA(pagina) {
      document.body.classList.add('fade-out');
      setTimeout(() => {
        window.location.href = pagina;
      }, 300);
    }

    // Login con Google - Placeholder para Supabase
    async function loginGoogle() {
      // Se conectará con supabase.auth.signInWithOAuth
      alert('Login con Google - Se activará en Fase 4');
    }

    // Login con Apple - Placeholder para Supabase
    async function loginApple() {
      // Se conectará con supabase.auth.signInWithOAuth
      alert('Login con Apple - Se activará en Fase 4');
    }
  </script>    <!-- FOOTER -->

  </div>

</body>
</html>
