<!-- ACTUALIZACIÓN MARKET FLASH -->

<!-- 1. WHATSAPP EN REGISTRO -->
<input
  id="rWhatsApp"
  type="tel"
  inputmode="numeric"
  required
  placeholder="Ej. 18094024099"
  maxlength="11"
>

<!-- 2. BOTONES DE CÁMARA Y GALERÍA -->
<div class="media-options">

  <button
    type="button"
    class="media-button"
    onclick="takePhoto()">

    <span class="media-icon">📷</span>
    Cámara

  </button>

  <button
    type="button"
    class="media-button"
    onclick="chooseGallery()">

    <span class="media-icon">🖼️</span>
    Galería

  </button>

</div>

<input
  id="cameraInput"
  type="file"
  accept="image/*"
  capture="environment"
  hidden
>

<input
  id="galleryInput"
  type="file"
  accept="image/*"
  hidden
>

<input id="pImage" type="hidden">

<img
  id="imagePreview"
  class="preview"
  alt="Vista previa"
>


<!-- 3. BOTÓN DE ESTADO DE PUBLICIDAD -->
<button
  class="menu-item"
  onclick="myAdvertisingStatus()">

  <div class="menu-icon">📋</div>

  <div class="menu-copy">
    <strong>Estado de mi publicidad</strong>
    <small>
      Ver si está en proceso, aprobada o rechazada
    </small>
  </div>

  <b>›</b>

</button>


<!-- 4. FOTO DE PERFIL -->
<button
  class="secondary"
  style="margin-top:10px"
  onclick="editProfilePhoto()">

  📷 Cambiar foto de perfil

</button>


<!-- 5. ESTADÍSTICAS DEL ADMINISTRADOR -->
<div class="grid">

  <div class="card">
    <div class="big" id="registeredUsersCount">0</div>
    <strong>Usuarios registrados</strong>
    <small>Total de cuentas creadas</small>
  </div>

  <div class="card">
    <div class="big" id="deletedUsersCount">0</div>
    <strong>Cuentas eliminadas</strong>
    <small>Total de cuentas eliminadas</small>
  </div>

</div>


<!-- 6. ELIMINAR CUENTA -->
<button
  class="danger"
  style="margin-top:12px"
  onclick="deleteAccount()">

  🗑️ Eliminar mi cuenta

</button>


<!-- 7. COMPROBANTE DE PAGO -->
<div class="field">

  <label>
    📸 Captura / comprobante de pago
  </label>

  <input
    id="paymentProof"
    type="file"
    accept="image/*"
  >

  <small class="muted">
    Envía una captura del pago para que el administrador
    pueda revisar y aprobar tu publicidad.
  </small>

</div>


<!-- 8. ESTADO DE PUBLICIDAD -->
<div class="notice">

  <strong>Estado de publicidad:</strong>

  <span id="advertisingStatus">
    ⏳ En proceso
  </span>

</div>


<script>

/* =========================================
   ACTUALIZACIÓN MARKET FLASH
========================================= */

const STORAGE_STATS = 'mf_stats';


/* =========================================
   ESTADÍSTICAS
========================================= */

function getStats(){

  try{

    return JSON.parse(
      localStorage.getItem(STORAGE_STATS)
    ) || {
      registeredTotal:0,
      deletedTotal:0
    };

  }catch(error){

    return {
      registeredTotal:0,
      deletedTotal:0
    };

  }

}


function saveStats(stats){

  localStorage.setItem(
    STORAGE_STATS,
    JSON.stringify(stats)
  );

}


/* =========================================
   REGISTRO
========================================= */

function registerUser(){

  const whatsapp =
    document.getElementById('rWhatsApp')
      .value
      .trim()
      .replace(/\D/g,'');


  if(!/^1\d{10}$/.test(whatsapp)){

    toast(
      'El WhatsApp debe tener 11 números. Ejemplo: 18094024099'
    );

    return false;

  }


  user = {

    name:
      document.getElementById('rName')
        .value
        .trim(),

    cedula:
      document.getElementById('rCed')
        .value
        .trim(),

    whatsapp:whatsapp,

    password:
      document.getElementById('rPass')
        .value,

    question:
      document.getElementById('rQ')
        .value,

    answer:
      document.getElementById('rA')
        .value
        .trim()
        .toLowerCase(),

    email:
      document.getElementById('rEmail')
        .value
        .trim(),

    blocked:false,

    photo:''

  };


  localStorage.setItem(
    STORAGE_USER,
    JSON.stringify(user)
  );


  const stats = getStats();

  stats.registeredTotal++;

  saveStats(stats);


  close();

  toast('✅ Cuenta creada correctamente');

  return true;

}


/* =========================================
   CÁMARA
========================================= */

function takePhoto(){

  const input =
    document.getElementById('cameraInput');

  if(input){

    input.click();

  }

}


/* =========================================
   GALERÍA
========================================= */

function chooseGallery(){

  const input =
    document.getElementById('galleryInput');

  if(input){

    input.click();

  }

}


/* =========================================
   FOTO DEL PRODUCTO
========================================= */

function handleImage(event){

  const file =
    event.target.files[0];

  if(!file) return;


  if(!file.type.startsWith('image/')){

    toast('Selecciona una imagen válida');

    return;

  }


  const reader =
    new FileReader();


  reader.onload=function(e){

    const image =
      document.getElementById('pImage');

    const preview =
      document.getElementById('imagePreview');


    if(image){

      image.value =
        e.target.result;

    }


    if(preview){

      preview.src =
        e.target.result;

      preview.style.display =
        'block';

    }

  };


  reader.readAsDataURL(file);

}


/* =========================================
   FOTO DE PERFIL
========================================= */

function editProfilePhoto(){

  show(`

    <div class="modal-head">

      <button
        class="back"
        onclick="openProfile()">
        ←
      </button>

      <h2 style="flex:1;margin-left:8px">
        📷 Cambiar foto
      </h2>

      <button
        class="close"
        onclick="close()">
        ×
      </button>

    </div>


    <div class="media-options">

      <button
        type="button"
        class="media-button"
        onclick="profileCamera()">

        <span class="media-icon">
          📷
        </span>

        Cámara

      </button>


      <button
        type="button"
        class="media-button"
        onclick="profileGallery()">

        <span class="media-icon">
          🖼️
        </span>

        Galería

      </button>

    </div>


    <input
      id="profileCameraInput"
      type="file"
      accept="image/*"
      capture="environment"
      hidden
    >


    <input
      id="profileGalleryInput"
      type="file"
      accept="image/*"
      hidden
    >

  `);


  document
    .getElementById('profileCameraInput')
    .addEventListener(
      'change',
      handleProfilePhoto
    );


  document
    .getElementById('profileGalleryInput')
    .addEventListener(
      'change',
      handleProfilePhoto
    );

}


function profileCamera(){

  document
    .getElementById('profileCameraInput')
    .click();

}


function profileGallery(){

  document
    .getElementById('profileGalleryInput')
    .click();

}


function handleProfilePhoto(event){

  const file =
    event.target.files[0];

  if(!file) return;


  if(!file.type.startsWith('image/')){

    toast('Selecciona una imagen válida');

    return;

  }


  const reader =
    new FileReader();


  reader.onload=function(e){

    if(!user) return;


    user.photo =
      e.target.result;


    localStorage.setItem(
      STORAGE_USER,
      JSON.stringify(user)
    );


    toast(
      '✅ Foto de perfil actualizada'
    );


    openProfile();

  };


  reader.readAsDataURL(file);

}


/* =========================================
   ESTADO DE PUBLICIDAD
========================================= */

function myAdvertisingStatus(){

  if(!user){

    openProfile();

    return;

  }


  const myAds =
    ads.filter(
      ad => ad.user === user.name
    );


  if(!myAds.length){

    show(`

      <div class="modal-head">

        <button
          class="back"
          onclick="openAdvertising()">
          ←
        </button>

        <h2 style="flex:1;margin-left:8px">
          📋 Estado de mi publicidad
        </h2>

        <button
          class="close"
          onclick="close()">
          ×
        </button>

      </div>


      <div class="empty">

        📣<br><br>

        No tienes ninguna publicidad
        enviada todavía.

      </div>


      <button
        class="primary"
        onclick="createAdvertising()">

        🚀 Crear mi publicidad

      </button>

    `);

    return;

  }


  show(`

    <div class="modal-head">

      <button
        class="back"
        onclick="openAdvertising()">
        ←
      </button>

      <h2 style="flex:1;margin-left:8px">
        📋 Estado de mi publicidad
      </h2>

      <button
        class="close"
        onclick="close()">
        ×
      </button>

    </div>


    ${myAds.map(ad=>`

      <div
        class="card"
        style="margin-bottom:10px">

        <strong>
          ${escapeHtml(ad.title)}
        </strong>


        <div
          class="muted"
          style="margin-top:6px">

          ${

            ad.status === 'aprobado'

            ? '✅ Aprobada'

            : ad.status === 'rechazado'

            ? '❌ Rechazada'

            : '⏳ En proceso'

          }

        </div>

      </div>

    `).join('')}

  `);

}


/* =========================================
   ELIMINAR CUENTA
========================================= */

function deleteAccount(){

  if(!user) return;


  const ok =
    confirm(
      '¿Seguro que deseas eliminar tu cuenta?'
    );


  if(!ok) return;


  const stats =
    getStats();


  stats.deletedTotal++;


  saveStats(stats);


  localStorage.removeItem(
    STORAGE_USER
  );


  user=null;


  close();


  toast(
    '🗑️ Cuenta eliminada correctamente'
  );

}


/* =========================================
   COMPROBANTE DE PAGO
========================================= */

async function getPaymentProof(){

  const input =
    document.getElementById(
      'paymentProof'
    );


  if(!input ||
     !input.files ||
     !input.files[0]){

    return '';

  }


  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();


      reader.onload =
        () => resolve(
          reader.result
        );


      reader.onerror =
        reject;


      reader.readAsDataURL(
        input.files[0]
      );

    }
  );

}


/* =========================================
   APROBAR PUBLICIDAD
========================================= */

function approveAd(id){

  const ad =
    ads.find(
      x => x.id === id
    );


  if(!ad) return;


  ad.status =
    'aprobado';


  saveAds();


  /*
    IMPORTANTE:
    Al aprobar una publicidad,
    inmediatamente se actualiza
    el espacio publicitario del inicio.
  */

  renderAdvertisingSpot();


  adminAdvertising();


  toast(
    '✅ Publicidad aprobada y publicada en el inicio'
  );

}


/* =========================================
   RECHAZAR PUBLICIDAD
========================================= */

function rejectAd(id){

  const ad =
    ads.find(
      x => x.id === id
    );


  if(!ad) return;


  ad.status =
    'rechazado';


  saveAds();


  adminAdvertising();


  toast(
    '❌ Publicidad rechazada'
  );

}


/* =========================================
   PUBLICIDAD APROBADA EN EL INICIO
========================================= */

function renderAdvertisingSpot(){

  const area =
    document.querySelector('.ad');


  if(!area) return;


  const approved =
    ads
      .filter(
        ad => ad.status === 'aprobado'
      )
      .sort(
        (a,b) =>
          new Date(b.createdAt || 0)
          -
          new Date(a.createdAt || 0)
      );


  if(!approved.length){

    area.innerHTML = `

      <button
        class="ad-button"
        onclick="openAdvertising()">

        <small>
          PUBLICIDAD
        </small>

        <h3>
          📣 Publicita tu negocio
          en Market Flash
        </h3>

        <p>
          Toca aquí para crear y publicar
          tu anuncio.
        </p>

      </button>

    `;

    return;

  }


  const ad =
    approved[0];


  let media='';


  if(ad.mediaType === 'video'){

    media = `

      <video
        class="ad-live-media"
        controls
        playsinline
        src="${ad.media}">
      </video>

    `;

  }else{

    media = `

      <img
        class="ad-live-media"
        src="${ad.media}"
        alt="${escapeHtml(ad.title)}"
      >

    `;

  }


  area.innerHTML = `

    <div style="width:100%">

      <small>
        PUBLICIDAD
      </small>

      <h3>
        ${escapeHtml(ad.title)}
      </h3>

      ${media}


      ${
        ad.description
        ?
        `
        <p style="margin-top:8px">
          ${escapeHtml(ad.description)}
        </p>
        `
        :
        ''
      }


      ${
        ad.destinationType !== 'none'
        ?
        `
        <button
          class="primary"
          style="margin-top:10px"
          onclick="openAdDestination(${ad.id})">

          ${
            ad.destinationType === 'whatsapp'
            ? '🟢 WhatsApp'
            : ad.destinationType === 'messenger'
            ? '🔵 Messenger'
            : '🌐 Ver enlace'
          }

        </button>
        `
        :
        ''
      }


      <button
        class="secondary"
        style="margin-top:8px"
        onclick="openAdvertising()">

        📣 Crear mi publicidad

      </button>

    </div>

  `;

}


/* =========================================
   DESTINO DE PUBLICIDAD
========================================= */

function openAdDestination(id){

  const ad =
    ads.find(
      x => x.id === id
    );


  if(!ad ||
     !ad.destination){

    return;

  }


  let url =
    ad.destination;


  if(
    ad.destinationType ===
    'whatsapp'
  ){

    url =
      'https://wa.me/' +
      String(
        ad.destination
      ).replace(/\D/g,'') +
      '?text=' +
      encodeURIComponent(
        'Hola, vi tu publicidad "' +
        ad.title +
        '" en Market Flash.'
      );

  }


  if(
    ad.destinationType !==
    'whatsapp' &&
    !/^https?:\/\//i.test(url)
  ){

    url =
      'https://' + url;

  }


  window.open(
    url,
    '_blank'
  );

}


/* =========================================
   INICIO
========================================= */

document.addEventListener(
  'DOMContentLoaded',
  function(){

    render();

    renderAdvertisingSpot();

  }
);

</script>
