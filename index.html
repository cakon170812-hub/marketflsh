<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content="Michael Flash - Compra, vende, descubre y promociona."
    >

    <meta name="theme-color" content="#0b5cff">

    <title>Michael Flash</title>

    <link rel="stylesheet" href="style.css">

    <!-- =====================================================
         DISEÑO MOBILE-FIRST MICHAEL FLASH
         ===================================================== -->

    <style>
        :root {
            --mf-blue: #0b5cff;
            --mf-blue-dark: #073ba5;
            --mf-blue-soft: #eaf2ff;
            --mf-cyan: #00c6ff;
            --mf-purple: #7c3aed;
            --mf-green: #25d366;
            --mf-messenger: #0084ff;
            --mf-white: #ffffff;
            --mf-bg: #f7faff;
            --mf-card: rgba(255,255,255,.94);
            --mf-text: #0f172a;
            --mf-muted: #64748b;
            --mf-border: rgba(15,23,42,.09);
            --mf-danger: #ef4444;
            --mf-radius: 22px;
            --mf-shadow: 0 12px 35px rgba(15,23,42,.08);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            color: var(--mf-text);
            background:
                radial-gradient(circle at 10% 15%, rgba(0,198,255,.10), transparent 24%),
                radial-gradient(circle at 85% 20%, rgba(124,58,237,.08), transparent 25%),
                linear-gradient(180deg, #ffffff 0%, var(--mf-bg) 55%, #ffffff 100%);
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            pointer-events: none;
            z-index: -1;
            border-radius: 999px;
            filter: blur(2px);
            opacity: .45;
        }

        body::before {
            width: 190px;
            height: 190px;
            top: 150px;
            left: -100px;
            background: linear-gradient(
                135deg,
                rgba(11,92,255,.16),
                rgba(0,198,255,.05)
            );
            animation: mfFloatOne 10s ease-in-out infinite;
        }

        body::after {
            width: 240px;
            height: 240px;
            right: -110px;
            top: 420px;
            background: linear-gradient(
                135deg,
                rgba(124,58,237,.11),
                rgba(11,92,255,.04)
            );
            animation: mfFloatTwo 13s ease-in-out infinite;
        }

        @keyframes mfFloatOne {
            0%, 100% {
                transform: translate3d(0,0,0);
            }
            50% {
                transform: translate3d(25px,45px,0);
            }
        }

        @keyframes mfFloatTwo {
            0%, 100% {
                transform: translate3d(0,0,0);
            }
            50% {
                transform: translate3d(-25px,-35px,0);
            }
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        img {
            max-width: 100%;
            display: block;
        }

        .hidden {
            display: none !important;
        }

        /* =====================================================
           HEADER
           ===================================================== */

        .site-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding:
                max(10px, env(safe-area-inset-top))
                14px
                12px;
            background: rgba(255,255,255,.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(15,23,42,.07);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .brand-logo {
            position: relative;
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            color: #ffffff;
            font-weight: 900;
            letter-spacing: -.05em;
            background:
                linear-gradient(135deg, var(--mf-blue), var(--mf-cyan) 55%, var(--mf-purple));
            box-shadow:
                0 10px 25px rgba(11,92,255,.25);
            overflow: hidden;
        }

        .brand-logo::after {
            content: "";
            position: absolute;
            width: 65px;
            height: 16px;
            background: rgba(255,255,255,.32);
            transform: rotate(-35deg) translateX(-45px);
            animation: mfShine 4s linear infinite;
        }

        @keyframes mfShine {
            0% {
                transform: rotate(-35deg) translateX(-90px);
            }
            55%,100% {
                transform: rotate(-35deg) translateX(100px);
            }
        }

        .brand-info {
            min-width: 0;
        }

        .brand-info h1 {
            margin: 0;
            font-size: 1.06rem;
            line-height: 1.1;
            font-weight: 900;
            letter-spacing: -.03em;
        }

        .brand-info p {
            margin: 4px 0 0;
            color: var(--mf-muted);
            font-size: .74rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 7px;
            flex: 0 0 auto;
        }

        .header-actions button {
            min-height: 42px;
            padding: 0 12px;
            border-radius: 14px;
            font-size: .76rem;
            font-weight: 800;
        }

        #btn-registrarse {
            color: var(--mf-blue);
            background: var(--mf-blue-soft);
        }

        #btn-iniciar-sesion {
            color: #ffffff;
            background: linear-gradient(135deg, var(--mf-blue), var(--mf-purple));
            box-shadow: 0 7px 18px rgba(11,92,255,.18);
        }

        #btn-perfil {
            display: none;
            color: var(--mf-text);
            background: #ffffff;
            border: 1px solid var(--mf-border);
        }

        #btn-administrador {
            display: none;
        }

        /* =====================================================
           NAV
           ===================================================== */

        .main-nav {
            display: none;
        }

        /* =====================================================
           SEARCH
           ===================================================== */

        .mobile-search-wrap {
            margin: 13px auto 0;
            max-width: 720px;
        }

        #form-busqueda {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            width: 100%;
        }

        #buscar {
            width: 100%;
            min-height: 46px;
            padding: 0 16px;
            border-radius: 16px;
            border: 1px solid rgba(11,92,255,.14);
            outline: none;
            color: var(--mf-text);
            background: #ffffff;
            box-shadow:
                0 8px 26px rgba(15,23,42,.06),
                inset 0 0 0 1px rgba(255,255,255,.65);
        }

        #buscar:focus {
            border-color: rgba(11,92,255,.42);
            box-shadow:
                0 0 0 4px rgba(11,92,255,.08),
                0 12px 28px rgba(11,92,255,.10);
        }

        #form-busqueda button[type="submit"] {
            min-width: 48px;
            min-height: 46px;
            padding: 0 15px;
            border-radius: 16px;
            display: inline-grid;
            place-items: center;
            color: #ffffff;
            background: linear-gradient(135deg, #0b5cff, #2582ff);
            box-shadow: 0 9px 22px rgba(11,92,255,.25);
            position: relative;
            overflow: hidden;
            font-size: 0;
        }

        #form-busqueda button[type="submit"]::before {
            content: "⌕";
            font-size: 1.55rem;
            line-height: 1;
            font-weight: 900;
        }

        #form-busqueda button[type="submit"]::after {
            content: "";
            position: absolute;
            inset: -20%;
            background: linear-gradient(
                110deg,
                transparent 25%,
                rgba(255,255,255,.42) 50%,
                transparent 75%
            );
            animation: mfSearchGlow 2.8s linear infinite;
        }

        @keyframes mfSearchGlow {
            0% {
                transform: translateX(-75%);
            }
            100% {
                transform: translateX(75%);
            }
        }

        #btn-limpiar-busqueda {
            display: none !important;
        }

        /* =====================================================
           MAIN
           ===================================================== */

        main {
            position: relative;
            padding-bottom: 110px;
        }

        .page-section {
            display: none;
            width: min(100%, 1180px);
            margin: 0 auto;
            padding: 14px 14px 0;
        }

        .page-section.active {
            display: block;
            animation: mfSectionIn .35s ease;
        }

        @keyframes mfSectionIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =====================================================
           HERO
           ===================================================== */

        .hero-section {
            position: relative;
            margin-top: 10px;
            border-radius: 28px;
            padding: 28px 20px;
            color: #ffffff;
            overflow: hidden;
            background:
                radial-gradient(circle at 80% 15%, rgba(255,255,255,.20), transparent 24%),
                radial-gradient(circle at 20% 90%, rgba(0,198,255,.28), transparent 26%),
                linear-gradient(135deg, #073ba5 0%, #0b5cff 46%, #7c3aed 100%);
            box-shadow:
                0 18px 44px rgba(11,92,255,.21);
        }

        .hero-section::before {
            content: "MF";
            position: absolute;
            right: -12px;
            bottom: -26px;
            font-size: 9rem;
            line-height: 1;
            font-weight: 1000;
            color: rgba(255,255,255,.08);
            transform: rotate(-10deg);
        }

        .hero-section::after {
            content: "";
            position: absolute;
            width: 160px;
            height: 160px;
            right: -50px;
            top: -60px;
            border-radius: 50%;
            background: rgba(255,255,255,.08);
            animation: mfHeroFloat 8s ease-in-out infinite;
        }

        @keyframes mfHeroFloat {
            50% {
                transform: translate(-30px, 25px);
            }
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero-badge {
            display: inline-flex;
            padding: 7px 11px;
            border-radius: 999px;
            color: #ffffff;
            background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.16);
            font-size: .69rem;
            font-weight: 900;
            letter-spacing: .08em;
        }

        .hero-section h2 {
            margin: 15px 0 10px;
            font-size: clamp(1.8rem, 7vw, 3.15rem);
            line-height: .99;
            letter-spacing: -.055em;
            max-width: 680px;
        }

        .hero-section p {
            margin: 0;
            color: rgba(255,255,255,.82);
            max-width: 650px;
            font-size: .94rem;
            line-height: 1.6;
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 18px;
        }

        /* =====================================================
           BUTTONS
           ===================================================== */

        .primary-button,
        .secondary-button,
        .danger-button,
        .whatsapp-button,
        .messenger-button,
        .text-button {
            transition:
                transform .18s ease,
                box-shadow .18s ease,
                opacity .18s ease;
        }

        .primary-button:active,
        .secondary-button:active,
        .danger-button:active,
        .whatsapp-button:active,
        .messenger-button:active {
            transform: scale(.97);
        }

        .primary-button {
            min-height: 46px;
            padding: 0 16px;
            border-radius: 15px;
            color: #ffffff;
            font-weight: 850;
            background: linear-gradient(135deg, var(--mf-blue), #4a8cff);
            box-shadow: 0 10px 23px rgba(11,92,255,.20);
        }

        .secondary-button {
            min-height: 44px;
            padding: 0 15px;
            border-radius: 15px;
            color: var(--mf-text);
            font-weight: 800;
            background: #ffffff;
            border: 1px solid var(--mf-border);
        }

        .danger-button {
            min-height: 44px;
            padding: 0 15px;
            border-radius: 15px;
            color: #ffffff;
            font-weight: 800;
            background: linear-gradient(135deg, #ef4444, #f97316);
        }

        .whatsapp-button {
            min-height: 46px;
            padding: 0 16px;
            border-radius: 15px;
            color: #ffffff;
            font-weight: 850;
            background: linear-gradient(135deg, #1ebe57, #25d366);
            box-shadow: 0 10px 22px rgba(37,211,102,.18);
        }

        .messenger-button {
            min-height: 46px;
            padding: 0 16px;
            border-radius: 15px;
            color: #ffffff;
            font-weight: 850;
            background: linear-gradient(135deg, #0084ff, #5b5cf6);
            box-shadow: 0 10px 22px rgba(0,132,255,.18);
        }

        .text-button {
            padding: 5px 0;
            color: var(--mf-blue);
            background: transparent;
            font-weight: 800;
        }

        .full-width {
            width: 100%;
        }

        /* =====================================================
           SECTIONS / CARDS
           ===================================================== */

        .content-card,
        .form-card,
        .payment-card,
        .profile-main-card,
        .profile-data-card,
        .support-card,
        .promotion-card,
        .policy-card {
            margin-top: 15px;
            border: 1px solid var(--mf-border);
            border-radius: var(--mf-radius);
            background: var(--mf-card);
            box-shadow: var(--mf-shadow);
        }

        .content-card {
            padding: 17px;
        }

        .section-title {
            margin-bottom: 13px;
        }

        .section-title > span,
        .section-title > h2,
        .section-title > h3,
        .section-title > p {
            margin-left: 0;
        }

        .section-title > span {
            display: inline-block;
            color: var(--mf-blue);
            font-size: .67rem;
            font-weight: 900;
            letter-spacing: .13em;
        }

        .section-title h2 {
            margin-top: 5px;
            margin-bottom: 5px;
            font-size: 1.45rem;
            letter-spacing: -.035em;
        }

        .section-title h3 {
            margin-top: 0;
            margin-bottom: 4px;
            font-size: 1.08rem;
        }

        .section-title p {
            margin-top: 0;
            color: var(--mf-muted);
            font-size: .86rem;
            line-height: 1.5;
        }

        /* =====================================================
           ADVERTISEMENT AREA
           ===================================================== */

        .advertisement-layout {
            display: grid;
            gap: 14px;
            margin-top: 15px;
        }

        .advertisement-panel {
            position: relative;
            min-height: 235px;
            border-radius: 22px;
            overflow: hidden;
            padding: 16px;
            color: #ffffff;
            background:
                linear-gradient(145deg, #041f68, #0b5cff 55%, #7c3aed);
            box-shadow: 0 15px 35px rgba(11,92,255,.16);
        }

        .advertisement-panel::before {
            content: "";
            position: absolute;
            width: 160px;
            height: 160px;
            right: -60px;
            top: -65px;
            border-radius: 50%;
            background: rgba(255,255,255,.10);
            animation: mfAdOrb 7s ease-in-out infinite;
        }

        .advertisement-panel::after {
            content: "";
            position: absolute;
            width: 240px;
            height: 30px;
            left: -80px;
            bottom: 30px;
            transform: rotate(-18deg);
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.30),
                transparent
            );
            animation: mfAdShine 4.5s linear infinite;
        }

        @keyframes mfAdOrb {
            50% {
                transform: translate(-24px,28px);
            }
        }

        @keyframes mfAdShine {
            from {
                transform: translateX(-100%) rotate(-18deg);
            }
            to {
                transform: translateX(200%) rotate(-18deg);
            }
        }

        .ad-header {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .ad-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: .67rem;
            font-weight: 900;
            letter-spacing: .10em;
        }

        .ad-live-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: #6ee7b7;
            box-shadow: 0 0 0 5px rgba(110,231
