<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Ruleta 0 - 12</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    background:#02050b;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

body{
    overflow-x:hidden;
}

.app{
    position:relative;
    width:100%;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:
        calc(env(safe-area-inset-top) + 18px)
        14px
        calc(env(safe-area-inset-bottom) + 25px);

    overflow:hidden;

    background:
        radial-gradient(circle at 50% 25%,
            rgba(255,190,40,.22),
            transparent 28%),
        radial-gradient(circle at 50% 55%,
            rgba(0,120,255,.14),
            transparent 45%),
        linear-gradient(180deg,
            #07101b 0%,
            #02050b 55%,
            #000 100%);
}

/* luces de fondo */

.app::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    top:-230px;
    left:50%;
    transform:translateX(-50%);
    border-radius:50%;
    background:
        radial-gradient(circle,
        rgba(255,202,67,.22),
        rgba(255,160,0,.05) 45%,
        transparent 70%);
    filter:blur(8px);
    pointer-events:none;
}

.title{
    position:relative;
    z-index:5;
    text-align:center;
    margin-top:4px;
}

.title h1{
    font-size:clamp(23px,7vw,34px);
    letter-spacing:3px;
    color:#ffd76a;
    text-shadow:
        0 0 8px #d88b00,
        0 0 25px rgba(255,173,0,.5);
}

.title p{
    margin-top:6px;
    color:#aeb9c9;
    font-size:13px;
}

/* =========================
   RULETA
========================= */

.roulette-area{
    position:relative;
    z-index:3;
    width:min(88vw,430px);
    aspect-ratio:1/1;
    margin-top:22px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.glow{
    position:absolute;
    width:96%;
    height:96%;
    border-radius:50%;
    background:rgba(255,174,0,.10);
    box-shadow:
        0 0 30px rgba(255,178,0,.4),
        0 0 80px rgba(255,136,0,.18);
}

/* indicador superior */

.pointer{
    position:absolute;
    z-index:20;
    top:-4px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;

    border-left:17px solid transparent;
    border-right:17px solid transparent;
    border-top:34px solid #ffd54f;

    filter:
        drop-shadow(0 0 4px #ff9d00)
        drop-shadow(0 0 9px #ff7b00);
}

/* borde exterior */

.outer-ring{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;

    background:
        repeating-conic-gradient(
            #ffd766 0deg 4deg,
            #8e5700 4deg 8deg
        );

    box-shadow:
        0 0 0 4px #4a2a00,
        0 0 20px #ffae00,
        0 0 45px rgba(255,154,0,.45);

    display:flex;
    align-items:center;
    justify-content:center;
}

.outer-ring::after{
    content:"";
    position:absolute;
    width:91%;
    height:91%;
    border-radius:50%;
    background:#080b10;
    box-shadow:
        inset 0 0 20px #000,
        0 0 0 3px #d69722;
}

/* rueda que gira */

.wheel{
    position:absolute;
    z-index:4;
    width:84%;
    height:84%;
    border-radius:50%;

    border:4px solid #c99125;

    background:
        repeating-conic-gradient(
            from -13.846deg,
            #8f1010 0deg 27.692deg,
            #101318 27.692deg 55.384deg
        );

    box-shadow:
        inset 0 0 28px #000,
        0 0 15px rgba(255,185,45,.45);

    transition:
        transform 5.2s cubic-bezier(.12,.68,.12,1);

    will-change:transform;
}

/* líneas de separación */

.wheel::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;

    background:
        repeating-conic-gradient(
            transparent 0deg 26.7deg,
            rgba(255,218,111,.85) 26.7deg 27.692deg
        );

    pointer-events:none;
}

/* centro */

.center{
    position:absolute;
    z-index:10;
    width:34%;
    height:34%;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(circle at 40% 35%,
            #fff3a4 0%,
            #e8a72b 16%,
            #8e5200 45%,
            #251300 75%,
            #080400 100%);

    border:3px solid #f4c34d;

    box-shadow:
        inset 0 0 15px #fff2a0,
        0 0 20px rgba(255,173,0,.8);
}

.center-inner{
    width:57%;
    height:57%;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(circle,
            #222 0%,
            #080808 65%,
            #000 100%);

    border:2px solid #d59b28;

    font-size:clamp(23px,7vw,34px);
    font-weight:900;
    color:#ffd65c;

    text-shadow:0 0 8px #ff9d00;
}

/* números físicos de la rueda */

.wheel-number{
    position:absolute;
    z-index:5;

    left:50%;
    top:50%;

    width:32px;
    height:32px;

    margin-left:-16px;
    margin-top:-16px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:clamp(14px,4vw,19px);
    font-weight:900;
    color:white;

    text-shadow:
        0 2px 2px #000,
        0 0 4px #000;

    transform:
        rotate(var(--angle))
        translateY(-135px)
        rotate(calc(-1 * var(--angle)));
}

/* =========================
   RESULTADO
========================= */

.result-box{
    position:relative;
    z-index:5;
    margin-top:16px;

    width:min(92vw,430px);
    min-height:62px;

    border:1px solid rgba(255,210,91,.45);
    border-radius:18px;

    background:rgba(5,10,18,.82);
    backdrop-filter:blur(12px);

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    box-shadow:
        inset 0 0 20px rgba(255,170,0,.05),
        0 8px 30px rgba(0,0,0,.35);
}

.result-label{
    font-size:11px;
    letter-spacing:2px;
    color:#8894a5;
}

.result{
    margin-top:3px;
    font-size:24px;
    font-weight:900;
    color:#ffd866;
}

/* =========================
   BOTONES 0 - 12
========================= */

.choose-title{
    position:relative;
    z-index:5;
    margin-top:20px;
    margin-bottom:10px;
    font-size:14px;
    color:#d9e0e8;
}

.numbers{
    position:relative;
    z-index:5;

    width:min(94vw,460px);

    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:7px;
}

.number-btn{
    min-width:0;
    aspect-ratio:1/1;

    border-radius:12px;

    border:1px solid #59616d;

    color:white;

    background:
        linear-gradient(180deg,#20252d,#090c11);

    font-size:16px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        inset 0 1px rgba(255,255,255,.1),
        0 4px 8px rgba(0,0,0,.35);

    transition:.15s;
}

.number-btn:active{
    transform:scale(.92);
}

.number-btn.selected{
    color:#1b1000;

    border-color:#ffe58b;

    background:
        linear-gradient(180deg,
            #fff0a1,
            #ffbd29);

    box-shadow:
        0 0 10px #ffad00,
        0 0 20px rgba(255,145,0,.55);
}

/* cero destacado */

.number-btn.zero{
    border-color:#258a55;
}

/* =========================
   PLAY
========================= */

.play{
    position:relative;
    z-index:5;

    width:min(92vw,430px);
    height:62px;

    margin-top:18px;

    border:none;
    border-radius:18px;

    font-size:21px;
    font-weight:900;
    letter-spacing:2px;

    color:#241400;

    background:
        linear-gradient(
            180deg,
            #fff2a2,
            #ffc32e 45%,
            #d68700
        );

    box-shadow:
        inset 0 2px rgba(255,255,255,.65),
        0 6px 0 #704000,
        0 10px 25px rgba(255,153,0,.35);

    cursor:pointer;
}

.play:active{
    transform:translateY(4px);
    box-shadow:
        inset 0 2px rgba(255,255,255,.4),
        0 2px 0 #704000,
        0 5px 15px rgba(255,153,0,.25);
}

.play:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* móvil pequeño */

@media(max-width:390px){

    .roulette-area{
        width:86vw;
    }

    .numbers{
        grid-template-columns:repeat(7,1fr);
        gap:5px;
    }

    .number-btn{
        border-radius:10px;
        font-size:14px;
    }

    .wheel-number{
        transform:
            rotate(var(--angle))
            translateY(-31vw)
            rotate(calc(-1 * var(--angle)));
    }
}

/* pantallas más grandes */

@media(min-width:500px){

    .wheel-number{
        transform:
            rotate(var(--angle))
            translateY(-155px)
            rotate(calc(-1 * var(--angle)));
    }
}
</style>
</head>

<body>

<main class="app">

    <div class="title">
        <h1>RULETA</h1>
        <p>Selecciona un número del 0 al 12</p>
    </div>

    <section class="roulette-area">

        <div class="glow"></div>

        <div class="pointer"></div>

        <div class="outer-ring"></div>

        <div
            class="wheel"
            id="wheel">
        </div>

        <div class="center">
            <div
                class="center-inner"
                id="centerNumber">
                0
            </div>
        </div>

    </section>

    <section class="result-box">

        <div class="result-label">
            RESULTADO
        </div>

        <div
            class="result"
            id="result">
            LISTO
        </div>

    </section>

    <div class="choose-title">
        ELIGE TU NÚMERO
    </div>

    <section
        class="numbers"
        id="numberButtons">
    </section>

    <button
        class="play"
        id="playButton">
        ▶ PLAY
    </button>

</main>

<script>

/* ==========================================
   CONFIGURACIÓN
========================================== */

const TOTAL_NUMBERS = 13;

/*
 Orden visual salteado.

 Todos los números aparecen exactamente
 una vez del 0 al 12.
*/

const wheelOrder = [
    0,
    7,
    2,
    11,
    4,
    9,
    1,
    12,
    5,
    8,
    3,
    10,
    6
];

const segmentAngle = 360 / TOTAL_NUMBERS;


/* ==========================================
   ELEMENTOS
========================================== */

const wheel =
    document.getElementById("wheel");

const buttonsContainer =
    document.getElementById("numberButtons");

const playButton =
    document.getElementById("playButton");

const resultElement =
    document.getElementById("result");

const centerNumber =
    document.getElementById("centerNumber");


/* ==========================================
   ESTADO
========================================== */

let selectedNumber = null;

let spinning = false;

let currentRotation = 0;


/* ==========================================
   CREAR NÚMEROS EN LA RULETA
========================================== */

wheelOrder.forEach((number,index)=>{

    const element =
        document.createElement("div");

    element.className =
        "wheel-number";

    element.textContent =
        number;

    const angle =
        index * segmentAngle;

    element.style.setProperty(
        "--angle",
        angle + "deg"
    );

    wheel.appendChild(element);

});


/* ==========================================
   CREAR BOTONES 0 - 12
========================================== */

for(let number = 0;
    number <= 12;
    number++){

    const button =
        document.createElement("button");

    button.className =
        "number-btn";

    if(number === 0){
        button.classList.add("zero");
    }

    button.textContent =
        number;

    button.dataset.number =
        number;

    button.addEventListener(
        "click",
        ()=>selectNumber(number,button)
    );

    buttonsContainer.appendChild(button);
}


/* ==========================================
   SELECCIONAR NÚMERO
========================================== */

function selectNumber(number,button){

    if(spinning){
        return;
    }

    selectedNumber =
        number;

    document
        .querySelectorAll(".number-btn")
        .forEach(btn=>{
            btn.classList.remove(
                "selected"
            );
        });

    button.classList.add(
        "selected"
    );

    resultElement.textContent =
        "Elegiste " + number;
}


/* ==========================================
   PLAY
========================================== */

playButton.addEventListener(
    "click",
    spinRoulette
);


/* ==========================================
   GIRAR RULETA
========================================== */

function spinRoulette(){

    if(spinning){
        return;
    }

    if(selectedNumber === null){

        resultElement.textContent =
            "ELIGE UN NÚMERO";

        return;
    }

    spinning = true;

    playButton.disabled = true;

    resultElement.textContent =
        "GIRANDO...";

    /*
      Resultado aleatorio seguro para
      esta simulación del navegador.
    */

    const randomArray =
        new Uint32Array(1);

    crypto.getRandomValues(
        randomArray
    );

    const resultNumber =
        randomArray[0] %
        TOTAL_NUMBERS;


    /*
      Buscar dónde está físicamente
      ese número dentro de la rueda.
    */

    const resultIndex =
        wheelOrder.indexOf(
            resultNumber
        );


    /*
      Queremos llevar el segmento
      ganador hasta el indicador superior.
    */

    const targetAngle =
        resultIndex *
        segmentAngle;


    /*
      Varias vueltas completas.
    */

    const extraTurns =
        6 * 360;


    /*
      Normalizar rotación actual.
    */

    const normalized =
        currentRotation % 360;


    let correction =
        360 -
        targetAngle -
        normalized;


    correction =
        ((correction % 360) + 360)
        % 360;


    currentRotation +=
        extraTurns +
        correction;


    wheel.style.transform =
        `rotate(${currentRotation}deg)`;


    /*
      Mostrar resultado al terminar.
    */

    setTimeout(()=>{

        centerNumber.textContent =
            resultNumber;

        if(resultNumber ===
           selectedNumber){

            resultElement.textContent =
                "🎉 GANASTE · " +
                resultNumber;

        }else{

            resultElement.textContent =
                "SALIÓ " +
                resultNumber;
        }

        spinning = false;

        playButton.disabled =
            false;

    },5200);
}

</script>

</body>
</html>
