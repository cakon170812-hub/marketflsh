<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Flash</title>
</head>
<body>

  <div id="app">

    <section id="welcome">
      <div class="logo">MF</div>
      <h1>Market Flash</h1>
      <p>Compra, vende y encuentra lo que necesitas.</p>
      <button id="enterBtn">Entrar</button>
    </section><section id="login" hidden>

      <div class="logo">MF</div>

      <h2>Bienvenido</h2>

      <p>Inicia sesión en Market Flash.</p>

      <input
        id="email"
        type="email"
        placeholder="Correo electrónico"
      >

      <input
        id="password"
        type="password"
        placeholder="Contraseña"
      >

      <button id="loginBtn">
        Iniciar sesión
      </button>

      <button id="registerBtn">
        Crear una cuenta
      </button>

      <button id="forgotBtn">
        ¿Olvidaste tu contraseña?
      </button>

    </section>
<section id="register" hidden>

      <h2>Crear cuenta</h2>

      <p>Únete a Market Flash.</p>

      <input
        id="fullName"
        type="text"
        placeholder="Nombre completo"
      >

      <input
        id="cedula"
        type="text"
        placeholder="Número de cédula"
      >

      <input
        id="phone"
        type="tel"
        placeholder="Número de teléfono"
      >

      <input
        id="registerEmail"
        type="email"
        placeholder="Correo electrónico"
      >

      <input
        id="registerPassword"
        type="password"
        placeholder="Crear contraseña"
      >

      <button id="createAccountBtn">
        Registrarme
      </button>

      <button id="backLoginBtn">
        Ya tengo una cuenta
      </button>

    </section><section id="home" hidden>

      <header>

        <div class="logo-small">MF</div>

        <h2>Market Flash</h2>

        <button id="notificationBtn">
          🔔
        </button>

      </header>

      <div class="search">

        <input
          id="search"
          type="search"
          placeholder="¿Qué estás buscando?"
        >

        <button id="searchBtn">
          🔎
        </button>

      </div>

      <button id="publishBtn">
        ＋ Publicar producto
      </button>

      <h3>Categorías</h3>

      <div id="categories">

        <button>📱 Teléfonos</button>
        <button>💻 Electrónica</button>
        <button>🏍️ Vehículos</button>
        <button>🏠 Hogar</button>

      </div>
