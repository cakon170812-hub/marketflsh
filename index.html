<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Flash</title>
</head>
<body>

  <div id="app">

    <section id="welcome">
      <div class="logo">MF</div>
      <h1>Market Flash</h1>
      <p>Compra, vende y encuentra lo que necesitas.</p>
      <button id="enterBtn">Entrar</button>
    </section><section id="login" hidden>

      <div class="logo">MF</div>

      <h2>Bienvenido</h2>

      <p>Inicia sesión en Market Flash.</p>

      <input
        id="email"
        type="email"
        placeholder="Correo electrónico"
      >

      <input
        id="password"
        type="password"
        placeholder="Contraseña"
      >

      <button id="loginBtn">
        Iniciar sesión
      </button>

      <button id="registerBtn">
        Crear una cuenta
      </button>

      <button id="forgotBtn">
        ¿Olvidaste tu contraseña?
      </button>

    </section>
