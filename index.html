<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Market Flash</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #f4f6f8;
    color: #111827;
    min-height: 100vh;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
    border: none;
}

.hidden {
    display: none !important;
}

/* =========================
   HEADER
========================= */

.header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    padding: 12px 16px;
}

.header-inner {
    max-width: 1200px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    font-size: 24px;
    font-weight: 900;
    color: #111827;
    white-space: nowrap;
}

.logo span {
    color: #2563eb;
}

.search {
    flex: 1;
    background: #f1f5f9;
    border-radius: 14px;
    padding: 12px 16px;
    border: 1px solid transparent;
    outline: none;
}

.search:focus {
    border-color: #2563eb;
}

.header-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #f1f5f9;
    font-size: 19px;
}

/* =========================
   MAIN
========================= */

main {
    max-width: 1200px;
    margin: auto;
    padding: 18px 16px 100px;
}

.categories {
    display: flex;
    gap: 9px;
    overflow-x: auto;
    padding-bottom: 15px;
}

.categories::-webkit-scrollbar {
    display: none;
}

.category {
    flex: 0 0 auto;
    padding: 10px 15px;
    border-radius: 22px;
    background: white;
    border: 1px solid #e5e7eb;
    font-weight: 700;
}

.category.active {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
}

/* =========================
   ADVERTISEMENT
========================= */

.ad-space {
    min-height: 100px;
    border-radius: 18px;
    margin: 5px 0 20px;
    background: linear-gradient(135deg, #e8eefc, #f8fafc);
    border: 1px dashed #b8c2d1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 18px;
}

.ad-space.active {
    border-style: solid;
}

.ad-content {
    width: 100%;
}

.ad-label {
    font-size: 11px;
    color: #64748b;
    text-transform: uppercase;
    font-weight: 800;
    margin-bottom: 5px;
}

.ad-title {
    font-size: 20px;
    font-weight: 900;
}

.ad-description {
    color: #64748b;
    margin-top: 5px;
}

/* =========================
   PRODUCTS
========================= */

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 20px 0 12px;
}

.section-title h2 {
    font-size: 21px;
}

.products {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.product-card {
    background: white;
    border-radius: 17px;
    overflow: hidden;
    border: 1px solid #e5e7eb;
    transition: .2s;
}

.product-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

.product-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    background: #e5e7eb;
}

.product-info {
    padding: 12px;
}

.product-name {
    font-weight: 800;
    margin-bottom: 5px;
}

.product-price {
    font-size: 18px;
    font-weight: 900;
}

.product-location {
    font-size: 12px;
    color: #64748b;
    margin-top: 5px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: rgba(255,255,255,.97);
    border-top: 1px solid #e5e7eb;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 200;
}

.nav-item {
    background: none;
    color: #64748b;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 700;
}

.nav-icon {
    font-size: 22px;
}

.nav-item.active {
    color: #2563eb;
}

.publish-button {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: #2563eb;
    color: white;
    font-size: 28px;
    margin-top: -27px;
    box-shadow: 0 8px 20px rgba(37,99,235,.3);
}

/* =========================
   MODAL / SCREENS
========================= */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.55);
    z-index: 500;
    display: flex;
    align-items: flex-end;
    justify-content: center;
}

.modal {
    background: white;
    width: 100%;
    max-width: 650px;
    max-height: 92vh;
    overflow-y: auto;
    border-radius: 25px 25px 0 0;
    padding: 22px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.close {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #f1f5f9;
    font-size: 20px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 7px;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #dbe1e8;
    border-radius: 12px;
    outline: none;
}

.form-group textarea {
    min-height: 110px;
    resize: vertical;
}

.primary {
    width: 100%;
    background: #2563eb;
    color: white;
    padding: 14px;
    border-radius: 13px;
    font-weight: 800;
}

.secondary {
    width: 100%;
    background: #f1f5f9;
    color: #111827;
    padding: 14px;
    border-radius: 13px;
    font-weight: 800;
    margin-top: 9px;
}

.danger {
    background: #fee2e2;
    color: #b91c1c;
}

/* =========================
   ACCOUNT
========================= */

.profile-card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    border: 1px solid #e5e7eb;
    text-align: center;
}

.avatar {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    background: #dbeafe;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    margin: 0 auto 10px;
}

.menu-card {
    margin-top: 15px;
    background: white;
    border-radius: 18px;
    border: 1px solid #e5e7eb;
    overflow: hidden;
}

.menu-item {
    width: 100%;
    padding: 16px;
    background: white;
    display: flex;
    align-items: center;
    gap: 13px;
    border-bottom: 1px solid #edf0f3;
    text-align: left;
}

.menu-item:last-child {
    border-bottom: none;
}

.menu-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: #eff6ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
}

.menu-text {
    flex: 1;
}

.menu-text strong {
    display: block;
}

.menu-text small {
    color: #64748b;
}

/* =========================
   DASHBOARD
========================= */

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.dashboard-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 18px;
    padding: 18px;
}

.dashboard-icon {
    font-size: 30px;
    margin-bottom: 10px;
}

.dashboard-card strong {
    font-size: 20px;
    display: block;
}

.dashboard-card span {
    color: #64748b;
    font-size: 13px;
}

/* =========================
   STATS
========================= */

.stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.stat {
    padding: 15px;
    border-radius: 15px;
    background: #f8fafc;
}

.stat-number {
    font-size: 23px;
    font-weight: 900;
}

.stat-label {
    color: #64748b;
    font-size: 12px;
}

/* =========================
   TOGGLE
========================= */

.setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 0;
    border-bottom: 1px solid #e5e7eb;
}

.toggle {
    width: 52px;
    height: 29px;
    border-radius: 20px;
    background: #cbd5e1;
    position: relative;
}

.toggle::after {
    content: "";
    width: 23px;
    height: 23px;
    background: white;
    border-radius: 50%;
    position: absolute;
    top: 3px;
    left: 3px;
    transition: .2s;
}

.toggle.on {
    background: #2563eb;
}

.toggle.on::after {
    left: 26px;
}

/* =========================
   DESKTOP
========================= */

@media (min-width: 700px) {
    .products {
        grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .overlay {
        align-items: center;
    }

    .modal {
        border-radius: 25px;
        max-height: 88vh;
    }

    .bottom-nav {
        left: 50%;
        transform: translateX(-50%);
        width: min(700px, 100%);
        border: 1px solid #e5e7eb;
        border-radius: 20px 20px 0 0;
    }
}
</style>

</head>

<script>

/* =========================================================
   DATOS INICIALES
========================================================= */

let products = [
    {
        id: 1,
        name: "iPhone 15 Pro",
        category: "Celulares",
        price: 45000,
        location: "Santo Domingo",
        seller: "Vendedor Market",

    },

    {

        name: "Samsung Galaxy S24",
        category: "Celulares",
        price: 38000,
        location: "Santiago",
        seller: "Tecnología RD",
        image: "https://images.unsplash.com/photo-1610945415295-d9bbf067e59c?auto=format&fit=crop&w=800&q=80",
        views: 743,
        likes: 51,
        saves: 18,
        profileVisits: 14
    },

    {
        id: 3,
        name: "Laptop profesional",
        category: "Computadoras",
        price: 52000,
        location: "Santo Domingo",
        seller: "Tech Store",
        image: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=800&q=80",
        views: 491,
        likes: 29,
        saves: 11,
        profileVisits: 8
    },

    {
        id: 4,
        name: "PlayStation 5",
        category: "Videojuegos",
        price: 32000,
        location: "Santo Domingo Este",
        seller: "Gaming RD",
        image: "https://images.unsplash.com/photo-1606813907291-d86efa9b94db?auto=format&fit=crop&w=800&q=80",
        views: 952,
        likes: 73,
        saves: 42,
        profileVisits: 25
    }
];


let currentCategory = "Todos";
let currentUser = null;


/* =========================================================
   FORMATO DE PRECIO
========================================================= */

function formatPrice(price) {

    return new Intl.NumberFormat("es-DO", {
        style: "currency",
        currency: "DOP",
        maximumFractionDigits: 0
    }).format(price);

}


/* =========================================================
   MOSTRAR PRODUCTOS
========================================================= */

function renderProducts(list = products) {

    const container = document.getElementById("products");

    container.innerHTML = "";

    if (list.length === 0) {

        container.innerHTML = `
            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:50px 20px;
                color:#64748b;
            ">
                <div style="font-size:45px;">🔎</div>
                <h3>No encontramos productos</h3>
                <p>Prueba con otra búsqueda.</p>
            </div>
        `;

        document.getElementById("productCount").textContent = "0 productos";

        return;
    }


    list.forEach(product => {

        const card = document.createElement("article");

        card.className = "product-card";

        card.onclick = () => openProduct(product.id);

        card.innerHTML = `

            <img
                class="product-image"
                src="${product.image}"
                alt="${product.name}"
            >

            <div class="product-info">

                <div class="product-name">
                    ${product.name}
                </div>

                <div class="product-price">
                    ${formatPrice(product.price)}
                </div>

                <div class="product-location">
                    📍 ${product.location}
                </div>

            </div>

        `;

        container.appendChild(card);

    });


    document.getElementById("productCount").textContent =
        `${list.length} productos`;

}


/* =========================================================
   FILTRAR CATEGORÍA
========================================================= */

function filterCategory(category, button) {

    currentCategory = category;

    document.querySelectorAll(".category").forEach(btn => {
        btn.classList.remove("active");
    });

    button.classList.add("active");

    if (category === "Todos") {
        renderProducts(products);
    } else {
        renderProducts(
            products.filter(p => p.category === category)
        );
    }

}


/* =========================================================
   BUSCAR
========================================================= */

function searchProducts() {

    const query =
        document.getElementById("searchInput").value
        .toLowerCase()
        .trim();

    let result = products;


    if (currentCategory !== "Todos") {

        result = result.filter(
            p => p.category === currentCategory
        );

    }


    if (query) {

        result = result.filter(p =>
            p.name.toLowerCase().includes(query) ||
            p.category.toLowerCase().includes(query) ||
            p.location.toLowerCase().includes(query)
        );

    }


    renderProducts(result);

}


function focusSearch() {

    document.getElementById("searchInput").focus();

}


/* =========================================================
   MODAL
========================================================= */

function openModal(content) {

    document.getElementById("modalContent").innerHTML = content;

    document.getElementById("modal").classList.remove("hidden");

}


function closeModal() {

    document.getElementById("modal").classList.add("hidden");

}


function closeOutside(event) {

    if (event.target.id === "modal") {
        closeModal();
    }

}


/* =========================================================
   PRODUCTO
========================================================= */

function openProduct(id) {

    const product = products.find(p => p.id === id);

    if (!product) return;


    product.views++;


    openModal(`

        <div class="modal-header">

            <h2>${product.name}</h2>

            <button class="close" onclick="closeModal()">
                ×
            </button>

        </div>


        <img
            src="${product.image}"
            style="
                width:100%;
                border-radius:18px;
                max-height:380px;
                object-fit:cover;
            "
        >


        <div style="margin-top:18px;">

            <div style="
                font-size:26px;
                font-weight:900;
                margin-bottom:7px;
            ">
                ${formatPrice(product.price)}
            </div>

            <div style="color:#64748b;">
                📍 ${product.location}
            </div>

        </div>


        <div style="
            margin-top:18px;
            padding:16px;
            background:#f8fafc;
            border-radius:15px;
        ">

            <strong>👤 Vendedor</strong>

            <div style="margin-top:5px;">
                ${product.seller}
            </div>

        </div>


        <div class="stats-grid" style="margin-top:18px;">

            <div class="stat">
                <div class="stat-number">
                    ${product.views}
                </div>
                <div class="stat-label">
                    👁️ Visualizaciones
                </div>
            </div>

            <div class="stat">
                <div class="stat-number">
                    ${product.likes}
                </div>
                <div class="stat-label">
                    ❤️ Reacciones
                </div>
            </div>

            <div class="stat">
                <div class="stat-number">
                    ${product.saves}
                </div>
                <div class="stat-label">
                    🔖 Guardados
                </div>
            </div>

            <div class="stat">
                <div class="stat-number">
                    ${product.profileVisits}
                </div>
                <div class="stat-label">
                    👤 Visitas al perfil
                </div>
            </div>

        </div>


        <button
            class="primary"
            style="margin-top:18px;"
            onclick="contactSeller('${product.seller}')"
        >
            📞 Contactar vendedor
        </button>


        <button
            class="secondary"
            onclick="likeProduct(${product.id})"
        >
            ❤️ Me interesa
        </button>

    `);

}


function likeProduct(id) {

    const product = products.find(p => p.id === id);

    if (!product) return;

    product.likes++;

    alert("❤️ Has indicado que te interesa este producto.");

}


function contactSeller(seller) {

    alert(
        "Contacto con " + seller +
        "\n\nLa mensajería/contacto se conectará en la siguiente etapa."
    );

}


/* =========================================================
   PUBLICAR PRODUCTO
========================================================= */

function openPublish() {

    openModal(`

        <div class="modal-header">

            <h2>➕ Publicar producto</h2>

            <button class="close" onclick="closeModal()">
                ×
            </button>

        </div>


        <form onsubmit="createProduct(event)">

            <div class="form-group">

                <label>📸 Foto del producto</label>

                <input
                    id="productImage"

                    required
                >

            </div>


            <div class="form-group">

                <label>🏷️ Nombre del producto</label>

                <input

            </div>


            <div class="form-group">

            </div>


            <div class="form-group">

                <label>💰 Precio</label>

                <input
                    id="productPrice"

                >

            </div>


            <div class="form-group">

                <label>📍 Ubicación</label>

                <input
                    id="productLocation"
                    type="text"
                    placeholder="Ciudad / provincia"
                    required
                >

            </div>


            <div class="form-group">

                <label>📝 Descripción</label>

                <textarea
                    id="productDescription"
                    placeholder="Describe el producto..."
                ></textarea>

```
        </div>


        <button class="primary" type="submit">
            🚀 Publicar producto
        </button>

    </form>

`);
```

}

function createProduct(event) {

```
event.preventDefault();


const newProduct = {

    id: Date.now(),

    name:
        document.getElementById("productName").value,

    category:
        document.getElementById("productCategory").value,

    price:
        Number(document.getElementById("productPrice").value),

    location:
        document.getElementById("productLocation").value,

    seller:
        currentUser ? currentUser.name : "Nuevo vendedor",

    image:
        document.getElementById("productImage").value,

    views: 0,
    likes: 0,
    saves: 0,
    profileVisits: 0

};


products.unshift(newProduct);

closeModal();

currentCategory = "Todos";

renderProducts(products);

alert("✅ Tu publicación fue creada correctamente.");
```

}

REGISTRO

function openRegister() {

```

function loginUser(event) {

```
event.preventDefault();


const saved =
    localStorage.getItem("marketFlashUser");

if (!saved) {

    alert("No existe una cuenta registrada en este dispositivo.");

    return;

}


const user = JSON.parse(saved);


if (
    user.cedula ===
    document.getElementById("loginCedula").value &&
    user.password ===
    document.getElementById("loginPassword").value
) {

    if (user.blocked) {

        alert(
            "🚫 Esta cuenta está bloqueada por el administrador."
        );

        return;

    }


    currentUser = user;

    closeModal();

    alert("✅ Bienvenido a Market Flash.");

} else {

    alert("❌ Los datos no coinciden.");

}
```

}

function recoverPassword() {

```
const saved =
    localStorage.getItem("marketFlashUser");

const user = JSON.parse(saved);


const answer =
    document.getElementById("recoveryAnswer").value
    .trim()
    .toLowerCase();


if (
    answer ===
    user.answer.trim().toLowerCase()
) {

    alert(
        "✅ Verificación correcta.\n\n" +
        "En la versión con base de datos segura " +
        "aquí se iniciará el proceso de recuperación."
    );

} else {

    alert("❌ La respuesta no es correcta.");

}
```

function toggleAdvertising() {

    toggle.classList.toggle(
        "on",
        advertisingPaid
    );

}

function saveAdvertisingSettings() {

```
const bank =
    document.getElementById("bankAdPrice").value;

const binance =
    document.getElementById("binanceAdPrice").value;

const paypal =
    document.getElementById("paypalAdPrice").value;


localStorage.setItem(
    "marketFlashAdvertising",
    JSON.stringify({
        paid: advertisingPaid,
        bankPrice: bank,
        binancePrice: binance,
        paypalPrice: paypal
    })
);


alert("✅ Configuración de publicidad guardada.");
```
