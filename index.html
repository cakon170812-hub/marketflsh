let recorder=null,recordStream=null,recordChunks=[],recordWanted=false,recordBlob=null,recordGeneration=0;
function bindRecorder(){const b=$('#record-audio');if(!b)return;b.onpointerdown=async e=>{e.preventDefault();const generation=++recordGeneration;recordWanted=true;recordBlob=null;try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw new Error('La grabación requiere un navegador compatible y una página HTTPS.');recordStream=await navigator.mediaDevices.getUserMedia({audio:true});if(!recordWanted||generation!==recordGeneration){recordStream.getTracks().forEach(t=>t.stop());return}const mime=['audio/webm','audio/mp4','audio/ogg'].find(x=>MediaRecorder.isTypeSupported(x));recorder=new MediaRecorder(recordStream,mime?{mimeType:mime}:{});recordChunks=[];const chunks=recordChunks;recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const activeRecorder=recorder,activeStream=recordStream,activeChunks=recordChunks;recorder.onstop=()=>{activeStream.getTracks().forEach(t=>t.stop());if(generation!==recordGeneration)return;recordBlob=new Blob(activeChunks,{type:activeRecorder.mimeType});if($('#record-state'))$('#record-state').textContent='Audio preparado. Toca Enviar para compartirlo.'};recorder.start();b.classList.add('recording');b.setPointerCapture(e.pointerId);$('#record-state').textContent='Grabando… suelta para terminar.'}catch(err){recordWanted=false;toast(safeError(err),true)}};b.onpointerup=()=>stopRecording();b.onpointercancel=()=>stopRecording();}
function stopRecording(discard=false){recordWanted=false;if(recorder?.state==='recording')recorder.stop();$('#record-audio')?.classList.remove('recording');if(discard){recordGeneration++;recordBlob=null;S.cameraFile=null;S.chat=null}}

 if(kind==='register'){if(d.password!==d.confirm)throw new Error('Las contraseñas no coinciden.');if(d.password.length<8)throw new Error('La contraseña debe tener al menos 8 caracteres.');const body={email:d.email.trim().toLowerCase(),password:d.password,data:{referral_code:localStorage.getItem('mfweb-referral')||'',location:d.location||'',terms_version:'2026-09-30'}};const j=await request('auth/v1/signup',{method:'POST',auth:false,body});if(!j.access_token||!j.user?.id){throw new Error('Supabase no entregó una sesión. No se pudo completar el acceso automático. Si recibiste un correo de confirmación, confírmalo. El administrador debe revisar Confirm email y la instalación SQL.')}storeSession({...j,expires_at:Date.now()/1000+Number(j.expires_in||3600)});localStorage.removeItem('mfweb-referral');await openAccount();return}
 if(kind==='recover'){await request('auth/v1/recover',{method:'POST',auth:false,body:{email:d.email.trim(),redirect_to:location.origin+location.pathname}});authPage();return toast('Si el correo está registrado, recibirás un enlace para recuperar el acceso.')}
 if(kind==='password'){if(d.password!==d.confirm)throw new Error('Las contraseñas no coinciden.');await request('auth/v1/user',{method:'PUT',body:{password:d.password}});await loadAccount();return navigate('home')}
 if(kind==='search'){const q=d.query.trim().toLowerCase();if($('#products')){$('#products').innerHTML=productCards(S.feed.filter(p=>[p.title,p.description,p.category].some(v=>v.toLowerCase().includes(q))));hydrate($('#products'))}if(q.length>=3){const users=await command('user_search',{query:d.query.trim()});$('#search-users').innerHTML=users.map(userCard).join('');hydrate($('#search-users'))}return}
 if(kind==='publish'){const files=[...form.elements.photos.files,...form.elements.camera.files];if(files.length<1||files.length>10)throw new Error('Selecciona entre 1 y 10 fotos.');const fingerprint=files.map(f=>f.name+':'+f.size+':'+f.lastModified).join('|');if(ctx.fileFingerprint!==fingerprint){ctx.paths=[];ctx.fileFingerprint=fingerprint;ctx.operation=uid();}const paths=ctx.paths||[];for(let i=paths.length;i<files.length;i++)paths.push(await upload(files[i],'mf901_media','publications'));ctx.paths=paths;ctx.operation??=uid();S.formData=ctx;const video=form.elements.video?.files[0],videoFingerprint=video?video.name+':'+video.size+':'+video.lastModified:'';if(ctx.videoFingerprint!==videoFingerprint){ctx.videoPath='';ctx.videoFingerprint=videoFingerprint;ctx.operation=uid();}if(video&&!ctx.videoPath)ctx.videoPath=await upload(video);S.formData=ctx;await rpc('mfweb_publish',{p_data:JSON.stringify({title:d.title,category:d.category,price:d.price,description:d.description,location:d.location,quantity:d.quantity||'1',condition:d.condition||'Nuevo',video:ctx.videoPath||'',images:JSON.stringify(paths),operation:ctx.operation})});toast('Publicación creada.');return navigate('home')}
 if(kind==='coin'){const id=await rpc(ctx.kind==='send'?'mf08_transfer':'mf08_request',{p_target:d.target,p_amount:d.amount,[ctx.kind==='send'?'p_operation':'p_request']:ctx.operation});close();await navigate('wallet');return toast('Operación registrada: '+id)}
 if(kind==='profile'){await rpc('mf08_update_profile',{p_name:d.full_name,p_phone:d.phone});const file=form.elements.photo.files[0];const avatar=file?await upload(file,'mf09_avatars','avatar'):'';await rpc('mf09_save_profile',{p_location:d.location,p_avatar:avatar,p_terms:'2026-09-30'});close();await loadAccount();return navigate('profile')}
 if(kind==='chat-send'){const file=form.elements.attachment.files[0]||S.cameraFile||(recordBlob?new File([recordBlob],'audio.'+(recordBlob.type.includes('mp4')?'m4a':recordBlob.type.includes('ogg')?'ogg':'webm'),{type:recordBlob.type}):null);let attachment='';if(file)attachment=await upload(file,'mf901_media',S.chat.id);await command('chat_send',{id:S.chat.id,body:d.body||'',attachment,media_type:file?.type.startsWith('image/')?'image':file?.type.startsWith('video/')?'video':'audio'});form.reset();recordBlob=null;S.cameraFile=null;$('#record-state').textContent='';renderChat(await command('chat_snapshot',{id:S.chat.id}));return}

 if(kind==='sale'){await command('sale_propose',{...d,publication:ctx.publication,operation:uid()});close();return toast('Solicitud de venta enviada al comprador.')}
 if(kind==='sale-confirm'){await command('sale_confirm',{...d,id:ctx.id,operation:uid()});close();return navigate('notifications')}
 if(kind==='admin-settings'){const vals={};for(const f of S.adminForm.fields){if(f.type==='readonly')continue;vals[f.id]=f.type==='bool'?String(!!form.elements[f.id].checked):String(d[f.id]??'')}const r=await command('admin_settings_save',{section:ctx.section,values:JSON.stringify(vals),version:ctx.version,operation:uid()});await loadAccount();close();await navigate('admin');return toast(r.message)}
 if(kind==='admin-coins'){const r=await command('admin_coin_send',{...d,operation:ctx.operation});close();await wallet();await navigate('admin');return toast(r.message)}
 if(kind==='moderate'){if(d.action==='temporary'){if(!d.until)throw new Error('Selecciona la fecha final.');d.until=new Date(d.until).toISOString()}const r=await command('admin_moderate',{...d,target:ctx.target,operation:uid()});close();await navigate('admin');return toast(r.message)}

 if(kind==='case-resolve'){const r=await command('admin_case_resolve',{id:ctx.id,resolution:d.resolution,operation:uid()});close();await navigate('admin');return toast(r.message)}
 if(kind==='ad-create'){const files=[...form.elements.media.files];const fingerprint=[...files,form.elements.proof.files[0]].map(f=>f.name+':'+f.size+':'+f.lastModified).join('|');if(ctx.fileFingerprint!==fingerprint){ctx.media=[];ctx.proof=null;ctx.fileFingerprint=fingerprint;ctx.operation=uid();}const media=ctx.media||[];for(let i=media.length;i<files.length;i++)media.push({path:await upload(files[i]),type:files[i].type.startsWith('video/')?'video':'image'});ctx.media=media;const proof=ctx.proof||await upload(form.elements.proof.files[0]);ctx.proof=proof;S.formData=ctx;await web('ad_create',{title:d.title,description:d.description,plan:d.plan,bank:d.bank,media:JSON.stringify(media),proof,operation:ctx.operation});close();toast('Publicidad enviada para revisión.');return navigate('ads')}
 if(kind==='ad-review'){await web('ad_review',{...ctx,reason:d.reason});close();await navigate('admin');return toast('Revisión guardada.')}
 if(kind==='ad-settings'){const config={...S.webSettings.config};config.plans=config.plans.map(p=>({...p,price:Number(d[p.id+'-price']),days:Number(d[p.id+'-days'])}));config.banks=[];for(let i=0;i<5;i++){if(d['bank-'+i+'-name']){if(!d['bank-'+i+'-account']||!d['bank-'+i+'-owner'])throw new Error('Completa cuenta y titular de cada banco.');config.banks.push({id:'bank-'+i,name:d['bank-'+i+'-name'],account:d['bank-'+i+'-account'],owner:d['bank-'+i+'-owner']})}}config.information=d.information;await web('settings_save',{config:JSON.stringify(config),version:String(ctx.version),operation:uid()});close();await navigate('admin');return toast('Planes y cuentas guardados.')}
 if(kind==='video'){const file=form.elements.file.files[0],fingerprint=file.name+':'+file.size+':'+file.lastModified;if(ctx.fileFingerprint!==fingerprint){ctx.path=null;ctx.operation=uid();ctx.fileFingerprint=fingerprint;}const path=ctx.path||await upload(file);ctx.path=path;S.formData=ctx;await web('video_create',{title:d.title,path,operation:ctx.operation});close();return navigate('videos')}
}
async function poll(){if(!S.profile||document.hidden||S.polling)return;S.polling=true;try{if(S.chat&&$('#chatlog'))renderChat(await command('chat_snapshot',{id:S.chat.id}));if(S.page==='roulette'){const prev=S.roulette?.round?.id;S.roulette=await command('roulette_state');if(prev!==S.roulette.round?.id){S.counts={...(S.roulette.my_bets?.counts||{})};S.unit=Number(S.roulette.my_bets?.unit_amount||S.roulette.minimum_bet);S.dirty=false;S.operation=null;if($('#bet-unit'))$('#bet-unit').value=S.unit}else if(!S.dirty)S.counts={...(S.roulette.my_bets?.counts||{})};S.balance=S.roulette.balance;renderRoulette()}if(!S.lastPresence||Date.now()-S.lastPresence>20000){await command('presence_touch');S.access=await command('access');if(S.access.restricted&&S.page!=='restricted'){S.page='restricted';await navigate('home')}if(!S.access.restricted)await wallet();S.lastPresence=Date.now()}if(S.page==='home'&&S.ads?.length&&Date.now()-(S.lastAd||0)>5000){S.lastAd=Date.now();S.adIndex=(S.adIndex+1)%S.ads.length;const el=$('#ad-preview');if(el){const video=el.querySelector('video');if(!video||video.ended){el.innerHTML=adPreview(S.ads[S.adIndex]);hydrate(el)}}}}catch(e){if(!S.lastPollError||Date.now()-S.lastPollError>20000){S.lastPollError=Date.now();toast(safeError(e),true)}}finally{S.polling=false}}
async function boot(){setInterval(poll,1100);const hash=new URLSearchParams(location.hash.slice(1));if(hash.get('access_token')){const access_token=hash.get('access_token');const r=await fetch(BASE+'/auth/v1/user',{headers:{apikey:APIKEY,Authorization:'Bearer '+access_token}});if(r.ok){const user=await r.json();storeSession({access_token,refresh_token:hash.get('refresh_token'),user,expires_at:Date.now()/1000+Number(hash.get('expires_in')||3600)});const recovery=hash.get('type')==='recovery';history.replaceState(null,'',location.pathname+location.search);if(recovery)return authPage('password');}}try{const saved=localStorage.getItem(SESSION_KEY)||sessionStorage.getItem(SESSION_KEY);if(saved){S.session=JSON.parse(saved);S.remember=!!localStorage.getItem(SESSION_KEY);await openAccount()}else authPage()}catch(e){authPage();toast(safeError(e),true)}}

actions=async function(action,id,el){if(action==='publish-modal'){const body=await publishPage();modal('Nueva publicación',body);$('.modalback').id='modal-publicar';$('.modal').classList.add('modal-content');S.formData={operation:uid()};return}if(action==='category'){S.category=id;return refreshProducts()}if(action==='clear-filters'){S.category='Todas';S.search='';S.filters={};if($('#input-busqueda'))$('#input-busqueda').value='';return refreshProducts()}if(action==='filters'){const f=S.filters||{};formModal('Filtros avanzados','filters',input('min','Precio mínimo RD$','number',f.min||'','min="0" step="0.01"').replace('id="f-min"','id="filtro-precio-min"')+input('max','Precio máximo RD$','number',f.max||'','min="0" step="0.01"').replace('id="f-max"','id="filtro-precio-max"')+input('location','Ubicación','text',f.location||'').replace('id="f-location"','id="filtro-ubicacion"')+`<label>Condición</label><select name="condition"><option value="">Todas</option><option ${f.condition==='Nuevo'?'selected':''}>Nuevo</option><option ${f.condition==='Usado'?'selected':''}>Usado</option></select>`);$('.modalback').id='modal-filtros';const b=$('.modal [type=submit]');b.id='btn-aplicar-filtros';b.textContent='Aplicar filtros';return}return originalActions(action,id,el)};
const originalSubmit=submitForm;
submitForm=async function(kind,d,form,ctx){if(kind==='filters'){if(d.min!==''&&d.max!==''&&Number(d.min)>Number(d.max))throw new Error('El precio mínimo no puede superar al máximo.');S.filters={min:d.min,max:d.max,location:d.location.trim(),condition:d.condition};close();refreshProducts();return}if(kind==='search'){S.search=d.query.trim();refreshProducts();if(S.search.length>=3){const users=await command('user_search',{query:S.search});$('#search-users').innerHTML=users.map(userCard).join('');hydrate($('#search-users'))}else $('#search-users').innerHTML='';return}const result=await originalSubmit(kind,d,form,ctx);if(kind==='publish')close();return result};
document.addEventListener('input',e=>{if(e.target.id==='input-busqueda'){S.search=e.target.value;refreshProducts()}});
document.addEventListener('change',e=>{if(!['prod-fotos'].includes(e.target.id)&&e.target.name!=='camera')return;const preview=$('#preview-imagenes');if(!preview)return;if(S.previewURLs)S.previewURLs.forEach(u=>URL.revokeObjectURL(u));const form=e.target.closest('form'),files=[...form.elements.photos.files,...form.elements.camera.files];S.previewURLs=files.slice(0,10).map(f=>URL.createObjectURL(f));preview.innerHTML=S.previewURLs.map(u=>`<img src="${u}" alt="Vista previa">`).join('')});
pages.home=homePage;
pages.publish=publishPage;



// Web 0.04: permisos, promotores, fondos y referidos.
const v4=(action,data={})=>rpc('mf004_command',{p_action:action,p_data:JSON.stringify(data)});
const canMove=()=>!!S.business?.promoter;
async function loadBusiness(){S.access=await command('access');S.business=await v4('state');return S.business}
const oldLoadAccount4=loadAccount;
loadAccount=async function(){await oldLoadAccount4();if(!S.access.restricted)await loadBusiness()};
const oldProfile4=profilePage;
profilePage=async function(){await loadBusiness();return (await oldProfile4()).replace('>Administración<','>Panel de administrador<')+(canMove()?`<section class="panel"><h2>Tu cuenta de promotor</h2>${button('Panel de promotor','nav','promoter')}</section>`:'')+`<section class="panel"><h2>Invita y gana</h2><p>Recibes 0.200 FC cuando tu referido se registra y 1.000 FC adicional por su primera recarga o retiro completado.</p>${button('Invitar','invite')}</section>`};pages.profile=profilePage;
function promoterCards(list,manage=false){return list.length?list.map(p=>`<div class="useritem"><div class="row">${p.avatar_path?picture(p.avatar_path,'avatar','mf09_avatars'):`<div class="avatar">${esc(p.full_name[0])}</div>`}<div><b>${esc(p.full_name)}</b><small style="display:block">ID ${esc(p.user_id)}${manage?' · '+fc(p.balance)+(p.active?' · Activo':' · Inactivo'):''}</small></div></div><div class="row" style="margin-top:12px">${manage?button('Recargar','promoter-funds','recharge|'+p.user_id)+button('Retirar','promoter-funds','withdraw|'+p.user_id)+button(p.active?'Desactivar':'Activar','promoter-toggle',p.user_id+'|'+(!p.active)):button('Ver perfil','promoter-profile',p.id)+(/^[0-9]{10,15}$/.test(p.whatsapp)?button('Contactar por WhatsApp','whatsapp',p.whatsapp):'<small>WhatsApp pendiente</small>')}</div></div>`).join(''):blank('No hay promotores autorizados.')}
walletPage=async function(){await wallet();await loadBusiness();const [ops,bonus,req]=await Promise.all([rows('mf08_operations','or=(sender_id.eq.'+S.profile.id+',recipient_id.eq.'+S.profile.id+')&order=created_at.desc&limit=300'),rows('mf09_bonus_operations','recipient_id=eq.'+S.profile.id),rows('mf08_requests','order=created_at.desc&limit=300')]);return `<section class="panel"><h1>Flash Coin</h1><div class="stat" data-own-balance>${fc(S.balance)}</div>${canMove()?`<div class="row">${button('Enviar monedas','coin-form','send')}${button('Solicitar monedas','coin-form','request')}${button('Panel de promotor','nav','promoter')}</div>`:''}</section><section class="panel" id="promoters"><h2>Promotores</h2><p class="muted">Contacta a un promotor para gestionar una recarga o un retiro.</p>${promoterCards(S.business.promoters)}</section><h2>Solicitudes recibidas</h2>${req.map(r=>`<div class="panel"><b>${fc(r.amount)}</b> · ${esc(r.status)}${r.status==='Pendiente'&&r.payer_id===S.profile.id?`<p>Un promotor solicita estas monedas. Aceptar las descontará de tu saldo.</p>${button('Aceptar','coin-answer',r.id+'|true')}${button('Rechazar','coin-answer',r.id+'|false')}`:''}</div>`).join('')||blank('No tienes solicitudes.')}<h2>Historial</h2>${[...ops,...bonus].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(o=>`<div class="panel"><b>${o.recipient_id===S.profile.id?'+':'−'} ${fc(o.amount)}</b> · ${esc(o.kind)}<p>${esc(o.reason)}</p><small>${date(o.created_at)}</small><div class="row">${button('Copiar ID','copy',o.id,'secondary small')}${ops.some(x=>x.id===o.id)?button('Reclamar','claim',o.id,'secondary small'):''}</div></div>`).join('')||blank('Historial vacío.')}`};pages.wallet=walletPage;
pages.promoter=async function(){await loadBusiness();if(!canMove())throw new Error('No tienes permiso de promotor.');await wallet();const own=S.business.promoters.find(p=>p.id===S.profile.id);const ops=await rows('mf08_operations','or=(sender_id.eq.'+S.profile.id+',recipient_id.eq.'+S.profile.id+')&order=created_at.desc&limit=100');return `<section class="panel"><h1>Panel de promotor</h1><p>${esc(S.profile.full_name)} · ID ${esc(S.profile.user_id)}</p><div class="stat" data-own-balance>${fc(S.balance)}</div><div class="row">${button('Enviar monedas','coin-form','send')}${button('Solicitar monedas','coin-form','request')}${button('Volver a Perfil','nav','profile')}</div><form data-form="promoter-phone">${input('phone','Tu WhatsApp con código de país','tel',own?.whatsapp||S.profile.phone,'required')}<button style="margin-top:14px">Guardar WhatsApp</button></form></section><h2>Mis movimientos</h2>${ops.map(o=>`<section class="panel"><b>${fc(o.amount)}</b> · ${esc(o.kind)}<p>${esc(o.reason)}</p><small>${date(o.created_at)}</small></section>`).join('')||blank('Sin movimientos.')}`};
const oldAdmin4=adminPage;
adminPage=async function(){await loadBusiness();let html=await oldAdmin4();if(S.access.primary)html+=`<section class="panel"><h2>Promotores y fondos</h2><p>Fuente actual: <b>${S.business.treasury.unlimited?'Saldo ilimitado':'Monedas recuperadas'}</b></p><p>Monedas recuperadas: <b>${fc(S.business.treasury.recovered)}</b></p><div class="row">${button('Promotores','nav','promoters-admin')}${button('Recargar promotor','promoter-choose','recharge')}${button('Retirar al promotor','promoter-choose','withdraw')}${button(S.business.treasury.unlimited?'Usar saldo recuperado':'Activar saldo ilimitado','treasury-mode',String(!S.business.treasury.unlimited))}</div></section>`;if(permission('roulette'))html+=`<section class="panel"><h2>Bonos de ruleta</h2><p>Fondo disponible: <b>${fc(S.business.bonus.balance)}</b></p><form data-form="bonus-percent">${input('percent','Porcentaje del total apostado por ronda','number',S.business.bonus.percent,'required min="0" max="100" step="0.001"')}<button style="margin-top:14px">Guardar porcentaje</button></form></section>`;return html};pages.admin=adminPage;
pages['promoters-admin']=async function(){if(!S.access.primary)throw new Error('Solo administrador principal.');S.promotersAdmin=await v4('promoters_admin');return `<section class="panel"><div class="row between"><h1>Promotores</h1>${button('Atrás','nav','admin')}</div><form data-form="promoter-authorize">${input('target','ID del usuario para autorizar','text','','required pattern="[0-9]{6}"')}<button style="margin-top:14px">Autorizar promotor</button></form></section><input id="promoter-filter" placeholder="Buscar promotor por ID o nombre"><div id="promoter-list">${promoterCards(S.promotersAdmin,true)}</div>`};
const oldActions4=actions;
actions=async function(action,id,el){
 if(action==='coin-form'&&!canMove())return toast('Solo los promotores pueden enviar o solicitar monedas.',true);
 if(action==='invite'){const link=new URL(location.href);link.hash='';link.search='';link.searchParams.set('ref',S.profile.user_id);const text='Regístrate en MAIKET FLASH y recibe 0.20 Flash Coin.';if(navigator.share)await navigator.share({title:'MAIKET FLASH',text,url:link.href});else{await navigator.clipboard.writeText(text+' '+link.href);toast('Invitación copiada.')}return}
 if(action==='promoter-profile'){const p=S.business.promoters.find(p=>p.id===id);if(p)modal('Perfil del promotor',promoterCards([p]).replace(/<button[^>]*data-action="promoter-profile"[^>]*>.*?<\/button>/,''));return}
 if(action==='promoter-choose'){S.promotersAdmin=await v4('promoters_admin');S.chooseMode=id;modal(id==='recharge'?'Recargar promotor':'Retirar al promotor',`<input id="promoter-choose-filter" placeholder="Buscar por ID o nombre"><div id="promoter-choices">${choosePromoters(S.promotersAdmin,id)}</div>`);return}
 if(action==='promoter-funds'){const [kind,target]=id.split('|');formModal(kind==='recharge'?'Recargar promotor':'Retirar monedas del promotor','promoter-funds',input('target','ID del promotor','text',target,'required readonly')+input('amount','Cantidad Flash Coin','number','','required min="0.001" max="1000000000000" step="0.001"'),{kind,operation:uid()});return}
 if(action==='promoter-toggle'){const [target,active]=id.split('|');await v4('authorize',{target,active:active==='true',operation:uid()});return navigate('promoters-admin')}
 if(action==='treasury-mode'){await v4('mode',{unlimited:id==='true',operation:uid()});return navigate('admin')}
 if(action==='bet-number'&&!canAddBet()){toast('Contacta con un promotor.',true);return}
 return oldActions4(action,id,el)
};
function choosePromoters(list,mode){return list.filter(p=>p.active).map(p=>`<div class="useritem"><b>${esc(p.full_name)}</b><p>ID ${esc(p.user_id)} · ${fc(p.balance)}</p>${button('Elegir','promoter-funds',mode+'|'+p.user_id)}</div>`).join('')||blank('No hay promotores activos.')}
const oldSubmit4=submitForm;
submitForm=async function(kind,d,form,ctx){if(kind==='promoter-phone'){await v4('whatsapp',{phone:d.phone.replace(/\D/g,''),operation:ctx.operation||uid()});return navigate('promoter')}if(kind==='promoter-authorize'){await v4('authorize',{target:d.target,active:true,operation:ctx.operation||uid()});return navigate('promoters-admin')}if(kind==='promoter-funds'){await v4(ctx.kind,{target:d.target,amount:d.amount,operation:ctx.operation});close();await navigate('admin');return toast('Movimiento guardado.')}if(kind==='bonus-percent'){await v4('bonus_settings',{percent:d.percent,operation:ctx.operation||uid()});await navigate('admin');return toast('Porcentaje guardado.')}return oldSubmit4(kind,d,form,ctx)};
function canAddBet(){const r=S.roulette;if(!r||r.round?.status!=='betting'||!Number.isFinite(S.unit)||S.unit<Number(r.minimum_bet))return false;const total=Object.values(S.counts).reduce((a,b)=>a+Number(b),0)*S.unit;return total+S.unit<=Number(r.balance)+Number(r.my_bets?.total_amount||0)+.0000001}
const oldRender4=renderRoulette;
renderRoulette=function(){oldRender4();const r=S.roulette;if(!r||!$('#roulette-status'))return;document.querySelectorAll('[data-action=bet-number]').forEach(b=>{b.disabled=!canAddBet()||Number(S.counts[b.dataset.id]||0)>=12;b.classList.toggle('first-hit',r.round?.shot===2&&Number(b.dataset.id)===r.round.first_result)});$('#pot-balance').textContent=fc(r.bonus?.balance||0);const low=Number(r.balance)<Number(r.minimum_bet);$('#no-balance').classList.toggle('hidden',!low);$('#bonus-rule').textContent=`${r.bonus?.percent??1}% del total apostado alimenta el fondo de bonos. Se reparte en partes iguales entre los usuarios que acierten en los dos tiros; cada usuario cuenta una vez. El residuo menor de 0.001 FC se conserva en el fondo.`};
document.addEventListener('input',e=>{if(e.target.id==='promoter-filter'){const q=e.target.value.toLowerCase();$('#promoter-list').innerHTML=promoterCards(S.promotersAdmin.filter(p=>(p.user_id+' '+p.full_name).toLowerCase().includes(q)),true)}if(e.target.id==='promoter-choose-filter'){const q=e.target.value.toLowerCase();$('#promoter-choices').innerHTML=choosePromoters(S.promotersAdmin.filter(p=>(p.user_id+' '+p.full_name).toLowerCase().includes(q)),S.chooseMode)}});

const oldWallet4=wallet;wallet=async function(){await oldWallet4();document.querySelectorAll('[data-own-balance],#saldo-home').forEach(el=>el.textContent=fc(S.balance))};

const refCode=new URL(location.href).searchParams.get('ref');if(/^[0-9]{6}$/.test(refCode||''))localStorage.setItem('mfweb-referral',refCode);
boot();
</script></body></html>
