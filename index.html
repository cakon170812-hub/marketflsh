<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MARKET FLASH ⚡ Marketplace RD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- HEADER -->
    <header class="header">
      <div class="logo">MARKET <span>FLASH</span> ⚡</div>
      <div class="header-actions">
        <button id="btn-notificaciones" class="icon-btn">🔔</button>
        <button id="btn-perfil" class="icon-btn">👤</button>
      </div>
    </header>

    <!-- BUSQUEDA -->
    <section class="search-section">
      <input type="text" id="input-busqueda" placeholder="🔍 Buscar iPhone, Laptop, Carro...">
      <button id="btn-filtros" class="icon-btn">⚙️</button>
    </section>

    <!-- CATEGORIAS -->
    <section class="categorias">
      <div id="contenedor-categorias"></div>
    </section>

    <!-- BANNER PUBLICIDAD -->
    <section id="banner-publicidad" class="banner-ad"></section>

    <!-- PRODUCTOS -->
    <main>
      <h2 class="section-title">⚡ Productos Destacados</h2>
      <div id="contenedor-destacados" class="grid-productos"></div>
      
      <h2 class="section-title">🆕 Recientes</h2>
      <div id="contenedor-productos" class="grid-productos"></div>
    </main>

    <!-- NAV INFERIOR -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-page="inicio">🏠<span>Inicio</span></button>
      <button class="nav-item" data-page="buscar">🔍<span>Buscar</span></button>
      <button class="nav-item nav-publicar" id="btn-publicar-nav">+<span>Publicar</span></button>
      <button class="nav-item" data-page="notificaciones">🔔<span>Alertas</span></button>
      <button class="nav-item" data-page="perfil">👤<span>Perfil</span></button>
    </nav>

    <!-- PROPIETARIO -->
    <div class="propietario">by Julio Alcántara Gómez</div>
  </div>

  <!-- MODALES -->
  <div id="modal-publicar" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h2>PUBLICAR PRODUCTO ⚡</h2>
      <form id="form-publicar">
        <input type="text" id="prod-nombre" placeholder="Nombre del producto" required>
        <select id="prod-categoria" required></select>
        <input type="number" id="prod-precio" placeholder="Precio RD$" required>
        <input type="number" id="prod-cantidad" placeholder="Cantidad" value="1">
        <textarea id="prod-descripcion" placeholder="Descripción" rows="3" required></textarea>
        <input type="text" id="prod-ubicacion" placeholder="Ubicación: Santo Domingo">
        <select id="prod-condicion">
          <option value="Nuevo">Nuevo</option>
          <option value="Usado">Usado</option>
        </select>
        <div class="upload-area">
          <label>📷 Fotos <input type="file" id="prod-fotos" multiple accept="image/*"></label>
          <label>🎥 Video <input type="file" id="prod-video" accept="video/*"></label>
        </div>
        <div id="preview-imagenes"></div>
        <button type="submit" class="btn btn-azul btn-grande">PUBLICAR AHORA</button>
      </form>
    </div>
  </div>

  <div id="modal-detalle" class="modal">
    <div class="modal-content modal-lg">
      <span class="close-modal">&times;</span>
      <div id="detalle-producto"></div>
    </div>
  </div>

  <div id="modal-filtros" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h2>FILTROS AVANZADOS</h2>
      <input type="number" id="filtro-precio-min" placeholder="Precio Mínimo">
      <input type="number" id="filtro-precio-max" placeholder="Precio Máximo">
      <input type="text" id="filtro-ubicacion" placeholder="Ubicación">
      <button id="btn-aplicar-filtros" class="btn btn-naranja">APLICAR FILTROS</button>
    </div>
  </div>

  <!-- SUPABASE SDK - SOLO 1 VEZ -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
