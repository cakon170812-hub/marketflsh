<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- Adaptación automática a iPhone, Android, tablet y PC -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Market Flash</title>

    <!-- CSS principal -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         PANTALLA PRINCIPAL
         ===================================================== -->
    <main id="app">

        <section id="welcome-screen" class="screen active">

            <!-- Rayo de fondo -->
            <div class="background-lightning" aria-hidden="true">
                ⚡
            </div>

            <!-- Nombre de la aplicación -->
            <div class="brand">
                <h1>MARKET <span>FLASH</span></h1>
                <p>Tu mercado. Tu espacio.</p>
            </div>

            <!-- Botones principales -->
            <div class="main-buttons">

                <button
                    id="login-button"
                    class="primary-button"
                    type="button">
                    INICIO
                </button>

                <button
                    id="register-button"
                    class="secondary-button"
                    type="button">
                    CREAR CUENTA
                </button>

            </div>

        </section>


        <!-- =====================================================
             PANTALLA DE INICIO DE SESIÓN
             ===================================================== -->
        <section id="login-screen" class="screen">

            <div class="form-container">

                <div class="form-brand">
                    <span class="mini-lightning">⚡</span>
                    <h2>MARKET FLASH</h2>
                </div>

                <h3>Iniciar sesión</h3>
                <p class="form-description">
                    Accede a tu cuenta
                </p>

                <form id="login-form">

                    <div class="input-group">
                        <label for="login-cedula">
                            Número de cédula
                        </label>

                        <input
                            type="text"
                            id="login-cedula"
                            name="cedula"
                            placeholder="Ingrese su cédula"
                            autocomplete="username"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="login-password">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="login-password"
                            name="password"
                            placeholder="Ingrese su contraseña"
                            autocomplete="current-password"
                            required>
                    </div>

                    <button
                        type="submit"
                        class="primary-button form-button">
                        ENTRAR
                    </button>

                </form>

                <button
                    id="back-from-login"
                    class="back-button"
                    type="button">
                    ← Volver
                </button>

            </div>

        </section>


        <!-- =====================================================
             PANTALLA DE CREAR CUENTA
             ===================================================== -->
        <section id="register-screen" class="screen">

            <div class="form-container">

                <div class="form-brand">
                    <span class="mini-lightning">⚡</span>
                    <h2>MARKET FLASH</h2>
                </div>

                <h3>Crear cuenta</h3>
                <p class="form-description">
                    Regístrate para entrar a Market Flash
                </p>

                <form id="register-form">

                    <div class="input-group">
                        <label for="register-name">
                            Nombre completo
                        </label>

                        <input
                            type="text"
                            id="register-name"
                            name="name"
                            placeholder="Nombre completo"
                            autocomplete="name"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="register-cedula">
                            Número de cédula
                        </label>

                        <input
                            type="text"
                            id="register-cedula"
                            name="cedula"
                            placeholder="Número de cédula"
                            autocomplete="username"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="register-phone">
                            Número de teléfono
                        </label>

                        <input
                            type="tel"
                            id="register-phone"
                            name="phone"
                            placeholder="Número de teléfono"
                            autocomplete="tel"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="register-password">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="register-password"
                            name="password"
                            placeholder="Crear contraseña"
                            autocomplete="new-password"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="register-password-confirm">
                            Confirmar contraseña
                        </label>

                        <input
                            type="password"
                            id="register-password-confirm"
                            name="passwordConfirm"
                            placeholder="Repita la contraseña"
                            autocomplete="new-password"
                            required>
                    </div>

                    <button
                        type="submit"
                        class="primary-button form-button">
                        REGISTRARSE
                    </button>

                </form>

                <button
                    id="back-from-register"
                    class="back-button"
                    type="button">
                    ← Volver
                </button>

            </div>

        </section>


        <!-- =====================================================
             PANEL PRINCIPAL DE MARKET FLASH
             ===================================================== -->
        <section id="dashboard-screen" class="screen">

            <header class="dashboard-header">

                <div class="dashboard-brand">
                    <span>⚡</span>
                    <strong>MARKET FLASH</strong>
                </div>

                <!-- Botón de configuración -->
                <button
                    id="settings-button"
                    class="settings-button"
                    type="button"
                    aria-label="Abrir configuración">
                    ☰
                </button>

            </header>

            <div class="dashboard-content">

                <div class="dashboard-welcome">
                    <p>Bienvenido</p>
                    <h2 id="user-name-display">
                        Market Flash
                    </h2>
                </div>

                <div class="dashboard-placeholder">
                    <div class="dashboard-lightning">⚡</div>

                    <h3>Panel principal</h3>

                    <p>
                        Aquí construiremos las funciones de
                        Market Flash.
                    </p>
                </div>

            </div>


            <!-- Menú de configuración -->
            <aside
                id="settings-panel"
                class="settings-panel">

                <div class="settings-header">

                    <h3>Configuración</h3>

                    <button
                        id="close-settings"
                        type="button"
                        aria-label="Cerrar configuración">
                        ×
                    </button>

                </div>

                <div class="settings-options">

                    <button type="button">
                        ⚙️ Configuración de la app
                    </button>

                    <button
                        id="logout-button"
                        type="button">
                        🚪 Cerrar sesión
                    </button>

                </div>

            </aside>

        </section>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <!-- Datos generales -->
    <script src="data.js"></script>

    <!-- Datos/configuración de Market Flash -->
    <script src="appData.js"></script>

    <!-- Funcionamiento principal -->
    <script src="script.js"></script>

</body>
</html>
