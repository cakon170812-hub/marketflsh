<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">

<title>Market Flash</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
font-family: Arial, sans-serif;
background: #f4f5f7;
color: #171717;
}

header {
background: #111;
color: white;
padding: 18px 16px;
position: sticky;
top: 0;
z-index: 10;
}

.top {
max-width: 1100px;
margin: auto;
display: flex;
align-items: center;
justify-content: space-between;
gap: 12px;
}

.logo {
font-size: 25px;
font-weight: 800;
}

.tag {
font-size: 12px;
opacity: .75;
}

button {
border: 0;
border-radius: 10px;
padding: 11px 15px;
font-weight: 700;
cursor: pointer;
}

.primary {
background: #111;
color: white;
}

.light {
background: white;
color: #111;
border: 1px solid #ddd;
}

main {
max-width: 1100px;
margin: auto;
padding: 18px;
}

.hero {
background: white;
border-radius: 18px;
padding: 28px;
margin-bottom: 18px;
box-shadow: 0 3px 15px rgba(0,0,0,.06);
}

.hero h1 {
margin: 0 0 8px;
font-size: 34px;
}

.hero p {
color: #666;
margin: 0 0 18px;
}

.search {
display: flex;
gap: 8px;
}

.search input {
flex: 1;
padding: 13px;
border: 1px solid #ddd;
border-radius: 10px;
font-size: 16px;
}

.categories {
display: flex;
gap: 8px;
overflow-x: auto;
padding: 4px 0 18px;
}

.cat {
white-space: nowrap;
background: white;
border: 1px solid #ddd;
}

.cat.active {
background: #111;
color: white;
}

.grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
gap: 16px;
}

.card {
background: white;
border-radius: 16px;
overflow: hidden;
box-shadow: 0 3px 15px rgba(0,0,0,.06);
}

.photo {
height: 180px;
background: #e9eaec;
display: flex;
align-items: center;
justify-content: center;
font-size: 50px;
overflow: hidden;
}

.photo img {
width: 100%;
height: 100%;
object-fit: cover;
}

.info {
padding: 15px;
}

.info h3 {
margin: 0 0 7px;
}

.price {
font-size: 20px;
font-weight: 800;
margin: 7px 0;
}

.meta {
color: #777;
font-size: 13px;
}

.actions {
display: flex;
gap: 8px;
margin-top: 12px;
}

.empty {
text-align: center;
padding: 40px;
color: #777;
background: white;
border-radius: 16px;
}

.modal {
display: none;
position: fixed;
inset: 0;
background: rgba(0,0,0,.55);
z-index: 30;
padding: 18px;
overflow: auto;
}

.modal.show {
display: block;
}

.modalbox {
max-width: 560px;
background: white;
margin: 30px auto;
border-radius: 18px;
padding: 22px;
}

.modalbox h2 {
margin-top: 0;
}

.close {
float: right;
background: #eee;
}

.field {
margin: 12px 0;
}

.field label {
display: block;
font-weight: 700;
margin-bottom: 6px;
}

.field input,
.field select,
.field textarea {
width: 100%;
padding: 12px;
border: 1px solid #ddd;
border-radius: 9px;
font-size: 15px;
}

.row {
display: flex;
gap: 8px;
}

.row > * {
flex: 1;
}

.notice {
background: #fff7d6;
border: 1px solid #eadb8a;
padding: 12px;
border-radius: 10px;
margin-bottom: 15px;
font-size: 13px;
}

footer {
text-align: center;
padding: 30px;
color: #777;
}

@media (max-width: 600px) {

.hero h1 {
font-size: 28px;
}

.tag {
display: none;
}

.search {
flex-direction: column;
}

.grid {
grid-template-columns: repeat(2, minmax(0, 1fr));
gap: 10px;
}

.photo {
height: 135px;
}

.info {
padding: 11px;
}

.actions {
flex-direction: column;
}

.actions button {
width: 100%;
}
}
</style>
</head>

<body>

<header>

<div class="top">

<div>
<div class="logo">⚡ Market Flash</div>
<div class="tag">Compra • Vende • Publica</div>
</div>

<button class="light" onclick="openModal()">
+ Publicar
</button>

</div>

</header>

<main>

<section class="hero">

<h1>Compra y vende fácil</h1>

<p>
Encuentra teléfonos, computadoras y otros productos en Market Flash.
</p>

<div class="search">

<input
id="search"
type="text"
placeholder="¿Qué estás buscando?"
oninput="renderProducts()"
>

<button class="primary" onclick="renderProducts()">
Buscar
</button>

</div>

</section>

<div class="notice">

⚡ Market Flash está comenzando. Aquí podrás publicar y encontrar productos fácilmente.

</div>

<div class="categories">

<button class="cat active" onclick="setCategory('Todos', this)">
Todos
</button>

<button class="cat" onclick="setCategory('Teléfonos', this)">
📱 Teléfonos
</button>

<button class="cat" onclick="setCategory('Computadoras', this)">
💻 Computadoras
</button>

<button class="cat" onclick="setCategory('Accesorios', this)">
🎧 Accesorios
</button>

<button class="cat" onclick="setCategory('Otros', this)">
🛒 Otros
</button>

</div>

<div id="products" class="grid"></div>

</main>

<footer>

© 2026 Market Flash

</footer>

<div id="modal" class="modal">

<div class="modalbox">

<button class="close" onclick="closeModal()">✕</button>

<h2>Publicar producto</h2>

<form id="productForm">

<div class="field">

<label>Nombre del producto</label>

<input
id="name"
type="text"
placeholder="Ej. iPhone 13"
required
>

</div>

<div class="row">

<div class="field">

<label>Precio RD$</label>

<input
id="price"
type="number"
min="0"
placeholder="25000"
required
>

</div>

<div class="field">

<label>Categoría</label>

<select id="category">

<option>Teléfonos</option>
<option>Computadoras</option>
<option>Accesorios</option>
<option>Otros</option>

</select>

</div>

</div>

<div class="field">

<label>Descripción</label>

<textarea
id="description"
rows="3"
placeholder="Describe el producto"
></textarea>

</div>

<div class="field">

<label>Teléfono de contacto</label>

<input
id="phone"
type="tel"
placeholder="809-000-0000"
>

</div>

<div class="field">

<label>Foto del producto</label>

<input
id="image"
type="file"
accept="image/*"
>

</div>

<button class="primary" type="submit">

Publicar producto

</button>

</form>

</div>

</div>
<script>

let currentCategory = "Todos";

let products = JSON.parse(
localStorage.getItem("marketFlashProducts") || "[]"
);


/* ABRIR VENTANA DE PUBLICAR */

function openModal() {

document.getElementById("modal").classList.add("show");

}


/* CERRAR VENTANA */

function closeModal() {

document.getElementById("modal").classList.remove("show");

}


/* CAMBIAR CATEGORÍA */

function setCategory(category, button) {

currentCategory = category;

document.querySelectorAll(".cat").forEach(function(btn) {

btn.classList.remove("active");

});

button.classList.add("active");

renderProducts();

}


/* FORMULARIO DE PUBLICAR */

document.getElementById("productForm").addEventListener(
"submit",
function(event) {

event.preventDefault();

const name =
document.getElementById("name").value.trim();

const price =
document.getElementById("price").value;

const category =
document.getElementById("category").value;

const description =
document.getElementById("description").value.trim();

const phone =
document.getElementById("phone").value.trim();

const imageInput =
document.getElementById("image");


if (!name || !price) {

alert("Completa el nombre y el precio.");

return;

}


const createProduct = function(imageData) {

const product = {

id: Date.now(),

name: name,

price: Number(price),

category: category,

description: description,

phone: phone,

image: imageData || "",

createdAt: new Date().toLocaleDateString("es-DO")

};


products.unshift(product);


localStorage.setItem(
"marketFlashProducts",
JSON.stringify(products)
);


document.getElementById("productForm").reset();

closeModal();

renderProducts();


alert("¡Producto publicado correctamente!");

};


if (imageInput.files.length > 0) {

const file = imageInput.files[0];

const reader = new FileReader();


reader.onload = function(e) {

createProduct(e.target.result);

};


reader.readAsDataURL(file);

} else {

createProduct("");

}

}
);


/* MOSTRAR PRODUCTOS */

function renderProducts() {

const container =
document.getElementById("products");

const search =
document.getElementById("search")
.value
.toLowerCase()
.trim();


let filtered = products.filter(function(product) {

const matchesCategory =
currentCategory === "Todos" ||
product.category === currentCategory;


const text =
(
product.name +
" " +
product.description +
" " +
product.category
).toLowerCase();


const matchesSearch =
text.includes(search);


return matchesCategory && matchesSearch;

});


if (filtered.length === 0) {

container.innerHTML = `

<div class="empty">

<div style="font-size:45px;">
🛍️
</div>

<h3>No hay productos todavía</h3>

<p>
Sé el primero en publicar un producto.
</p>

<button
class="primary"
onclick="openModal()"
>
+ Publicar producto
</button>

</div>

`;

return;

}


container.innerHTML = filtered.map(function(product) {

const imageHTML = product.image

? `
<img
src="${product.image}"
alt="${escapeHTML(product.name)}"
>
`

: getEmoji(product.category);


const phoneButton = product.phone

? `
<button
class="primary"
onclick="contactSeller('${escapeJS(product.phone)}')"
>
📞 Contactar
</button>
`

: "";


return `

<article class="card">

<div class="photo">

${imageHTML}

</div>


<div class="info">

<h3>
${escapeHTML(product.name)}
</h3>


<div class="price">

RD$ ${formatPrice(product.price)}

</div>


<div class="meta">

${escapeHTML(product.category)}

·

${product.createdAt}

</div>


${
product.description
?
`
<p>
${escapeHTML(product.description)}
</p>
`
:
""
}


<div class="actions">

${phoneButton}

<button
class="light"
onclick="deleteProduct(${product.id})"
>
🗑️ Eliminar
</button>

</div>

</div>

</article>

`;

}).join("");

}


/* PRECIO */

function formatPrice(price) {

return Number(price).toLocaleString("es-DO");

}


/* EMOJIS DE CATEGORÍAS */

function getEmoji(category) {

if (category === "Teléfonos") {

return "📱";

}

if (category === "Computadoras") {

return "💻";

}

if (category === "Accesorios") {

return "🎧";

}

return "🛒";

}


/* CONTACTAR */

function contactSeller(phone) {

const cleanPhone =
phone.replace(/\D/g, "");


if (!cleanPhone) {

alert("Este vendedor no agregó un teléfono.");

return;

}


window.location.href =
"https://wa.me/" +
cleanPhone +
"?text=Hola%2C%20vi%20tu%20producto%20en%20Market%20Flash.";


}


/* ELIMINAR PRODUCTO */

function deleteProduct(id) {

const confirmDelete =
confirm("¿Quieres eliminar este producto?");


if (!confirmDelete) {

return;

}


products =
products.filter(function(product) {

return product.id !== id;

});


localStorage.setItem(
"marketFlashProducts",
JSON.stringify(products)
);


renderProducts();

}


/* SEGURIDAD DEL TEXTO */

function escapeHTML(text) {

return String(text)

.replace(/&/g, "&amp;")

.replace(/</g, "&lt;")

.replace(/>/g, "&gt;")

.replace(/"/g, "&quot;")

.replace(/'/g, "&#039;");

}


function escapeJS(text) {

return String(text)

.replace(/\\/g, "\\\\")

.replace(/'/g, "\\'")

.replace(/\n/g, "\\n");

}


/* CERRAR MODAL AL TOCAR AFUERA */

document.getElementById("modal").addEventListener(
"click",
function(event) {

if (event.target === this) {

closeModal();

}

}
);


/* CARGAR PRODUCTOS AL ABRIR */

renderProducts();

</script>

</body>
</html>
