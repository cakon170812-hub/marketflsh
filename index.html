<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Flash</title>
</head>
<body>

  <div id="app">

    <section id="welcome">
      <div class="logo">MF</div>
      <h1>Market Flash</h1>
      <p>Compra, vende y encuentra lo que necesitas.</p>
      <button id="enterBtn">Entrar</button>
    </section><section id="login" hidden>

      <div class="logo">MF</div>

      <h2>Bienvenido</h2>

      <p>Inicia sesión en Market Flash.</p>

      <input
        id="email"
        type="email"
        placeholder="Correo electrónico"
      >

      <input
        id="password"
        type="password"
        placeholder="Contraseña"
      >

      <button id="loginBtn">
        Iniciar sesión
      </button>

      <button id="registerBtn">
        Crear una cuenta
      </button>

      <button id="forgotBtn">
        ¿Olvidaste tu contraseña?
      </button>

    </section>
<section id="register" hidden>

      <h2>Crear cuenta</h2>

      <p>Únete a Market Flash.</p>

      <input
        id="fullName"
        type="text"
        placeholder="Nombre completo"
      >

      <input
        id="cedula"
        type="text"
        placeholder="Número de cédula"
      >

      <input
        id="phone"
        type="tel"
        placeholder="Número de teléfono"
      >

      <input
        id="registerEmail"
        type="email"
        placeholder="Correo electrónico"
      >

      <input
        id="registerPassword"
        type="password"
        placeholder="Crear contraseña"
      >

      <button id="createAccountBtn">
        Registrarme
      </button>

      <button id="backLoginBtn">
        Ya tengo una cuenta
      </button>

    </section><section id="home" hidden>

      <header>

        <div class="logo-small">MF</div>

        <h2>Market Flash</h2>

        <button id="notificationBtn">
          🔔
        </button>

      </header>

      <div class="search">

        <input
          id="search"
          type="search"
          placeholder="¿Qué estás buscando?"
        >

        <button id="searchBtn">
          🔎
        </button>

      </div>

      <button id="publishBtn">
        ＋ Publicar producto
      </button>

      <h3>Categorías</h3>

      <div id="categories">

        <button>📱 Teléfonos</button>
        <button>💻 Electrónica</button>
        <button>🏍️ Vehículos</button>
        <button>🏠 Hogar</button>

      </div>
<div id="products">

        <h3>Productos destacados</h3>

        <div id="featuredProducts">
        </div>

        <h3>Productos recientes</h3>

        <div id="recentProducts">
        </div>

      </div>

      <nav id="bottomMenu">

        <button id="homeBtn">
          🏠
          <span>Inicio</span>
        </button>

        <button id="categoriesBtn">
          🗂️
          <span>Categorías</span>
        </button>

        <button id="favoritesBtn">
          ❤️
          <span>Favoritos</span>
        </button>

        <button id="profileBtn">
          👤
          <span>Perfil</span>
        </button>

      </nav>

    </section><section id="publish" hidden>

      <h2>Publicar producto</h2>

      <input
        id="productName"
        type="text"
        placeholder="Nombre del producto"
      >

      <input
        id="productPrice"
        type="number"
        placeholder="Precio"
      >

      <select id="productCategory">

        <option value="">
          Selecciona categoría
        </option>

        <option value="Telefonos">
          📱 Teléfonos
        </option>

        <option value="Electronica">
          💻 Electrónica
        </option>

        <option value="Vehiculos">
          🏍️ Vehículos
        </option>

        <option value="Hogar">
          🏠 Hogar
        </option>

      </select>

      <textarea
        id="productDescription"
        placeholder="Describe tu producto"
      ></textarea>

      <input
        id="productImages"
        type="file"
        accept="image/*"
        multiple
      >

      <button id="saveProductBtn">
        Publicar
      </button>

      <button id="cancelPublishBtn">
        Cancelar
      </button>

    </section><section id="productDetail" hidden>

      <button id="closeProductBtn">
        ← Volver
      </button>

      <div id="productImagesView">
      </div>

      <h2 id="detailName">
        Producto
      </h2>

      <h3 id="detailPrice">
        $0
      </h3>

      <p id="detailDescription">
        Descripción del producto.
      </p>

      <p id="detailSeller">
        Vendedor
      </p>

      <button id="whatsappBtn">
        WhatsApp
      </button>

      <button id="messengerBtn">
        Messenger
      </button>

      <button id="shareBtn">
        Compartir
      </button>

      <button id="favoriteBtn">
        ❤️ Guardar
      </button>

    </section>
