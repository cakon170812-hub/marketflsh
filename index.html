<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Market Flash">
  <title>Market Flash</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <!-- BARRA SUPERIOR -->
  <header class="topbar">

    <div class="brand">
      <span>Market</span> Flash
    </div>

    <div class="search-wrap">
      <span>⌕</span>

      <input
        id="searchInput"
        type="search"
        placeholder="Buscar en Market Flash..."
      >
    </div>

    <button
      class="round-btn"
      id="notifyBtn"
      aria-label="Notificaciones"
    >
      🔔
      <b id="notifyBadge" class="badge hidden">0</b>
    </button>

  </header>


  <!-- CONTENIDO PRINCIPAL -->
  <main id="mainContent" class="main-content">

    <!-- PRESENTACIÓN -->
    <section class="hero">

      <div>

        <small>MARKET FLASH</small>

        <h1>
          Encuentra lo que necesitas
        </h1>

        <p>
          Compra, vende y conecta con personas de tu zona.
        </p>

      </div>

    </section>


    <!-- FLASH DEL DÍA -->
    <button
      id="flashDayBtn"
      class="flash-day"
      type="button"
    >

      <div class="flash-icon">
        ⚡
      </div>

      <div class="flash-copy">

        <span>
          PUBLICIDAD
        </span>

        <strong>
          Publicación Flash del Día
        </strong>

        <small>
          Descubre anuncios destacados y oportunidades.
        </small>

      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <!-- TÍTULO DE PUBLICACIONES -->
    <div class="section-title">

      <h2>
        Publicaciones
      </h2>

      <span id="productCount"></span>

    </div>


    <!-- CATEGORÍAS -->
    <div
      id="categoryRow"
      class="chips"
    ></div>


    <!-- PRODUCTOS -->
    <section
      id="productsGrid"
      class="products-grid"
    ></section>

  </main>


  <!-- BARRA INFERIOR -->
  <nav
    class="bottom-nav"
    aria-label="Navegación principal"
  >

    <!-- CHAT -->
    <button
      class="nav-item"
      data-page="chat"
    >

      <span>
        💬
      </span>

      <small>
        Chat
      </small>

      <b
        id="chatBadge"
        class="nav-badge hidden"
      >
        0
      </b>

    </button>


    <!-- INICIO -->
    <button
      class="nav-item active"
      data-page="home"
    >

      <span>
        ⌂
      </span>

      <small>
        Inicio
      </small>

    </button>


    <!-- BOTÓN PUBLICAR -->
    <button
      id="publishBtn"
      class="publish-plus"
      aria-label="Publicar"
    >
      ＋
    </button>


    <!-- ACTIVIDAD -->
    <button
      class="nav-item"
      data-page="activity"
    >

      <span>
        ▣
      </span>

      <small>
        Actividad
      </small>

    </button>


    <!-- PERFIL -->
    <button
      class="nav-item"
      data-page="profile"
    >

      <span>
        ●
      </span>

      <small>
        Mi perfil
      </small>

    </button>

  </nav>

</div>


<!-- VENTANA MODAL -->
<div
  id="modal"
  class="modal hidden"
>

  <div
    id="modalCard"
    class="modal-card"
  ></div>

</div>


<!-- MENSAJE TEMPORAL -->
<div
  id="toast"
  class="toast hidden"
></div>


<!-- JAVASCRIPT -->
<script src="script.js"></script>

</body>
</html>
