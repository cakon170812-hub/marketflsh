.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#182950,#05070d 55%)}
.auth-card,.panel{width:min(100%,520px);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.55);backdrop-filter:blur(15px)}
.brand{text-align:center;font-weight:950;letter-spacing:2px;font-size:26px;color:#ffe28a;text-shadow:0 0 18px rgba(255,168,0,.5)}
.sub{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 16px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;border:1px solid #344055;border-radius:12px;padding:11px;background:#111722;color:#fff;font-weight:800}.tab.active{background:linear-gradient(135deg,#ffe273,#c98800);color:#1b1200;border-color:#ffda58}
.field{width:100%;border:1px solid #354157;border-radius:12px;padding:12px;margin:6px 0;background:#070c14;color:#fff;outline:none;font-size:16px}.field:focus{border-color:#ffd45a}.primary,.action{width:100%;border:0;border-radius:13px;padding:13px;margin-top:8px;font-weight:900;background:linear-gradient(135deg,#ffe272,#c98a00);color:#1b1200}.action.blue{background:#1675e8;color:#fff}.action.green{background:#16894b;color:#fff}.action.red{background:#a92835;color:#fff}.action.dark{background:#202a3a;color:#fff;border:1px solid #3a4659}.tiny{font-size:12px;color:var(--muted)}
.topbar{width:min(100%,620px);margin:0 auto;display:flex;align-items:center;gap:7px;padding:10px 0 3px}.top-tools{display:flex;align-items:center;gap:7px}.wallet-row{width:min(100%,620px);margin:5px auto 0;display:flex;align-items:center;gap:7px}.wallet-row .balance-chip{flex:1}.promoter-chip{white-space:nowrap;background:linear-gradient(135deg,#135a91,#0a263d);border-color:#42b8ff;color:#fff}.brand-mini{font-weight:950;color:#ffe182;letter-spacing:1px;margin-right:auto;font-size:16px;text-shadow:0 2px 8px #000}.icon-btn,.balance-chip{border:1px solid rgba(255,215,90,.35);background:rgba(5,10,18,.88);color:#fff;border-radius:12px;min-height:42px;padding:8px 10px;font-weight:850}.balance-chip{display:flex;align-items:center;gap:7px;font-size:13px}.balance-chip strong{color:#6cff94}.icon-btn{min-width:42px}.group-btn{font-size:11px}
.machine{width:min(100%,620px);margin:8px auto 0;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.13);border-radius:25px;padding:13px 10px 14px;backdrop-filter:blur(4px)}
.roundbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:8px}.round-meta{font-size:11px;color:#d1d7e0}.round-meta.right{text-align:right}.timer{min-width:80px;text-align:center;border-radius:14px;padding:8px;background:#070b11;border:1px solid #5e4b20;color:#ffd65b;font-size:24px;font-weight:950;box-shadow:0 0 16px rgba(255,166,0,.18)}
.wheel-wrap{position:relative;width:min(82vw,360px);aspect-ratio:1;margin:5px auto 9px}.pointer{position:absolute;z-index:30;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:35px solid #ffe168;filter:drop-shadow(0 0 7px #ff9800)}
.wheel-shell{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(#ffdc72 0deg 3deg,#765000 3deg 6deg);box-shadow:0 0 0 4px #382200,0 0 25px rgba(255,160,0,.75),0 0 55px rgba(20,111,255,.25)}.wheel-shell:after{content:"";position:absolute;inset:7%;border-radius:50%;background:#05070c;box-shadow:inset 0 0 22px #000}
.wheel{position:absolute;z-index:5;inset:8.5%;border-radius:50%;border:3px solid #e3ad3b;background:conic-gradient(from -13.846deg,#0c9345 0deg 27.692deg,#b91e29 27.692deg 55.384deg,#11151d 55.384deg 83.076deg,#b91e29 83.076deg 110.768deg,#11151d 110.768deg 138.46deg,#b91e29 138.46deg 166.152deg,#11151d 166.152deg 193.844deg,#b91e29 193.844deg 221.536deg,#11151d 221.536deg 249.228deg,#b91e29 249.228deg 276.92deg,#11151d 276.92deg 304.612deg,#b91e29 304.612deg 332.304deg,#11151d 332.304deg 360deg);box-shadow:inset 0 0 25px #000;transition:transform 8s cubic-bezier(.11,.7,.1,1);will-change:transform}.wheel:after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from -13.846deg,transparent 0 26.7deg,rgba(255,224,140,.95) 26.7deg 27.692deg);pointer-events:none}
.wn{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px;display:grid;place-items:center;font-weight:950;font-size:18px;text-shadow:0 2px 4px #000;z-index:7;transform:rotate(var(--a)) translateY(calc(-1 * min(24vw,104px))) rotate(calc(-1 * var(--a)))}
