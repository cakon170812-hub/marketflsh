<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Market Flash</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="app">

    <section id="welcomeScreen" class="screen welcome-screen">

      <div class="welcome-logo">
        MF
      </div>

      <h1>Market Flash</h1>

      <p>
        Compra y vende fácil,
        rápido y seguro.
      </p>

      <button id="startButton">
        Comenzar
      </button>

    </section><section id="authScreen" class="screen auth-screen" hidden>

      <div class="auth-card">

        <div class="auth-logo">
          MF
        </div>

        <h2>Bienvenido</h2>

        <p>Inicia sesión para continuar.</p>

        <input
          id="loginEmail"
          type="email"
          placeholder="Correo electrónico"
        >

        <input
          id="loginPassword"
          type="password"
          placeholder="Contraseña"
        >

        <button id="loginButton">
          Iniciar sesión
        </button>

        <button id="showRegisterButton">
          Crear una cuenta
        </button>

        <button id="forgotPasswordButton">
          ¿Olvidaste tu contraseña?
        </button>

      </div>

    </section>
