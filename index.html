<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>Market Flash</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f7fb;
    color:#111827;
    min-height:100vh;
}

button,input,select,textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:100;
    background:#fff;
    border-bottom:1px solid #e5e7eb;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    font-size:23px;
    font-weight:900;
    white-space:nowrap;
}

.logo span{
    color:#2563eb;
}

.search{
    flex:1;
    min-width:80px;
    border:1px solid #e5e7eb;
    background:#f3f5f8;
    border-radius:14px;
    padding:12px 14px;
    outline:none;
}

.search:focus{
    border-color:#2563eb;
}

.profile-btn{
    width:44px;
    height:44px;
    border-radius:50%;
    background:#eef2ff;
    font-size:20px;
}

/* MAIN */

main{
    max-width:1200px;
    margin:auto;
    padding:18px 15px 100px;
}

.categories{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding-bottom:15px;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex:0 0 auto;
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:22px;
    padding:10px 15px;
    font-weight:700;
}

.category.active{
    background:#2563eb;
    color:#fff;
}

/* PUBLICIDAD */

.ad-space{
    min-height:100px;
    margin-bottom:20px;
    border-radius:20px;
    background:#fff;
    border:1px dashed #cbd5e1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:18px;
}

.ad-label{
    font-size:11px;
    color:#64748b;
    font-weight:800;
    text-transform:uppercase;
}

.ad-title{
    margin-top:5px;
    font-size:19px;
    font-weight:900;
}

.ad-text{
    margin-top:5px;
    color:#64748b;
}

/* PRODUCTOS */

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:13px;
}

.section-title h2{
    font-size:22px;
}

.section-count{
    color:#64748b;
    font-size:13px;
}

.products{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.product-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:18px;
    overflow:hidden;
    transition:.2s;
}

.product-card:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.product-image{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    background:#e5e7eb;
}

.product-info{
    padding:12px;
}

.product-name{
    font-weight:800;
    margin-bottom:5px;
}

.product-price{
    font-size:18px;
    font-weight:900;
}

.product-location{
    margin-top:5px;
    color:#64748b;
    font-size:12px;
}

/* NAV */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:70px;
    background:#fff;
    border-top:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-around;
    z-index:200;
}

.nav-item{
    background:none;
    color:#64748b;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    font-size:11px;
    font-weight:700;
}

.nav-item.active{
    color:#2563eb;
}

.nav-icon{
    font-size:21px;
}

.publish-btn{
    width:55px;
    height:55px;
    border-radius:50%;
    background:#2563eb;
    color:#fff;
    font-size:29px;
    margin-top:-25px;
    box-shadow:0 8px 20px rgba(37,99,235,.3);
}

/* MODAL */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    z-index:500;
    display:flex;
    justify-content:center;
    align-items:flex-end;
}

.modal{
    width:100%;
    max-width:650px;
    max-height:92vh;
    overflow-y:auto;
    background:#fff;
    border-radius:25px 25px 0 0;
    padding:22px;
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.close-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#f1f5f9;
    font-size:22px;
}

/* FORMULARIOS */

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    font-weight:800;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:13px;
    border:1px solid #dbe1e8;
    border-radius:12px;
    outline:none;
}

.form-group textarea{
    min-height:110px;
    resize:vertical;
}

.primary-btn{
    width:100%;
    padding:14px;
    background:#2563eb;
    color:#fff;
    border-radius:13px;
    font-weight:800;
}

.secondary-btn{
    width:100%;
    padding:14px;
    background:#f1f5f9;
    color:#111827;
    border-radius:13px;
    font-weight:800;
    margin-top:9px;
}

/* PERFIL */

.profile-card{
    text-align:center;
    background:#f8fafc;
    border-radius:20px;
    padding:20px;
}

.avatar{
    width:85px;
    height:85px;
    border-radius:50%;
    margin:auto auto 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#dbeafe;
    font-size:38px;
}

.menu{
    margin-top:15px;
    border:1px solid #e5e7eb;
    border-radius:18px;
    overflow:hidden;
}

.menu-item{
    width:100%;
    background:#fff;
    padding:15px;
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    border-bottom:1px solid #edf0f3;
}

.menu-item:last-child{
    border-bottom:0;
}

.menu-icon{
    width:44px;
    height:44px;
    border-radius:13px;
    background:#eff6ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
}

.menu-text{
    flex:1;
}

.menu-text strong{
    display:block;
}

.menu-text small{
    color:#64748b;
}

/* TARJETAS */

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:18px;
    padding:18px;
    text-align:left;
}

.card-icon{
    font-size:31px;
    margin-bottom:10px;
}

.card strong{
    display:block;
    font-size:16px;
}

.card small{
    color:#64748b;
}

/* ESTADÍSTICAS */

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:15px;
}

.stat{
    background:#f8fafc;
    border-radius:15px;
    padding:15px;
}

.stat-number{
    font-size:23px;
    font-weight:900;
}

.stat-label{
    color:#64748b;
    font-size:12px;
}

/* TOGGLE */

.setting-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 0;
    border-bottom:1px solid #e5e7eb;
}

.toggle{
    width:53px;
    height:30px;
    border-radius:20px;
    background:#cbd5e1;
    position:relative;
}

.toggle:after{
    content:"";
    position:absolute;
    width:24px;
    height:24px;
    top:3px;
    left:3px;
    border-radius:50%;
    background:#fff;
    transition:.2s;
}

.toggle.on{
    background:#2563eb;
}

.toggle.on:after{
    left:26px;
}

/* ESCRITORIO */

@media(min-width:700px){

    .products{
        grid-template-columns:repeat(4,1fr);
    }

    .overlay{
        align-items:center;
    }

    .modal{
        border-radius:25px;
        max-height:88vh;
    }

}
</style>

</head>

<script>

let currentCategory = "Todos";

let products = [

    {
        id:1,
        name:"iPhone 15 Pro",
        category:"Celulares",
        price:45000,
        location:"Santo Domingo",
        seller:"Market Flash",
        image:"https://images.unsplash.com/photo-1696446702183-cbd13d5f2e88?auto=format&fit=crop&w=800&q=80",
        views:1284,
        likes:86,
        saves:34,
        profileVisits:21
    },

    {
        id:2,
        name:"Samsung Galaxy S24",
        category:"Celulares",
        price:38000,
        location:"Santiago",
        seller:"Tecnología RD",
        image:"https://images.unsplash.com/photo-1610945415295-d9bbf067e59c?auto=format&fit=crop&w=800&q=80",
        views:743,
        likes:51,
        saves:18,
        profileVisits:14
    },

    {
        id:3,
        name:"Laptop profesional",
        category:"Computadoras",
        price:52000,
        location:"Santo Domingo",
        seller:"Tech Store",
        image:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=800&q=80",
        views:491,
        likes:29,
        saves:11,
        profileVisits:8
    },

    {
        id:4,
        name:"PlayStation 5",
        category:"Videojuegos",
        price:32000,
        location:"Santo Domingo Este",
        seller:"Gaming RD",
        image:"https://images.unsplash.com/photo-1606813907291-d86efa9b94db?auto=format&fit=crop&w=800&q=80",
        views:952,
        likes:73,
        saves:42,
        profileVisits:25
    }

];


let currentUser = null;


/* PRECIO */

function price(value){

    return new Intl.NumberFormat("es-DO",{
        style:"currency",
        currency:"DOP",
        maximumFractionDigits:0
    }).format(value);

}


/* MOSTRAR PRODUCTOS */

function render(list){

    const box=document.getElementById("products");

    box.innerHTML="";

    document.getElementById("count").textContent =
        list.length + (list.length === 1 ? " producto" : " productos");


    if(!list.length){

        box.innerHTML=`
            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:50px 20px;
                color:#64748b;
            ">
                <div style="font-size:45px;">🔎</div>
                <h3>No encontramos productos</h3>
                <p>Prueba con otra búsqueda.</p>
            </div>
        `;

        return;

    }


    list.forEach(p=>{

        const card=document.createElement("article");

        card.className="product-card";

        card.onclick=()=>openProduct(p.id);

        card.innerHTML=`

            <img
                class="product-image"
                src="${p.image}"
                alt="${p.name}"
            >

            <div class="product-info">

                <div class="product-name">
                    ${p.name}
                </div>

                <div class="product-price">
                    ${price(p.price)}
                </div>

                <div class="product-location">
                    📍 ${p.location}
                </div>

            </div>

        `;

        box.appendChild(card);

    });

}


/* CATEGORÍAS */

function category(name,button){

    currentCategory=name;

    document.querySelectorAll(".category")
        .forEach(b=>b.classList.remove("active"));

    button.classList.add("active");

    searchProducts();

}


/* BÚSQUEDA */

document.getElementById("search")
    .addEventListener("input",searchProducts);


function searchProducts(){

    const q=document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    let result=[...products];


    if(currentCategory!=="Todos"){

        result=result.filter(
            p=>p.category===currentCategory
        );

    }


    if(q){

        result=result.filter(p=>

            p.name.toLowerCase().includes(q) ||

            p.category.toLowerCase().includes(q) ||

            p.location.toLowerCase().includes(q)

        );

    }


    render(result);

}


function focusSearch(){

    document.getElementById("search").focus();

}


/* MODAL */

function openModal(html){

    document.getElementById("modal").innerHTML=html;

    document.getElementById("overlay")
        .classList.remove("hidden");

}


function closeModal(){

    document.getElementById("overlay")
        .classList.add("hidden");

}


document.getElementById("overlay")
    .addEventListener("click",function(e){

        if(e.target===this){
            closeModal();
        }

    });


/* PRODUCTO */

function openProduct(id){

    const p=products.find(x=>x.id===id);

    if(!p)return;

    p.views++;


    openModal(`

        <div class="modal-header">

            <h2>${p.name}</h2>

            <button class="close-btn" onclick="closeModal()">
                ×
            </button>

        </div>


        <img
            src="${p.image}"
            alt="${p.name}"
            style="
                width:100%;
                max-height:380px;
                object-fit:cover;
                border-radius:18px;
            "
        >


        <div style="margin-top:18px;">

            <div style="
                font-size:27px;
                font-weight:900;
            ">
                ${price(p.price)}
            </div>

            <div style="
                margin-top:6px;
                color:#64748b;
            ">
                📍 ${p.location}
            </div>

        </div>


        <div style="
            margin-top:18px;
            padding:16px;
            border-radius:15px;
            background:#f8fafc;
        ">

            <strong>👤 Vendedor</strong>

            <div style="margin-top:5px;">
                ${p.seller}
            </div>

        </div>


        <div class="stats">

            <div class="stat">
                <div class="stat-number">${p.views}</div>
                <div class="stat-label">👁️ Visualizaciones</div>
            </div>

            <div class="stat">
                <div class="stat-number">${p.likes}</div>
                <div class="stat-label">❤️ Reacciones</div>
            </div>

            <div class="stat">
                <div class="stat-number">${p.saves}</div>
                <div class="stat-label">🔖 Guardados</div>
            </div>

            <div class="stat">
                <div class="stat-number">${p.profileVisits}</div>
                <div class="stat-label">👤 Visitas al perfil</div>
            </div>

        </div>


        <button
            class="primary-btn"
            style="margin-top:18px;"
            onclick="likeProduct(${p.id})"
        >
            ❤️ Me interesa
        </button>


        <button
            class="secondary-btn"
            onclick="contactSeller('${p.seller}')"
        >
            📞 Contactar vendedor
        </button>

    `);

}


function likeProduct(id){

    const p=products.find(x=>x.id===id);

    if(!p)return;

    p.likes++;

    alert("❤️ Producto marcado como interesado.");

}


function contactSeller(name){

    alert(
        "Contacto con " +
        name +
        ".\n\nLa mensajería se conectará en la siguiente etapa."
    );

}


/* PUBLICAR */

function openPublish(){

    openModal(`

        <div class="modal-header">

            <h2>➕ Publicar producto</h2>

            <button class="close-btn" onclick="closeModal()">
                ×
            </button>

        </div>


        <form id="publishForm">

            <div class="form-group">

                <label>📸 Imagen</label>

                <input
                    id="newImage"
                    type="url"
                    placeholder="URL de la imagen"
                    required
                >

            </div>


            <div class="form-group">

                <label>🏷️ Nombre del producto</label>

                <input
                    id="newName"
                    type="text"
                    placeholder="Ej. iPhone 15 Pro"
                    required
                >

            </div>


            <div class="form-group">

                <label>📂 Categoría</label>

                <select id="newCategory" required>

                    <option value="">Seleccionar</option>
                    <option>Celulares</option>
                    <option>Computadoras</option>
                    <option>Videojuegos</option>
                    <option>Ropa</option>
                    <option>Hogar</option>
                    <option>Vehículos</option>

                </select>

            </div>


            <div class="form-group">

                <label>💰 Precio</label>

                <input
                    id="newPrice"
                    type="number"
                    min="0"
                    placeholder="Precio"
                    required
                >

            </div>


            <div class="form-group">

                <label>📍 Ubicación</label>

                <input
                    id="newLocation"
                    type="text"
                    placeholder="Ciudad o provincia"
                    required
                >

            </div>


            <div class="form-group">

                <label>📝 Descripción</label>

                <textarea
                    id="newDescription"
                    placeholder="Describe el producto..."
                ></textarea>

```
        </div>


        <button
            type="submit"
            class="primary-btn"
        >
            🚀 Publicar
        </button>

    </form>

`);


document.getElementById("publishForm")
    .addEventListener("submit",function(e){

        e.preventDefault();


        const p={

            id:Date.now(),

            name:document.getElementById("newName").value,

            category:document.getElementById("newCategory").value,

            price:Number(document.getElementById("newPrice").value),

            location:document.getElementById("newLocation").value,

            seller:currentUser
                ? currentUser.name
                : "Nuevo vendedor",

            image:document.getElementById("newImage").value,

            views:0,
            likes:0,
            saves:0,
            profileVisits:0

        };


        products.unshift(p);

        closeModal();

        currentCategory="Todos";

        document.querySelectorAll(".category")
            .forEach(b=>b.classList.remove("active"));

        document.querySelector(".category")
            .classList.add("active");

        render(products);

        alert("✅ Producto publicado correctamente.");

    });
```

}

/* REGISTRO */

function openRegister(){

```
openModal(`

    <div class="modal-header">

        <h2>📝 Crear cuenta</h2>

        <button class="close-btn" onclick="closeModal()">
            ×
        </button>

    </div>


    <form id="registerForm">

        <div class="form-group">

            <label>👤 Nombre real completo</label>

            <input
                id="registerName"
                type="text"
                placeholder="Igual que aparece en la cédula"
                required
            >

        </div>


        <div class="form-group">

            <label>🪪 Número de cédula</label>

            <input
                id="registerCedula"
                type="text"
                placeholder="Número de cédula"
                required
            >

        </div>


        <div class="form-group">

            <label>🔐 Contraseña</label>

            <input
                id="registerPassword"
                type="password"
                placeholder="Crear contraseña"
                required
            >

        </div>


        <div class="form-group">

            <label>🛡️ Pregunta de recuperación</label>

            <select id="registerQuestion" required>

                <option value="">Seleccionar</option>

                <option>
                    ¿Cuál era tu apodo de infancia?
                </option>

                <option>
                    ¿Cuál fue tu primer trabajo?
                </option>

                <option>
                    ¿Cuál es tu comida favorita?
                </option>

                <option>
                    ¿Cuál era el nombre de tu primera mascota?
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>🛡️ Respuesta</label>

            <input
                id="registerAnswer"
                type="text"
                required
            >

/* LOGIN */

function openLogin(){

```
openModal(`

    <div class="modal-header">

        <h2>🔐 Iniciar sesión</h2>

        <button class="close-btn" onclick="closeModal()">
            ×
        </button>

    </div>


    <form id="loginForm">

        <div class="form-group">

            <label>🪪 Número de cédula</label>

            <input
                id="loginCedula"
                required
            >

        </div>


        <div class="form-group">

            <label>🔐 Contraseña</label>

            <input
                id="loginPassword"
                type="password"
                required
            >

        </div>


        <button class="primary-btn">
            Entrar
        </button>

    </form>


    <button
        class="secondary-btn"
        onclick="openRecovery()"
    >
        🔑 Recuperar contraseña
    </button>

`);


document.getElementById("loginForm")
    .addEventListener("submit",function(e){

        e.preventDefault();


        const saved=
            localStorage.getItem("marketFlashUser");


        if(!saved){

            alert("No existe una cuenta en este dispositivo.");

            return;

        }


        const user=JSON.parse(saved);


        if(user.blocked){

            alert("🚫 Esta cuenta está bloqueada.");

            return;

        }


        if(
            user.cedula===
            document.getElementById("loginCedula").value
            &&
            user.password===
            document.getElementById("loginPassword").value
        ){

            currentUser=user;

            closeModal();

            alert("✅ Bienvenido a Market Flash.");

        }else{

            alert("❌ Cédula o contraseña incorrecta.");

        }

    });
```

}
