<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Market Flash</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="app">

    <section id="welcomeScreen" class="screen welcome-screen">

      <div class="welcome-logo">
        MF
      </div>

      <h1>Market Flash</h1>

      <p>
        Compra y vende fácil,
        rápido y seguro.
      </p>

      <button id="startButton">
        Comenzar
      </button>

    </section><section id="authScreen" class="screen auth-screen" hidden>

      <div class="auth-card">

        <div class="auth-logo">
          MF
        </div>

        <h2>Bienvenido</h2>

        <p>Inicia sesión para continuar.</p>

        <input
          id="loginEmail"
          type="email"
          placeholder="Correo electrónico"
        >

        <input
          id="loginPassword"
          type="password"
          placeholder="Contraseña"
        >

        <button id="loginButton">
          Iniciar sesión
        </button>

        <button id="showRegisterButton">
          Crear una cuenta
        </button>

        <button id="forgotPasswordButton">
          ¿Olvidaste tu contraseña?
        </button>

      </div>

    </section>
<section id="authScreen" class="screen auth-screen" hidden>

      <div class="auth-card">

        <div class="auth-logo">
          MF
        </div>

        <h2>Bienvenido</h2>

        <p>Inicia sesión para continuar.</p>

        <input
          id="loginEmail"
          type="email"
          placeholder="Correo electrónico"
        >

        <input
          id="loginPassword"
          type="password"
          placeholder="Contraseña"
        >

        <button id="loginButton">
          Iniciar sesión
        </button>

        <button id="showRegisterButton">
          Crear una cuenta
        </button>

        <button id="forgotPasswordButton">
          ¿Olvidaste tu contraseña?
        </button>

      </div>

    </section><section id="mainScreen" class="screen app-screen" hidden>

      <header class="app-header">

        <div class="brand">
          <div class="brand-logo">MF</div>

          <div>
            <strong>Market Flash</strong>
            <small>Tu mercado digital</small>
          </div>
        </div>

        <button
          id="notificationButton"
          class="round-button"
        >
          🔔
        </button>

      </header>

      <div class="search-bar">

        <span>🔎</span>

        <input
          id="searchInput"
          type="search"
          placeholder="¿Qué estás buscando?"
        >

        <button id="filterButton">
          ⚙️
        </button>

      </div>
<div class="quick-actions">

        <button id="publishButton">
          <span>＋</span>
          <strong>Publicar</strong>
          <small>Vende tu producto</small>
        </button>

        <button id="adsButton">
          <span>📢</span>
          <strong>Publicidad</strong>
          <small>Destaca tu anuncio</small>
        </button>

      </div>

      <section class="section">

        <div class="section-title">

          <div>
            <h3>Categorías</h3>
            <p>Explora el mercado</p>
          </div>

          <button id="allCategoriesButton">
            Ver todas
          </button>

        </div>

        <div class="category-list">

          <button>📱<span>Teléfonos</span></button>

          <button>💻<span>Electrónica</span></button>

          <button>🏍️<span>Vehículos</span></button>

          <button>🏠<span>Hogar</span></button>

        </div>

      </section><section class="section">

        <div class="section-title">

          <div>
            <h3>Destacados</h3>
            <p>Productos que están brillando</p>
          </div>

          <button id="featuredMoreButton">
            Ver más
          </button>

        </div>

        <div
          id="featuredProducts"
          class="product-grid"
        ></div>

      </section>

      <section class="section">

        <div class="section-title">

          <div>
            <h3>Más recientes</h3>
            <p>Lo último publicado</p>
          </div>

          <button id="recentMoreButton">
            Ver más
          </button>

        </div>

        <div
          id="recentProducts"
          class="product-grid"
        ></div>

      </section>
