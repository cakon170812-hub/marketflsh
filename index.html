<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Flash - Crear cuenta</title>
</head>

<body>

  <main class="auth-container">

    <section class="auth-card">

      <div class="logo">
        <span>Market</span>
        <span class="flash">⚡</span>
        <span>Flash</span>
      </div>

      <h1>Crear cuenta</h1>
      <p class="subtitle">Únete a Market Flash</p>

      <form id="registerForm">

        <div class="input-group">
          <label for="nombre">Nombre</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Tu nombre"
            required
          >
        </div>

        <div class="input-group">
          <label for="apellido">Apellido</label>
          <input
            type="text"
            id="apellido"
            name="apellido"
            placeholder="Tu apellido"
            required
          >
        </div>

        <div class="input-group">
          <label for="apodo">Apodo</label>
          <input
            type="text"
            id="apodo"
            name="apodo"
            placeholder="¿Cómo quieres que te conozcan?"
            required
          >
        </div>

        <div class="input-group">
          <label for="cedula">Número de cédula</label>
          <input
            type="text"
            id="cedula"
            name="cedula"
            placeholder="000-0000000-0"
            required
          >
        </div>

        <div class="input-group">
          <label for="direccion">Dirección</label>
          <input
            type="text"
            id="direccion"
            name="direccion"
            placeholder="¿Dónde vives?"
            required
          >
        </div>

        <div class="input-group">
          <label for="telefono">
            Número de teléfono
            <span>(opcional)</span>
          </label>
          <input
            type="tel"
            id="telefono"
            name="telefono"
            placeholder="Tu número de contacto"
          >
        </div>

        <div class="input-group">
          <label for="correo">
            Correo electrónico
            <span>(opcional)</span>
          </label>
          <input
            type="email"
            id="correo"
            name="correo"
            placeholder="tucorreo@email.com"
          >
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Crea una contraseña"
            required
          >
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirmar contraseña</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Repite tu contraseña"
            required
          >
        </div>

        <label class="terms">
          <input type="checkbox" id="terms" required>
          <span>Acepto los términos y condiciones de Market Flash.</span>
        </label>

        <button type="submit" id="registerButton">
          ⚡ Crear cuenta
        </button>

      </form>

      <div class="login-link">
        <p>¿Ya tienes una cuenta?</p>
        <button type="button" id="showLogin">
          Iniciar sesión
        </button>
      </div>

    </section>

  </main>

</body>
</html>
