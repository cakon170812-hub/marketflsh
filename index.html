<style>
/* =====================================================
VARIABLES PRINCIPALES
===================================================== */

:root {
--mf-bg: #f5f7fb;
--mf-white: #ffffff;
--mf-dark: #111827;
--mf-dark-2: #1f2937;
--mf-gray: #6b7280;
--mf-light-gray: #e5e7eb;
--mf-primary: #2563eb;
--mf-primary-dark: #1d4ed8;
--mf-success: #16a34a;
--mf-danger: #dc2626;
--mf-warning: #f59e0b;
--mf-radius: 16px;
--mf-shadow: 0 8px 30px rgba(0,0,0,.08);
}

/* =====================================================
RESET
===================================================== */

* {
margin: 0;
padding: 0;
box-sizing: border-box;
-webkit-tap-highlight-color: transparent;
}

html {
scroll-behavior: smooth;
}

body {
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Roboto,
Helvetica,
Arial,
sans-serif;

background: var(--mf-bg);
color: var(--mf-dark);
min-height: 100vh;
}

button,
input,
textarea,
select {
font: inherit;
}

button {
cursor: pointer;
}

img {
max-width: 100%;
display: block;
}

a {
text-decoration: none;
color: inherit;
}

/* =====================================================
PANTALLA DE CARGA
===================================================== */

#loadingScreen {
position: fixed;
inset: 0;
z-index: 99999;
background: var(--mf-dark);
display: flex;
align-items: center;
justify-content: center;
flex-direction: column;
gap: 18px;
color: white;
}

.loading-logo {
width: 82px;
height: 82px;
border-radius: 24px;
background: var(--mf-primary);
display: flex;
align-items: center;
justify-content: center;
font-size: 30px;
font-weight: 900;
box-shadow: 0 12px 40px rgba(37,99,235,.35);
}

.loading-title {
font-size: 25px;
font-weight: 800;
}

.loading-text {
color: #cbd5e1;
font-size: 14px;
}

.loading-spinner {
width: 34px;
height: 34px;
border: 3px solid rgba(255,255,255,.25);
border-top-color: white;
border-radius: 50%;
animation: spin .8s linear infinite;
}

@keyframes spin {
to {
transform: rotate(360deg);
}
}

/* =====================================================
APP PRINCIPAL
===================================================== */

#app {
min-height: 100vh;
}

.hidden {
display: none !important;
}

/* =====================================================
HEADER
===================================================== */

.main-header {
position: sticky;
top: 0;
z-index: 5000;
background: rgba(255,255,255,.96);
backdrop-filter: blur(15px);
border-bottom: 1px solid var(--mf-light-gray);
}

.header-container {
width: min(1200px, 100%);
margin: auto;
min-height: 68px;
padding: 10px 18px;
display: flex;
align-items: center;
justify-content: space-between;
gap: 14px;
}

.brand {
display: flex;
align-items: center;
gap: 10px;
min-width: max-content;
}

.brand-logo {
width: 44px;
height: 44px;
border-radius: 13px;
background: var(--mf-primary);
color: white;
display: flex;
align-items: center;
justify-content: center;
font-weight: 900;
font-size: 17px;
}

.brand-name {
font-size: 21px;
font-weight: 900;
letter-spacing: -.5px;
}

.header-actions {
display: flex;
align-items: center;
gap: 8px;
}

.icon-button {
width: 42px;
height: 42px;
border: 1px solid var(--mf-light-gray);
border-radius: 12px;
background: white;
display: flex;
align-items: center;
justify-content: center;
font-size: 19px;
transition: .2s;
}

.icon-button:hover {
background: #f3f4f6;
}

/* =====================================================
CONTENEDOR
===================================================== */

.page-container {
width: min(1200px, 100%);
margin: auto;
padding: 22px 18px 100px;
}

/* =====================================================
HERO
===================================================== */

.hero {
background:
linear-gradient(
135deg,
#111827 0%,
#1e3a8a 100%
);

border-radius: 24px;
padding: 32px 24px;
color: white;
margin-bottom: 22px;
overflow: hidden;
position: relative;
}

.hero::after {
content: "";
position: absolute;
width: 260px;
height: 260px;
border-radius: 50%;
background: rgba(255,255,255,.06);
right: -90px;
top: -90px;
}

.hero-content {
position: relative;
z-index: 2;
max-width: 700px;
}

.hero-badge {
display: inline-flex;
align-items: center;
gap: 6px;
background: rgba(255,255,255,.12);
border: 1px solid rgba(255,255,255,.16);
padding: 7px 11px;
border-radius: 999px;
font-size: 12px;
margin-bottom: 14px;
}

.hero h1 {
font-size: clamp(30px, 6vw, 52px);
line-height: 1.05;
margin-bottom: 12px;
letter-spacing: -1.5px;
}

.hero p {
color: #dbeafe;
font-size: 15px;
line-height: 1.6;
max-width: 620px;
}

/* =====================================================
BUSCADOR
===================================================== */

.search-section {
margin-bottom: 24px;
}

.search-box {
display: flex;
align-items: center;
gap: 10px;
background: white;
border: 1px solid var(--mf-light-gray);
border-radius: 16px;
padding: 7px;
box-shadow: var(--mf-shadow);
}

.search-icon {
padding-left: 12px;
font-size: 19px;
}

.search-input {
flex: 1;
border: 0;
outline: 0;
min-width: 0;
padding: 12px 4px;
color: var(--mf-dark);
background: transparent;
}

.search-input::placeholder {
color: #9ca3af;
}

.search-button {
border: 0;
background: var(--mf-primary);
color: white;
border-radius: 12px;
padding: 12px 18px;
font-weight: 700;
}

/* =====================================================
SECCIONES
===================================================== */

.section {
margin-bottom: 28px;
}

.section-header {
display: flex;
align-items: center;
justify-content: space-between;
gap: 12px;
margin-bottom: 14px;
}

.section-title {
font-size: 21px;
font-weight: 850;
}

.section-link {
color: var(--mf-primary);
font-size: 14px;
font-weight: 700;
}

/* =====================================================
CATEGORÍAS
===================================================== */

.categories {
display: grid;
grid-template-columns: repeat(
auto-fit,
minmax(110px, 1fr)
);
gap: 10px;
}

.category-card {
background: white;
border: 1px solid var(--mf-light-gray);
border-radius: 15px;
padding: 17px 10px;
text-align: center;
transition: .2s;
}

.category-card:hover {
transform: translateY(-2px);
box-shadow: var(--mf-shadow);
}

.category-icon {
font-size: 27px;
margin-bottom: 8px;
}

.category-name {
font-size: 13px;
font-weight: 700;
}

/* =====================================================
PRODUCTOS
===================================================== */

.products-grid {
display: grid;
grid-template-columns: repeat(
auto-fill,
minmax(180px, 1fr)
);
gap: 15px;
}

.product-card {
background: white;
border: 1px solid var(--mf-light-gray);
border-radius: 17px;
overflow: hidden;
transition: .2s;
}

.product-card:hover {
transform: translateY(-3px);
box-shadow: var(--mf-shadow);
}

.product-image {
width: 100%;
aspect-ratio: 1 / 1;
object-fit: cover;
background: #e5e7eb;
}

.product-content {
padding: 13px;
}

.product-title {
font-size: 15px;
font-weight: 750;
margin-bottom: 7px;
display: -webkit-box;
-webkit-line-clamp: 2;
-webkit-box-orient: vertical;
overflow: hidden;
}

.product-price {
font-size: 19px;
font-weight: 900;
color: var(--mf-primary);
margin-bottom: 7px;
}

.product-location {
color: var(--mf-gray);
font-size: 12px;
}

/* =====================================================
ESTADO VACÍO
===================================================== */

.empty-state {
background: white;
border: 1px dashed #cbd5e1;
border-radius: 18px;
padding: 40px 20px;
text-align: center;
color: var(--mf-gray);
}

.empty-icon {
font-size: 42px;
margin-bottom: 12px;
}

.empty-title {
color: var(--mf-dark);
font-size: 17px;
font-weight: 800;
margin-bottom: 5px;
}

/* =====================================================
BOTÓN PUBLICAR
===================================================== */

.publish-button {
position: fixed;
right: 18px;
bottom: 82px;
z-index: 4000;
border: 0;
border-radius: 999px;
background: var(--mf-primary);
color: white;
padding: 14px 19px;
box-shadow: 0 10px 30px rgba(37,99,235,.3);
font-weight: 800;
display: flex;
align-items: center;
gap: 8px;
}

/* =====================================================
NAVEGACIÓN INFERIOR
===================================================== */

.bottom-nav {
position: fixed;
bottom: 0;
left: 0;
right: 0;
z-index: 4500;
height: 67px;
background: rgba(255,255,255,.97);
backdrop-filter: blur(15px);
border-top: 1px solid var(--mf-light-gray);
display: flex;
justify-content: center;
}

.bottom-nav-inner {
width: min(600px, 100%);
display: grid;
grid-template-columns: repeat(4, 1fr);
}

.nav-item {
border: 0;
background: transparent;
color: #6b7280;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 3px;
font-size: 11px;
font-weight: 650;
}

.nav-item span:first-child {
font-size: 21px;
}

.nav-item.active {
color: var(--mf-primary);
}

/* =====================================================
MODAL
===================================================== */

.modal-overlay {
position: fixed;
inset: 0;
z-index: 10000;
background: rgba(15,23,42,.65);
backdrop-filter: blur(5px);
display: flex;
align-items: flex-end;
justify-content: center;
padding: 0;
}

.modal {
width: min(600px, 100%);
max-height: 92vh;
overflow-y: auto;
background: white;
