<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - MARKET FLASH ⚡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="feed-body">
  
  <!-- HEADER SUPERIOR -->
  <header class="feed-header">
    <div class="header-logo">
      <span class="logo-icon">⚡</span>
      <h1>MARKET FLASH</h1>
    </div>
    
    <div class="header-actions">
      <button class="btn-icon" onclick="irA('notificaciones.html')">
        🔔
        <span class="badge" id="notif-badge">3</span>
      </button>
      <button class="btn-icon" onclick="irA('chat.html')">💬</button>
    </div>
  </header>

  <!-- BARRA DE BÚSQUEDA -->
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Busca iPhone, laptop, carro...">
    <button class="btn-search" onclick="buscar(document.getElementById('search-input').value)">🔍</button>
  </div>

  <!-- FILTROS RÁPIDOS -->
  <div class="filtros-rapidos">
    <button class="chip active">Para ti</button>
    <button class="chip">Tecnología</button>
    <button class="chip">Hogar</button>
    <button class="chip">Autos</button>
    <button class="chip">Ropa</button>
  </div>

  <!-- CONTENEDOR DE PRODUCTOS -->
  <main class="feed-container" id="feed-container">
    <!-- Los productos se cargarán aquí con JS en Fase 6 -->
    <div class="loading-placeholder">
      <p>Cargando productos...</p>
    </div>
  </main>

  <!-- BOTÓN + PUBLICAR - REGLA ESPECIAL -->
  <button class="btn-publicar" onclick="publicarProducto()">+</button>

  <!-- NAVEGACIÓN INFERIOR -->
  <nav class="bottom-nav">
    <button class="nav-item active" id="nav-inicio" onclick="navegar('inicio')">
      <span>🏠</span>
      <p>Inicio</p>
    </button>
    <button class="nav-item" id="nav-buscar" onclick="navegar('buscar')">
      <span>🔍</span>
      <p>Buscar</p>
    </button>
    <div class="nav-spacer"></div>
    <button class="nav-item" id="nav-notificaciones" onclick="navegar('notificaciones')">
      <span>🔔</span>
      <p>Alertas</p>
    </button>
    <button class="nav-item" id="nav-perfil" onclick="navegar('perfil')">
      <span>👤</span>
      <p>Perfil</p>
    </button>
  </nav>  <!-- EJEMPLO DE TARJETA DE PRODUCTO -->
  <!-- En Fase 6 esto se generará dinámico con JS + Supabase -->
  <template id="template-producto">
    <div class="producto-card">
      
      <!-- IMAGEN -->
      <div class="producto-img-container">
        <img src="https://via.placeholder.com/300" alt="Producto" class="producto-img">
        <button class="btn-save" onclick="toggleGuardar('id')">🔖</button>
        <span class="badge-precio">RD$ 25,000</span>
      </div>

      <!-- INFO -->
      <div class="producto-info">
        <h3 class="producto-titulo">iPhone 15 Pro Max 256GB</h3>
        <p class="producto-ubicacion">📍 Santo Domingo</p>
        <p class="producto-tiempo">Hace 2 horas</p>
      </div>

      <!-- ACCIONES -->
      <div class="producto-actions">
        <button class="btn-like" id="like-id" onclick="toggleLike('id')">❤️ 24</button>
        <button class="btn-whatsapp" onclick="contactarWhatsApp('809-555-1234')">
          💬 Contactar
        </button>
      </div>
    </div>
  </template>

  <!-- GRID DE PRODUCTOS EJEMPLO -->
  <div class="productos-grid">
    
    <div class="producto-card">
      <div class="producto-img-container">
        <img src="https://via.placeholder.com/300x300/00F5FF/000" alt="Laptop" class="producto-img">
        <button class="btn-save">🔖</button>
        <span class="badge-precio">RD$ 45,000</span>
      </div>
      <div class="producto-info">
        <h3 class="producto-titulo">MacBook Air M2 2023</h3>
        <p class="producto-ubicacion">📍 Santiago</p>
        <p class="producto-tiempo">Hace 5 horas</p>
      </div>
      <div class="producto-actions">
        <button class="btn-like">❤️ 56</button>
        <button class="btn-whatsapp">💬 Contactar</button>
      </div>
    </div>

    <div class="producto-card">
      <div class="producto-img-container">
        <img src="https://via.placeholder.com/300x300/FF6B00/000" alt="Moto" class="producto-img">
        <button class="btn-save">🔖</button>
        <span class="badge-precio">RD$ 120,000</span>
      </div>
      <div class="producto-info">
        <h3 class="producto-titulo">Honda CG 150 2022</h3>
        <p class="producto-ubicacion">📍 El Cachón</p>
        <p class="producto-tiempo">Ayer</p>
      </div>
      <div class="producto-actions">
        <button class="btn-like">❤️ 12</button>
        <button class="btn-whatsapp">💬 Contactar</button>
      </div>
    </div>

  </div>
  <script src="script.js"></script>
  <script>
    // Verificar sesión al cargar
    document.addEventListener('DOMContentLoaded', () => {
      const usuario = obtenerSesion();
      if(!usuario) {
        irA('auth.html');
      }
      
      // Simular carga de productos FASE 1
      setTimeout(() => {
        document.querySelector('.loading-placeholder').style.display = 'none';
      }, 1000);
    });

    function contactarWhatsApp(numero) {
      const mensaje = encodeURIComponent('Hola, vi tu producto en MARKET FLASH ⚡. ¿Sigue disponible?');
      window.open(`https://wa.me/1${numero.replace(/[^0-9]/g, '')}?text=${mensaje}`, '_blank');
    }
  </script>

  <style>
    /* ESTILOS ESPECIFICOS DEL FEED */
    .feed-body { background: var(--bg-dark); padding-bottom: 100px; }
    
    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: var(--card-bg);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    
    .header-logo { display: flex; align-items: center; gap: 8px; }
    .logo-icon { font-size: 24px; }
    .header-logo h1 { font-size: 18px; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .header-actions { display: flex; gap: 15px; }
    .btn-icon { background: none; border: none; font-size: 20px; color: var(--text); position: relative; }
    .badge { position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; font-size: 10px; border-radius: 50%; width: 16px; height: 16px; }
    
    .search-bar { display: flex; padding: 15px 20px; gap: 10px; }
    .search-bar input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #333; background: var(--card-bg); color: var(--text); }
    .btn-search { padding: 12px 16px; background: var(--primary); border: none; border-radius: 10px; }
    
    .filtros-rapidos { display: flex; gap: 10px; padding: 0 20px 15px; overflow-x: auto; }
    .chip { padding: 8px 16px; background: var(--card-bg); border: 1px solid #333; border-radius: 20px; color: var(--text); white-space: nowrap; }
    .chip.active { background: var(--primary); color: var(--text-dark); }
    
    .productos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
    .producto-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; }
    .producto-img-container { position: relative; }
    .producto-img { width: 100%; height: 180px; object-fit: cover; }
    .btn-save { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); border: none; border-radius: 50%; width: 35px; height: 35px; }
    .badge-precio { position: absolute; bottom: 10px; left: 10px; background: var(--success); color: var(--text-dark); padding: 5px 10px; border-radius: 8px; font-weight: 700; }
    .producto-info { padding: 12px; }
    .producto-titulo { font-size: 14px; margin-bottom: 5px; }
    .producto-ubicacion, .producto-tiempo { font-size: 12px; color: var(--text-gray); }
    .producto-actions { display: flex; padding: 10px 12px; border-top: 1px solid #333; gap: 10px; }
    .btn-like { flex: 1; background: none; border: 1px solid #333; border-radius: 8px; padding: 8px; color: var(--text); }
    .btn-whatsapp { flex: 2; background: var(--success); border: none; border-radius: 8px; padding: 8px; color: var(--text-dark); font-weight: 700; }
    
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; background: var(--card-bg); padding: 10px 0; border-top: 1px solid #333; }
    .nav-item { background: none; border: none; color: var(--text-gray); display: flex; flex-direction: column; align-items: center; font-size: 12px; }
    .nav-item.active { color: var(--primary); }
    .nav-spacer { width: 70px; }
  </style>
</body>
</html>
