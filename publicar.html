<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicar Producto - MARKET FLASH ⚡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="publicar-body">
  
  <!-- HEADER -->
  <header class="publicar-header">
    <button class="btn-back" onclick="irA('feed.html')">←</button>
    <h2>Publicar Producto</h2>
    <button class="btn-text" onclick="guardarBorrador()">Borrador</button>
  </header>

  <form class="publicar-form" id="form-publicar">
    
    <!-- SUBIR FOTOS -->
    <section class="form-section">
      <h3>Fotos del Producto *</h3>
      <p class="form-info">Agrega hasta 5 fotos. La primera será la principal.</p>
      
      <div class="upload-grid" id="upload-grid">
        <label class="upload-box">
          <input type="file" accept="image/*" multiple onchange="previsualizarFotos(event)">
          <span>📷</span>
          <p>Agregar</p>
        </label>
      </div>
    </section>

    <!-- DATOS BASICOS -->
    <section class="form-section">
      <h3>Detalles del Producto</h3>
      
      <div class="input-group">
        <label>Título del Producto *</label>
        <input type="text" id="pub-titulo" placeholder="Ej: iPhone 15 Pro Max 256GB" maxlength="60">
        <small id="contador-titulo">0/60</small>
      </div>

      <div class="input-group">
        <label>Descripción *</label>
        <textarea id="pub-descripcion" placeholder="Describe tu producto: estado, características..." rows="4" maxlength="500"></textarea>
        <small id="contador-desc">0/500</small>
      </div>

      <div class="input-group doble">
        <div>
          <label>Precio RD$ *</label>
          <input type="number" id="pub-precio" placeholder="25000">
        </div>
        <div>
          <label>Categoría *</label>
          <select id="pub-categoria">
            <option value="">Seleccionar</option>
            <option value="tecnologia">Tecnología</option>
            <option value="hogar">Hogar</option>
            <option value="autos">Autos y Motos</option>
            <option value="ropa">Ropa y Accesorios</option>
            <option value="deportes">Deportes</option>
          </select>
        </div>
      </div>
    </section>    <!-- UBICACION Y ESTADO -->
    <section class="form-section">
      <h3>Ubicación y Estado</h3>
      
      <div class="input-group">
        <label>Ubicación *</label>
        <input type="text" id="pub-ubicacion" placeholder="Ej: Santo Domingo, El Cachón">
        <small>Tu ubicación ayuda a vender más rápido</small>
      </div>

      <div class="input-group">
        <label>Condición del Producto *</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="condicion" value="nuevo" checked>
            <span>Nuevo</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="condicion" value="usado">
            <span>Usado - Como Nuevo</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="condicion" value="usado-bueno">
            <span>Usado - Bueno</span>
          </label>
        </div>
      </div>
    </section>

    <!-- CONTACTO -->
    <section class="form-section">
      <h3>Datos de Contacto</h3>
      <p class="form-info">Tu WhatsApp será visible para que te contacten directo</p>
      
      <div class="input-group">
        <label>WhatsApp *</label>
        <input type="tel" id="pub-whatsapp" placeholder="809-XXX-XXXX">
      </div>

      <label class="checkbox">
        <input type="checkbox" id="pub-mostrar-telefono" checked> 
        Mostrar mi número en la publicación
      </label>
    </section>

    <!-- TERMINOS -->
    <section class="form-section">
      <label class="checkbox">
        <input type="checkbox" id="pub-terminos"> 
        Acepto las <a href="#">Políticas de Publicación</a> de MARKET FLASH ⚡
      </label>
    </section>

    <!-- BOTONES -->
    <div class="publicar-actions">
      <button type="button" class="btn-secondary" onclick="irA('feed.html')">Cancelar</button>
      <button type="button" class="btn-primary btn-large" onclick="publicarProducto()">Publicar Ahora</button>
    </div>

  </form>
  <script src="script.js"></script>
  <script>
    // Verificar sesión
    document.addEventListener('DOMContentLoaded', () => {
      const usuario = obtenerSesion();
      if(!usuario) irA('auth.html');
      
      document.getElementById('pub-whatsapp').value = usuario.whatsapp || '';

      // Contadores
      document.getElementById('pub-titulo').oninput = e => {
        document.getElementById('contador-titulo').textContent = `${e.target.value.length}/60`;
      }
      document.getElementById('pub-descripcion').oninput = e => {
        document.getElementById('contador-desc').textContent = `${e.target.value.length}/500`;
      }
    });

    let fotos = [];
    function previsualizarFotos(event) {
      const files = Array.from(event.target.files);
      fotos = [...fotos, ...files].slice(0,5);
      
      const grid = document.getElementById('upload-grid');
      grid.innerHTML = '';
      fotos.forEach((file, i) => {
        const reader = new FileReader();
        reader.onload = e => {
          grid.innerHTML += `
            <div class="upload-preview">
              <img src="${e.target.result}">
              <button type="button" onclick="eliminarFoto(${i})">×</button>
            </div>
          `;
        }
        reader.readAsDataURL(file);
      });
      grid.innerHTML += `
        <label class="upload-box">
          <input type="file" accept="image/*" multiple onchange="previsualizarFotos(event)">
          <span>📷</span>
          <p>Agregar</p>
        </label>
      `;
    }

    function eliminarFoto(index) {
      fotos.splice(index, 1);
      previsualizarFotos({target: {files: fotos}});
    }

    function publicarProducto() {
      const titulo = document.getElementById('pub-titulo').value;
      const precio = document.getElementById('pub-precio').value;
      const terminos = document.getElementById('pub-terminos').checked;

      if(!titulo || !precio || fotos.length === 0 || !terminos) {
        alert('Completa los campos obligatorios *');
        return;
      }
      
      // FASE 1: Solo simular guardado
      alert('✅ Producto publicado correctamente!');
      irA('perfil.html');
    }

    function guardarBorrador() {
      alert('Borrador guardado');
      irA('perfil.html');
    }
  </script>

  <style>
    .publicar-body { background: var(--bg-dark); padding-bottom: 120px; }
    .publicar-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--card-bg); position: sticky; top: 0; }
    .form-section { background: var(--card-bg); padding: 20px; margin-bottom: 15px; }
    .input-group { margin-bottom: 20px; display: flex; flex-direction: column; }
    .input-group.doble { flex-direction: row; gap: 15px; }
    .input-group label { margin-bottom: 8px; font-weight: 600; }
    .input-group input, .input-group select, .input-group textarea { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: var(--text); }
    .upload-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .upload-box, .upload-preview { aspect-ratio: 1; border: 2px dashed #333; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    .upload-box input { display: none; }
    .upload-preview img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
    .upload-preview button { position: absolute; top: 5px; right: 5px; background: var(--danger); border: none; border-radius: 50%; width: 24px; height: 24px; color: white; }
    .radio-group { display: flex; flex-direction: column; gap: 10px; }
    .checkbox { display: flex; gap: 10px; align-items: center; }
    .publicar-actions { display: flex; gap: 15px; padding: 20px; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); }
    .btn-text { background: none; border: none; color: var(--primary); }
  </style>
</body>
</html>
