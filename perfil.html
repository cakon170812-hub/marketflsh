<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - MARKET FLASH ⚡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="perfil-body">
  
  <!-- HEADER -->
  <header class="perfil-header">
    <button class="btn-back" onclick="irA('feed.html')">←</button>
    <h2>Mi Perfil</h2>
    <button class="btn-icon" onclick="irA('configuracion.html')">⚙️</button>
  </header>

  <!-- INFO USUARIO -->
  <section class="perfil-info">
    <div class="perfil-avatar">
      <img src="https://via.placeholder.com/100" alt="Avatar" id="avatar-img">
      <button class="btn-edit-avatar" onclick="cambiarAvatar()">📷</button>
    </div>
    
    <h3 id="perfil-nombre">Usuario Demo</h3>
    <p id="perfil-email">demo@marketflash.com</p>
    <p id="perfil-whatsapp">📱 809-XXX-XXXX</p>
    
    <div class="perfil-stats">
      <div class="stat">
        <strong id="stat-productos">12</strong>
        <span>Productos</span>
      </div>
      <div class="stat">
        <strong id="stat-ventas">8</strong>
        <span>Vendidos</span>
      </div>
      <div class="stat">
        <strong id="stat-likes">124</strong>
        <span>Likes</span>
      </div>
    </div>

    <button class="btn-primary btn-large" onclick="irA('editar-perfil.html')">Editar Perfil</button>
  </section>

  <!-- TABS MIS PRODUCTOS -->
  <div class="perfil-tabs">
    <button class="tab-btn active" onclick="cambiarTabPerfil('activos')">Activos</button>
    <button class="tab-btn" onclick="cambiarTabPerfil('vendidos')">Vendidos</button>
    <button class="tab-btn" onclick="cambiarTabPerfil('guardados')">Guardados</button>
  </div>

  <!-- CONTENEDOR PRODUCTOS DEL USUARIO -->
  <main class="perfil-productos" id="perfil-productos-container">    <!-- TAB ACTIVOS -->
    <div id="tab-activos" class="tab-content">
      <div class="producto-mini">
        <img src="https://via.placeholder.com/80" alt="Producto">
        <div class="producto-mini-info">
          <h4>iPhone 15 Pro Max</h4>
          <p>RD$ 25,000 • Hace 2 horas</p>
          <span class="badge-estado activo">Activo</span>
        </div>
        <div class="producto-mini-actions">
          <button onclick="editarProducto('id1')">✏️</button>
          <button onclick="desactivarProducto('id1')">👁️</button>
          <button onclick="eliminarProducto('id1')">🗑️</button>
        </div>
      </div>

      <div class="producto-mini">
        <img src="https://via.placeholder.com/80" alt="Producto">
        <div class="producto-mini-info">
          <h4>MacBook Air M2</h4>
          <p>RD$ 45,000 • Hace 5 horas</p>
          <span class="badge-estado activo">Activo</span>
        </div>
        <div class="producto-mini-actions">
          <button onclick="editarProducto('id2')">✏️</button>
          <button onclick="desactivarProducto('id2')">👁️</button>
          <button onclick="eliminarProducto('id2')">🗑️</button>
        </div>
      </div>
    </div>

    <!-- TAB VENDIDOS -->
    <div id="tab-vendidos" class="tab-content hidden">
      <div class="producto-mini vendido">
        <img src="https://via.placeholder.com/80" alt="Producto">
        <div class="producto-mini-info">
          <h4>PS5 Slim</h4>
          <p>RD$ 30,000 • Vendido hace 3 días</p>
          <span class="badge-estado vendido">Vendido</span>
        </div>
      </div>
    </div>

    <!-- TAB GUARDADOS -->
    <div id="tab-guardados" class="tab-content hidden">
      <div class="producto-mini">
        <img src="https://via.placeholder.com/80" alt="Producto">
        <div class="producto-mini-info">
          <h4>Honda CG 150</h4>
          <p>RD$ 120,000 • El Cachón</p>
        </div>
        <button onclick="quitarGuardado('id3')">❌</button>
      </div>
    </div>
  </main>
  <!-- BOTÓN CERRAR SESIÓN -->
  <div class="perfil-footer">
    <button class="btn-danger btn-large" onclick="cerrarSesion()">Cerrar Sesión</button>
  </div>

  <!-- NAVEGACIÓN INFERIOR -->
  <nav class="bottom-nav">
    <button class="nav-item" onclick="irA('feed.html')">
      <span>🏠</span>
      <p>Inicio</p>
    </button>
    <button class="nav-item" onclick="irA('buscar.html')">
      <span>🔍</span>
      <p>Buscar</p>
    </button>
    <div class="nav-spacer"></div>
    <button class="nav-item" onclick="irA('notificaciones.html')">
      <span>🔔</span>
      <p>Alertas</p>
    </button>
    <button class="nav-item active">
      <span>👤</span>
      <p>Perfil</p>
    </button>
  </nav>

  <script src="script.js"></script>
  <script>
    // Cargar datos del usuario
    document.addEventListener('DOMContentLoaded', () => {
      const usuario = obtenerSesion();
      if(!usuario) irA('auth.html');
      
      document.getElementById('perfil-nombre').textContent = usuario.nombre;
      document.getElementById('perfil-email').textContent = usuario.email;
      document.getElementById('perfil-whatsapp').textContent = '📱 ' + (usuario.whatsapp || 'No registrado');
    });

    function cambiarTabPerfil(tab) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
      document.querySelectorAll('.perfil-tabs .tab-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById('tab-' + tab).classList.remove('hidden');
      event.target.classList.add('active');
    }

    function cerrarSesion() {
      localStorage.removeItem('marketflash_session');
      irA('auth.html');
    }

    function editarProducto(id) { alert('Editar producto ' + id); }
    function eliminarProducto(id) { if(confirm('¿Eliminar este producto?')) alert('Eliminado'); }
    function desactivarProducto(id) { alert('Producto ocultado'); }
  </script>

  <style>
    .perfil-body { background: var(--bg-dark); padding-bottom: 100px; }
    .perfil-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--card-bg); }
    .perfil-info { text-align: center; padding: 30px 20px; background: var(--card-bg); margin-bottom: 15px; }
    .perfil-avatar { position: relative; display: inline-block; margin-bottom: 15px; }
    .perfil-avatar img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--primary); }
    .btn-edit-avatar { position: absolute; bottom: 0; right: 0; background: var(--primary); border: none; border-radius: 50%; width: 30px; height: 30px; }
    .perfil-stats { display: flex; justify-content: space-around; margin: 20px 0; }
    .stat { display: flex; flex-direction: column; }
    .stat strong { font-size: 20px; color: var(--primary); }
    .perfil-tabs { display: flex; background: var(--card-bg); padding: 10px; gap: 10px; }
    .producto-mini { display: flex; align-items: center; gap: 12px; padding: 15px; background: var(--card-bg); margin: 10px 20px; border-radius: 12px; }
    .producto-mini img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; }
    .producto-mini-info { flex: 1; }
    .badge-estado { padding: 4px 8px; border-radius: 6px; font-size: 12px; }
    .badge-estado.activo { background: var(--success); color: var(--text-dark); }
    .badge-estado.vendido { background: var(--text-gray); color: white; }
    .producto-mini-actions button { background: none; border: none; font-size: 18px; }
    .perfil-footer { padding: 20px; }
    .btn-danger { background: var(--danger); }
  </style>
</body>
</html>
