<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar - MARKET FLASH ⚡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="buscar-body">
  
  <!-- HEADER CON BUSCADOR -->
  <header class="buscar-header">
    <button class="btn-back" onclick="irA('feed.html')">←</button>
    <div class="search-container">
      <input type="search" id="buscador-input" placeholder="Busca: iPhone, laptop, carro..." autofocus>
      <button class="btn-search" onclick="buscarProductos()">🔍</button>
    </div>
  </header>

  <!-- FILTROS RAPIDOS -->
  <section class="filtros-rapidos">
    <button class="chip active" onclick="filtrarCategoria('todos')">Todos</button>
    <button class="chip" onclick="filtrarCategoria('tecnologia')">📱 Tecnología</button>
    <button class="chip" onclick="filtrarCategoria('autos')">🚗 Autos</button>
    <button class="chip" onclick="filtrarCategoria('hogar')">🏠 Hogar</button>
    <button class="chip" onclick="filtrarCategoria('ropa')">👕 Ropa</button>
  </section>

  <!-- BOTON FILTROS AVANZADOS -->
  <div class="filtros-avanzados-btn">
    <button onclick="toggleFiltros()">Filtros Avanzados ⚙️</button>
  </div>

  <!-- PANEL FILTROS AVANZADOS -->
  <div id="panel-filtros" class="panel-filtros hidden">
    <h3>Refinar Búsqueda</h3>
    
    <div class="filtro-group">
      <label>Rango de Precio</label>
      <div class="rango-precio">
        <input type="number" id="precio-min" placeholder="Mín RD$">
        <span>-</span>
        <input type="number" id="precio-max" placeholder="Máx RD$">
      </div>
    </div>

    <div class="filtro-group">
      <label>Ubicación</label>
      <select id="filtro-ubicacion">
        <option value="">Todo el país</option>
        <option value="santo-domingo">Santo Domingo</option>
        <option value="santiago">Santiago</option>
        <option value="la-vega">La Vega</option>
        <option value="el-cachon">El Cachón</option>
      </select>
    </div>

    <div class="filtro-group">
      <label>Condición</label>
      <div class="checkbox-group">
        <label><input type="checkbox" value="nuevo"> Nuevo</label>
        <label><input type="checkbox" value="usado"> Usado</label>
      </div>
    </div>

    <div class="filtro-group">
      <label>Ordenar por</label>
      <select id="filtro-orden">
        <option value="recientes">Más Recientes</option>
        <option value="precio-menor">Precio: Menor a Mayor</option>
        <option value="precio-mayor">Precio: Mayor a Menor</option>
      </select>
    </div>

    <button class="btn-primary btn-large" onclick="aplicarFiltros()">Aplicar Filtros</button>
  </div>

  <!-- RESULTADOS -->
  <main class="resultados-container" id="resultados">
    <p class="no-resultados">Escribe algo para buscar productos ⚡</p>
  </main>  </main>

  <script src="script.js"></script>
  <script>
    let categoriaActual = 'todos';

    document.addEventListener('DOMContentLoaded', () => {
      const usuario = obtenerSesion();
      if(!usuario) irA('auth.html');

      // Buscar al dar Enter
      document.getElementById('buscador-input').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') buscarProductos();
      });
    });

    function toggleFiltros() {
      document.getElementById('panel-filtros').classList.toggle('hidden');
    }

    function filtrarCategoria(cat) {
      categoriaActual = cat;
      document.querySelectorAll('.filtros-rapidos .chip').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      buscarProductos();
    }

    function buscarProductos() {
      const query = document.getElementById('buscador-input').value.toLowerCase();
      const resultados = document.getElementById('resultados');
      
      // FASE 1: Simular resultados. En Fase 2 conectamos a BD
      const productosDemo = [
        {id: 1, titulo: 'iPhone 15 Pro Max', precio: 25000, ubicacion: 'El Cachón', img: 'https://via.placeholder.com/150'},
        {id: 2, titulo: 'MacBook Air M2', precio: 45000, ubicacion: 'Santo Domingo', img: 'https://via.placeholder.com/150'},
        {id: 3, titulo: 'Honda CG 150', precio: 120000, ubicacion: 'Santiago', img: 'https://via.placeholder.com/150'}
      ];

      let filtrados = productosDemo.filter(p => 
        p.titulo.toLowerCase().includes(query) && 
        (categoriaActual === 'todos' || p.titulo.toLowerCase().includes(categoriaActual))
      );

      if(filtrados.length === 0) {
        resultados.innerHTML = '<p class="no-resultados">No se encontraron productos 😕</p>';
        return;
      }

      resultados.innerHTML = '<div class="productos-grid">' + 
        filtrados.map(p => `
          <div class="producto-card" onclick="verDetalle(${p.id})">
            <img src="${p.img}" class="producto-img">
            <div class="producto-info">
              <h4 class="producto-titulo">${p.titulo}</h4>
              <p class="badge-precio">RD$ ${p.precio.toLocaleString()}</p>
              <p class="producto-ubicacion">📍 ${p.ubicacion}</p>
            </div>
          </div>
        `).join('') + 
      '</div>';
    }

    function aplicarFiltros() {
      buscarProductos();
      toggleFiltros();
    }

    function verDetalle(id) {
      alert('Ver detalle del producto ' + id + ' - Fase 2');
    }
  </script>
  <style>
    .buscar-body { background: var(--bg-dark); padding-bottom: 100px; }
    
    .buscar-header { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      padding: 15px 20px; 
      background: var(--card-bg); 
      position: sticky; 
      top: 0; 
      z-index: 50;
    }
    .search-container { flex: 1; display: flex; gap: 10px; }
    .search-container input { 
      flex: 1; 
      padding: 12px; 
      border-radius: 10px; 
      border: 1px solid #333; 
      background: #1a1a1a; 
      color: var(--text);
      font-size: 15px;
    }
    .btn-search { padding: 12px 16px; background: var(--primary); border: none; border-radius: 10px; }
    
    .filtros-avanzados-btn { padding: 10px 20px; text-align: center; }
    .filtros-avanzados-btn button { 
      background: var(--card-bg); 
      border: 1px solid #333; 
      color: var(--text); 
      padding: 10px 20px; 
      border-radius: 8px; 
    }
    
    .panel-filtros { 
      background: var(--card-bg); 
      padding: 20px; 
      margin: 0 20px 15px; 
      border-radius: 12px;
    }
    .panel-filtros h3 { margin-bottom: 15px; }
    .filtro-group { margin-bottom: 20px; }
    .filtro-group label { display: block; margin-bottom: 8px; font-weight: 600; }
    .rango-precio { display: flex; align-items: center; gap: 10px; }
    .rango-precio input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: var(--text); }
    .checkbox-group { display: flex; gap: 20px; }
    
    .resultados-container { padding: 20px; }
    .no-resultados { text-align: center; color: var(--text-gray); padding: 40px 20px; }
    
    .hidden { display: none; }
  </style>

  <!-- NAVEGACIÓN INFERIOR -->
  <nav class="bottom-nav">
    <button class="nav-item" onclick="irA('feed.html')">
      <span>🏠</span>
      <p>Inicio</p>
    </button>
    <button class="nav-item active">
      <span>🔍</span>
      <p>Buscar</p>
    </button>
    <div class="nav-spacer"></div>
    <button class="nav-item" onclick="irA('notificaciones.html')">
      <span>🔔</span>
      <p>Alertas</p>
    </button>
    <button class="nav-item" onclick="irA('perfil.html')">
      <span>👤</span>
      <p>Perfil</p>
    </button>
  </nav>
</body>
</html>
